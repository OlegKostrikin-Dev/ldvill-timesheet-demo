<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LD Vill — веб-кабинет владельца · прототип</title>
<meta name="theme-color" content="#213946">
<link rel="manifest" href="owner-web.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<!--
  Кликабельный макет веб-кабинета владельца LD Vill (Дорин) на компьютере (TG-451). Утверждает Oleg; по нему потом
  строится кабинет в движке. Продолжает принятые макеты: место Дорина в timesheet-pwa.html (лента периодов, день
  объекта, отчёты, настройки), вход по QR (login-qr.html, TG-443 — «Люди» и «Выдать доступ» слово в слово) и рабочее
  место бригадира (foreman.html, TG-444 — итог смены, те же смены 19 и 20 ноября).

  Что здесь:
    · окно браузера с кабинетом в оболочке движка: шапка, полоса вкладок, страница раздела с заголовком, пилюлями
      и карточками — как вкладки портлета движка; цвета — как на стенде сейчас (нейтральные движка), на пульте
      переключатель «Цвета LD Vill»;
    · шесть вкладок: Сегодня · История · Объекты · Люди · Отчёты | Настройки;
    · пульт играет остальной мир (бригадиры открывают и закрывают смены, человек входит по коду, проходит время);
      журнал пульта говорит, что произошло и что делал бы движок; решения и вопросы — в пульте и в записке под макетом.
  Адрес принимает ?lang=hu|ru|en&tab=today|hist|objs|people|rep|set&brand=engine|ld&go=<экран>,<экран>… — go открывает
  экраны по цепочке «хлебных крошек», например go=obj:fer,dayobj:2026-11-20:fer.

  Тексты кабинета — в таблице T (hu / ru / en); пульт и записка — по-русски. Данные выдуманы, сервера нет.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<style>
  /* ══ ТОКЕНЫ LD VILL — как в login-qr.html (служебное, QR, предупреждения) ══ */
  :root{
    --c-dark:#213946; --c-ink:#343A42; --c-muted:#6B7680; --c-line:#E2E7E9; --c-ground:#F5F7F7;
    --c-lime:#C7FF00; --c-lime-ink:#7FA300;
    --c-warn:#E8A100; --c-warn-bg:#FFF6DD; --c-warn-ink:#7A5400;
    --c-bad:#D64545; --c-bad-bg:#FDECEC; --c-ok:#2E9E5B; --c-ok-bg:#E7F6EE;
    --font:"Plus Jakarta Sans","Segoe UI",Arial,sans-serif;
  }
  /* ══ БРЕНД В ОБОЛОЧКЕ ДВИЖКА ══
     По умолчанию — нейтральные цвета движка (brand-default/tokens.json: accent-600, brandDark), как у LD Vill на стенде
     сейчас; «Цвета LD Vill» на пульте — как станет, когда у картриджа появится своя палитра (TG-416 это уже умеет). */
  .app{--b-600:#2563EB; --b-on:#fff; --b-line:#2563EB; --b-dark:#1E293B; --b-soft:#EFF6FF; --b-ink:#1D4ED8;
    --b-font:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; --b-mark:#1E293B; --b-mark-ink:#fff}
  .app.ld{--b-600:#C7FF00; --b-on:#213946; --b-line:#7FA300; --b-dark:#213946; --b-soft:#F4FFD6; --b-ink:#4F6600;
    --b-font:var(--font); --b-mark:#213946; --b-mark-ink:#C7FF00}

  *{box-sizing:border-box}
  html,body{margin:0;background:#E9EEF0;color:var(--c-ink);font-family:var(--font);-webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit;cursor:pointer}
  input{font:inherit}

  /* ══ СЛУЖЕБНОЕ (не часть кабинета) ══ */
  .deck{max-width:1760px;margin:0 auto;padding:20px 20px 40px}
  .deck > h1{font-size:22px;margin:0 0 4px;font-weight:800}
  .deck > .sub{color:var(--c-muted);margin:0 0 16px;font-size:14px;max-width:1000px}
  .work{display:flex;gap:24px;align-items:flex-start}
  .seg{display:inline-flex;border:1px solid #C9D2D6;background:#fff}
  .seg button{border:0;background:none;padding:7px 12px;font-size:13px;font-weight:600}
  .seg button[aria-pressed="true"]{background:var(--c-dark);color:#fff}
  .notes{max-width:1100px;margin-top:28px;background:#fff;border:1px solid var(--c-line);padding:18px 20px;font-size:14px;line-height:1.5}
  .notes h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--c-muted);margin:18px 0 6px;font-family:ui-monospace,Menlo,monospace}
  .notes h2:first-child{margin-top:0}
  .notes table{border-collapse:collapse;width:100%;font-size:13px}
  .notes td,.notes th{border-top:1px solid var(--c-line);padding:5px 6px 5px 0;vertical-align:top;text-align:left}
  .notes code{font-size:12px;background:var(--c-ground);padding:0 3px}
  .notes tr.open td{background:var(--c-warn-bg)}
  .tag{display:inline-block;font-size:10px;font-weight:700;padding:1px 5px;letter-spacing:.04em;text-transform:uppercase}
  .tag.have{background:var(--c-ok-bg);color:var(--c-ok)} .tag.ask{background:var(--c-warn-bg);color:var(--c-warn-ink)} .tag.cli{background:var(--c-ground);color:var(--c-muted)}

  /* окно браузера */
  .win{flex:1;min-width:1100px;height:900px;background:#fff;border:1px solid #C3CDD3;border-radius:10px;overflow:hidden;
    box-shadow:0 18px 40px rgba(0,0,0,.14);display:flex;flex-direction:column;position:relative}
  .chrome{flex:none;height:38px;background:#E3E8EC;display:flex;align-items:center;gap:7px;padding:0 14px;border-bottom:1px solid #D3DADF}
  .chrome i{width:11px;height:11px;border-radius:50%;background:#C9D2D6}
  .chrome .url{flex:1;max-width:620px;margin:0 auto;background:#fff;border-radius:6px;font-size:12px;color:#475569;padding:4px 12px;
    font-family:ui-monospace,Menlo,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* ══ ОБОЛОЧКА ДВИЖКА: шапка, полоса вкладок, страница ══ */
  .app{flex:1;display:flex;flex-direction:column;min-height:0;font-family:var(--b-font);color:#111827;position:relative}
  .hdr{flex:none;height:64px;background:#fff;border-bottom:1px solid #E5E7EB;box-shadow:0 1px 2px rgba(16,24,40,.04);
    display:flex;align-items:center;gap:16px;padding:0 40px}
  .brand{display:flex;align-items:center;gap:10px;margin-right:auto}
  .mark{width:34px;height:34px;border-radius:8px;background:var(--b-mark);color:var(--b-mark-ink);display:grid;place-items:center;font-weight:800;font-size:13px;letter-spacing:-.02em}
  .brand b{font-size:16px;font-weight:800;display:block;line-height:1.1}
  .brand span{font-size:12px;color:#6B7280}
  .bell{position:relative;border:0;background:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:#4B5563}
  .bell:hover{background:#F3F4F6}
  .bell svg{width:20px;height:20px}
  .bell em{position:absolute;top:4px;right:3px;min-width:18px;height:18px;border-radius:9px;background:#DC2626;color:#fff;font-style:normal;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px}
  .me{display:flex;align-items:center;gap:10px}
  .ava-r{width:36px;height:36px;border-radius:50%;background:var(--b-soft);color:var(--b-ink);display:grid;place-items:center;font-weight:800;font-size:14px}
  .me b{display:block;font-size:14px;line-height:1.15} .me span{font-size:12px;color:#6B7280}

  .tabbar{flex:none;background:#F8F9FA;border-bottom:1px solid #E2E8F0;display:flex;justify-content:center}
  .tabbar button{border:0;border-bottom:2px solid transparent;background:none;padding:14px 20px;font-size:13px;font-weight:500;color:#6B7280}
  .tabbar button.on{color:#101828;border-bottom-color:var(--b-line)}
  .tabbar button:hover{color:#101828}
  .tabbar .sep{width:1px;background:#CBD5E1;margin:12px 8px}

  .page{flex:1;overflow:auto;background:#F8F9FA}
  .inner{max-width:1160px;margin:0 auto;padding:22px 40px 48px;display:flex;flex-direction:column;gap:16px}
  .crumbs{font-size:13px;color:#6B7280;display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:-8px}
  .crumbs button{border:0;background:none;padding:0;color:var(--b-ink);font-weight:600}
  .crumbs button:hover{text-decoration:underline}
  .sh{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .sh .over{font-size:13px;color:#6B7280}
  .sh h1{font-size:22px;font-weight:800;margin:2px 0 0;color:#111827;letter-spacing:-.01em}
  .acts-r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .pills{display:flex;gap:6px;flex-wrap:wrap}
  .pills button{border:1px solid #E5E7EB;background:#fff;color:#6B7280;border-radius:999px;padding:6px 16px;font-size:13px;font-weight:500}
  .pills button.on{background:var(--b-dark);border-color:var(--b-dark);color:#fff}
  .pills .gap{width:12px}

  /* одна система карточек: белая карточка, заголовок H2, внутри таблица или пары «подпись — значение» */
  .card{background:#fff;border:1px solid #E5E7EB;border-radius:12px;padding:18px 20px}
  .card > h2{font-size:15px;font-weight:700;margin:0 0 12px;color:#111827;display:flex;align-items:center;gap:8px}
  .card > h2 .cnt{font-weight:500;color:#9CA3AF}
  .h2link{border:0;background:none;padding:0;font:inherit;color:inherit;display:inline-flex;align-items:center;gap:4px}
  .h2link:hover{color:var(--b-ink)}
  .card.tight{padding:6px 20px 4px}
  .card.tight > h2{margin:12px 0 6px}
  .cols{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:16px;align-items:start}
  .muted{color:#6B7280;font-size:13px;line-height:1.45}
  .muted.c{text-align:center}

  /* большие числа — у дня, периода, объекта и смены одинаковые */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px 20px}
  .kpi b{display:block;font-size:26px;font-weight:800;letter-spacing:-.01em;color:#111827;font-variant-numeric:tabular-nums;line-height:1.15}
  .kpi span{font-size:12.5px;color:#6B7280}
  .kpi.warn b{color:var(--c-warn-ink)}
  .kpi.big b{font-size:30px}

  /* таблицы — как списки движка */
  table.tb{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
  .tb th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#9CA3AF;text-align:left;font-weight:600;padding:8px 10px;border-bottom:1px solid #E5E7EB;white-space:nowrap}
  .tb td{padding:11px 10px;border-top:1px solid #F1F5F9;vertical-align:top}
  .tb tr:first-child td{border-top:0}
  .tb th.n,.tb td.n{text-align:right;white-space:nowrap}
  .tb td b{font-weight:600;color:#111827}
  .tb td small{display:block;color:#6B7280;font-size:12px;margin-top:2px}
  .tb tr.go{cursor:pointer} .tb tr.go:hover td{background:#F8FAFC}
  .tb tr.miss td{background:var(--c-warn-bg)}
  .tb tr.tot td{font-weight:800;background:#F8FAFC;border-top:1px solid #E5E7EB}
  .tb .w{color:var(--c-warn-ink);font-weight:700}
  .tb .rule{display:block;color:var(--c-warn-ink);font-size:11.5px;font-weight:500}
  .chev{color:#9CA3AF;width:16px;height:16px;vertical-align:-3px}
  .empty{padding:18px 0;color:#6B7280;font-size:13px}

  .badge{display:inline-block;border-radius:999px;padding:2px 10px;font-size:11.5px;font-weight:600;white-space:nowrap}
  .badge.ok{background:var(--c-ok-bg);color:var(--c-ok)}
  .badge.warn{background:var(--c-warn-bg);color:var(--c-warn-ink)}
  .badge.new{background:var(--b-soft);color:var(--b-ink)}
  .badge.mute{background:#F1F5F9;color:#64748B}
  .badge.bad{background:var(--c-bad-bg);color:var(--c-bad)}
  .badge.role{background:#F1F5F9;color:#334155}
  .badge.role.f{background:var(--b-dark);color:#fff}

  .btnp,.btn2,.btnbad{border-radius:10px;padding:9px 16px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
  .btnp{background:var(--b-600);color:var(--b-on);border:1px solid var(--b-600)}
  .btn2{background:#fff;border:1px solid #D1D5DB;color:#374151}
  .btnbad{background:#fff;border:1px solid #F3C4C4;color:var(--c-bad)}
  .btnp svg,.btn2 svg,.btnbad svg{width:17px;height:17px}
  .btnp[disabled],.btn2[disabled]{opacity:.45;cursor:not-allowed}
  .ro{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:#6B7280}
  .ro svg{width:14px;height:14px}

  .banner{display:flex;gap:10px;align-items:flex-start;border-radius:12px;padding:12px 16px;font-size:13.5px;line-height:1.45}
  .banner svg{width:18px;height:18px;flex:none;margin-top:1px}
  .banner.warn{background:var(--c-warn-bg);border:1px solid #F1D58A;color:var(--c-warn-ink)}
  .banner.dec{background:#fff;border:1px dashed var(--c-warn);color:var(--c-ink)}
  .banner.dec b{color:var(--c-warn-ink)}

  .reptext{white-space:pre-wrap;font-size:14px;line-height:1.55;color:#1F2937}
  .repby{font-size:12.5px;color:#6B7280;margin-top:8px}
  .diary{display:flex;flex-direction:column}
  .diary > div{padding:12px 0;border-top:1px solid #F1F5F9}
  .diary > div:first-child{border-top:0;padding-top:0}
  .diary .when{font-size:12.5px;color:#6B7280;margin-bottom:4px}
  .diary .when b{color:#111827}

  /* человек: строка и карточка — слова и состояния из login-qr.html (TG-443) */
  .who{display:flex;align-items:center;gap:10px}
  .ava{width:34px;height:34px;flex:none;border-radius:50%;background:#F1F5F9;color:#334155;display:grid;place-items:center;font-weight:700;font-size:12.5px}
  .st{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:#6B7280}
  .st svg{width:13px;height:13px;flex:none}
  .st.on{color:var(--c-ok)} .st.off{color:var(--c-bad)}
  tr.new td{background:var(--b-soft)}
  .kv{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding:8px 0;border-top:1px solid #F1F5F9}
  .kv:first-of-type{border-top:0}
  .kv span{color:#6B7280}
  .kv b.on{color:var(--c-ok)} .kv b.off{color:var(--c-bad)}
  .stack{display:flex;flex-direction:column;gap:10px;margin-top:14px}
  .stack .btnp,.stack .btnbad{justify-content:center}

  /* формы */
  .form{display:flex;flex-direction:column;gap:14px;max-width:460px}
  .form label{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:#374151}
  .form input{font-size:14px;color:#111827;padding:10px 12px;border:1px solid #D1D5DB;background:#fff;border-radius:10px;width:100%}
  .roles{display:inline-flex;border:1px solid #D1D5DB;border-radius:10px;overflow:hidden;background:#fff;width:max-content}
  .roles button{border:0;background:none;padding:9px 18px;font-weight:600;font-size:14px}
  .roles button[aria-pressed="true"]{background:var(--b-dark);color:#fff}

  /* «Выдать доступ»: два шага, QR и 6 цифр — как в login-qr.html */
  .grant{max-width:560px;display:flex;flex-direction:column;gap:14px}
  .steps{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .steps span{border-top:4px solid var(--c-line);padding-top:6px;font-size:13px;font-weight:700;color:var(--c-muted);line-height:1.25}
  .steps span small{display:block;font-weight:600;font-size:11.5px}
  .steps span.on{border-top-color:var(--c-lime-ink);color:var(--c-ink)}
  .steps span.past{border-top-color:var(--c-ok)}
  .lead{font-size:15px;font-weight:700;color:#111827;margin:0}
  .qrbox{border:1px solid #E5E7EB;border-radius:12px;padding:18px 18px 12px;display:flex;flex-direction:column;align-items:center;gap:10px}
  .qr{width:220px;height:220px;position:relative;display:grid;place-items:center}
  .qr svg{width:220px;height:220px;display:block}
  .qr .fallback{width:220px;height:220px;background:repeating-conic-gradient(#343A42 0 25%,#fff 0 50%) 0 0/24px 24px;opacity:.85}
  .qr .veil{position:absolute;inset:0;background:rgba(255,255,255,.93);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;font-weight:700;padding:0 14px}
  .qr .veil svg{width:40px;height:40px}
  .qr .veil.ok{color:var(--c-ok)} .qr .veil.bad{color:var(--c-bad)}
  .qr .veil small{font-weight:500;color:var(--c-muted);font-size:13px}
  .digits{font-size:40px;font-weight:800;letter-spacing:.12em;font-variant-numeric:tabular-nums;line-height:1}
  .digits.dead{color:var(--c-line);text-decoration:line-through}
  .ttl{width:100%;height:6px;background:var(--c-line)}
  .ttl i{display:block;height:100%;background:var(--c-lime-ink);transition:width .9s linear}
  .ttl.low i{background:var(--c-warn)}
  .count{font-size:14px;color:var(--c-muted);font-variant-numeric:tabular-nums;text-align:center}
  .count b{color:var(--c-ink)}
  .invlink{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--c-muted);word-break:break-all;text-align:center}
  .way{display:flex;gap:6px;align-items:flex-start;width:100%;font-size:13px;font-weight:700;color:var(--c-ink);line-height:1.3}
  .way svg{width:16px;height:16px;flex:none;margin-top:1px;color:var(--c-lime-ink)}
  .way.tel{border-top:1px dashed var(--c-line);padding-top:8px}

  /* диалог подтверждения */
  .dim{position:absolute;inset:0;background:rgba(17,24,28,.40);z-index:6}
  .dialog{position:absolute;left:50%;top:30%;transform:translateX(-50%);width:440px;background:#fff;border-radius:14px;padding:22px 22px 16px;z-index:7;
    box-shadow:0 20px 50px rgba(0,0,0,.25);display:flex;flex-direction:column;gap:10px}
  .dialog b{font-size:18px}
  .dialog p{margin:0;font-size:14px;color:#6B7280}
  .dialog .row2{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}
  .dialog .yes{background:var(--c-bad);border-color:var(--c-bad);color:#fff}

  .toast{position:absolute;right:24px;bottom:24px;z-index:8;background:#111827;color:#fff;border-radius:12px;padding:12px 16px;font-size:13.5px;max-width:420px;box-shadow:0 10px 30px rgba(0,0,0,.25)}

  /* пульт */
  .pult{width:400px;flex:none;background:#fff;border:1px solid var(--c-line);font-size:14px;position:sticky;top:12px}
  .pult .pin{padding:16px 18px}
  .pult .ptitle{display:block;font-size:16px;margin-bottom:4px}
  .pult .how{margin:0 0 12px;color:var(--c-muted);font-size:13px;line-height:1.45}
  .acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .acts button{border:1px solid #C9D2D6;background:#fff;padding:10px 10px;font-weight:700;font-size:13px;text-align:left}
  .acts button:active{transform:translateY(1px)}
  .acts button.wide{grid-column:1/-1}
  .pctl{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
  .dec{border:1px solid var(--c-warn);background:var(--c-warn-bg);padding:8px 10px;margin:0 0 12px;font-size:12.5px;line-height:1.4}
  .dec summary{font-weight:800;cursor:pointer;color:var(--c-warn-ink)}
  .dec ol{margin:6px 0 0;padding-left:18px} .dec li{margin-bottom:4px}
  .log{border-top:1px solid var(--c-line);padding-top:10px;font-size:12.5px;line-height:1.4;max-height:330px;overflow:auto}

function logEv(text){ const s = P.clock*60 + P.sec; P.log.unshift({at:hhmm(P.clock)+':'+pad(s%60), text}); if (P.log.length>40) P.log.pop(); }

/* Часы отметки: приход–уход с округлением; без ухода — по правилу из настроек; идёт — до «сейчас».
   Одна функция на все экраны: день, смена, лента, отчёты, карточка человека считают одинаково. */
function round(m){ const r = P.set.round; return r ? Math.round(m/r)*r : m; }
function dur(m, day){
  if (m.out != null) return round(m.out - m.in);
  if (m.noOut){
    const s = shiftOf(day, m.sid);
    return P.set.noOut==='zero' ? 0 : P.set.noOut==='min' ? P.set.noOutMin*60 : round(Math.max(0, s.close - m.in));
  }
  return day.live ? Math.max(0, P.clock - m.in) : 0;
}
const ruleTxt = () => t('rule.'+P.set.noOut, {n:P.set.noOutMin});
/* опоздание — только по первому приходу человека за день, от открытия смены плюс порог */
function lateOf(m, day){
  const first = day.marks.filter(x=>x.w===m.w).sort((a,b)=>a.in-b.in)[0];
  if (first!==m) return 0;
  const s = shiftOf(day, m.sid);
  return Math.max(0, m.in - (s.open + P.set.grace));
}
function statOf(days, oid){
  const ms = days.flatMap(d=>d.marks.filter(m=>!oid || m.obj===oid).map(m=>({m, d})));
  const shifts = days.flatMap(d=>d.shifts.filter(s=>!oid || s.obj===oid));
  return {
    mins: ms.reduce((a,x)=>a+dur(x.m, x.d),0),
    people: new Set(ms.map(x=>x.m.w)).size,
    shifts: shifts.length,
    objs: new Set(shifts.map(s=>s.obj)).size,
    days: days.filter(d=>d.shifts.some(s=>!oid || s.obj===oid)).length,
    miss: ms.filter(x=>x.m.noOut).length,
    late: ms.filter(x=>lateOf(x.m, x.d)>0).length,
    now: ms.filter(x=>x.d.live && x.m.out==null && !x.m.noOut).length,
    reps: shifts.filter(s=>s.close!=null && s.report).length,
  };
}

const nav = s => `data-act="push" data-v="${esc(s)}"`;
const ro = () => `<span class="ro">${ic('lock')}${t('ro')}</span>`;

/* День — «Сегодня» и любой прошлый день одним видом: итог по объектам, ниже таблица объектов без фамилий рабочих */
function dayView(day, isTab){
  const st = statOf([day]);
  const h = isTab ? head(`${dLong(day.key)} · ${t('live')}`, t('tab.today'), ro()) : head('', dLong(day.key), ro());
  if (!day.shifts.length) return h + `<div class="card"><p class="muted">${t('day.none')}</p></div>`;
  const k = kpis([
    day.live ? [st.now, t('k.now')] : null,
    [st.people, day.live ? t('k.people') : t('k.people.p')],
    [hm(st.mins), t('k.hours')],
    [`${st.reps}/${st.shifts}`, t('k.reps')],
    [st.miss, t('k.miss'), st.miss?'warn':''],
  ]);
  const rows = day.shifts.map(s => {
    const o = statOf([{...day, shifts:[s], marks:day.marks.filter(m=>m.sid===s.id)}]);
    const f = full(person(s.f));
    const rep = s.close==null ? `<span class="badge mute">${t('rep.wait')}</span>` : s.isNew ? `<span class="badge new">${t('rep.new')}</span>` : `<span class="badge ok">${t('rep.in')}</span>`;
    return `<tr class="go" ${nav('dayobj:'+day.key+':'+s.obj)}><td><b>${esc(objName(s.obj))}</b></td>
      <td>${s.close==null ? t('sh.by.live',{f:esc(f), from:hhmm(s.open)}) : t('sh.by',{f:esc(f), from:hhmm(s.open), to:hhmm(s.close)})}</td>
      <td class="n">${o.people}</td><td class="n">${hm(o.mins)}</td><td>${rep}</td>
      <td class="n">${o.miss ? `<span class="badge warn">${o.miss}</span>` : '—'}</td><td>${ic('go','chev')}</td></tr>`;
  }).join('');
  return h + k + `<div class="card tight"><h2>${t('day.objs')} <span class="cnt">${day.shifts.length}</span></h2><table class="tb">
    <tr><th>${t('c.obj')}</th><th>${t('c.shift')}</th><th class="n">${t('c.people')}</th><th class="n">${t('c.hours')}</th><th>${t('c.report')}</th><th class="n">${t('c.miss')}</th><th></th></tr>${rows}</table></div>`;
}

/* Смена на объекте за день — тот же итог смены, что у бригадира (foreman.html, TG-444): объект и длительность крупно,
   таблица по людям «приход · уход · часы» со строкой итогов; ниже отчёт. Владелец только смотрит. */
function shiftView(day, oid){
  const s = day.shifts.find(x=>x.obj===oid);
  if (!s) return head('', esc(objName(oid))) + `<div class="card"><p class="muted">${t('own.empty')}</p></div>`;
  const marks = day.marks.filter(m=>m.sid===s.id).sort((a,b)=>a.in-b.in);
  const o = statOf([{...day, shifts:[s], marks}]);
  const f = full(person(s.f));
  const live = s.close==null;
  const k = kpis([
    [live ? hm(P.clock - s.open) : hm(s.close - s.open), live ? t('k.dur.live',{from:hhmm(s.open)}) : t('k.dur',{from:hhmm(s.open), to:hhmm(s.close)}), 'big'],
    [o.people, t('k.people.p')],
    [hm(o.mins), t('k.hours')],
    [o.late, t('k.late')],
    [o.miss, t('k.miss'), o.miss?'warn':''],
  ]);
  const rows = marks.map(m => {
    const p = person(m.w), late = lateOf(m, day);
    const other = day.marks.filter(x=>x.w===m.w && x!==m);
    const notes = [late ? `<span class="w">${t('own.late',{n:late})}</span>` : '',
      ...other.map(x => x.in > m.in ? t('own.moveto',{obj:esc(objName(x.obj)), t:hhmm(m.out)}) : t('own.movefrom',{obj:esc(objName(x.obj))}))].filter(Boolean).join(' · ');
    const out = m.out!=null ? hhmm(m.out) : m.noOut ? `<span class="w">${t('nomiss')}</span>` : `<em>${t('onsite')}</em>`;
    const h = m.noOut ? `${dur(m, day) ? hm(dur(m, day)) : '—'}<span class="rule">${t('rule.by',{r:ruleTxt()})}</span>` : hm(dur(m, day));
    return `<tr class="${m.noOut?'miss':''}"><td><b>${esc(full(p))}</b>${notes?`<small>${notes}</small>`:''}</td><td>${hhmm(m.in)}</td><td>${out}</td><td class="n">${h}</td></tr>`;
  }).join('');
  const missing = marks.filter(m=>m.noOut).map(m=>esc(full(person(m.w))));
  const table = marks.length ? `<table class="tb"><tr><th>${t('su.who')}</th><th>${t('su.in')}</th><th>${t('su.out')}</th><th class="n">${t('su.h')}</th></tr>${rows}
    <tr class="tot"><td colspan="4">${t('su.total',{n:o.people, h:hm(o.mins)})}</td></tr></table>` : `<p class="empty">${t('own.empty')}</p>`;
  const rep = live ? `<p class="muted">${t('own.rep.wait')}</p>`
    : `<div class="reptext">${esc(s.report)}</div><div class="repby">${t('own.rep.by',{f:esc(f), t:hhmm(s.close)})}${s.photos?` · ${t('su.photos',{n:s.photos})}`:''}</div>`;
  return head(`${dLong(day.key)} · ${esc(f)}`, esc(objName(oid)), ro()) + k
    + (missing.length ? `<div class="banner warn">${ic('alert')}<div>${t('own.miss',{names:'<b>'+missing.join(', ')+'</b>', rule:ruleTxt()})}</div></div>` : '')
    + `<div class="cols"><div class="card tight"><h2>${t('su.t')}</h2>${table}</div>
       <div class="card"><h2>${t('su.rep')}${!live && s.isNew ? ` <span class="badge new">${t('rep.new')}</span>` : ''}</h2>${rep}</div></div>`;
}

/* История — лента периодов, как у Дорина в timesheet-pwa.html: месяц крупно, эта неделя по дням, прошлые недели месяца,
   прошлые месяцы года. Любая строка раскрывается, цифры сходятся между уровнями — считаются одной функцией. */
function periodRow(label, days, viewStr){
  const st = statOf(days);
  return `<tr class="go" ${nav(viewStr)}><td><b>${label}</b></td><td class="n">${st.shifts}</td><td class="n">${st.people}</td><td class="n">${hm(st.mins)}</td>
    <td class="n">${st.miss?`<span class="badge warn">${st.miss}</span>`:'—'}</td><td>${ic('go','chev')}</td></tr>`;
}
const periodHead = first => `<tr><th>${first}</th><th class="n">${t('k.shifts')}</th><th class="n">${t('c.people')}</th><th class="n">${t('c.hours')}</th><th class="n">${t('c.miss')}</th><th></th></tr>`;
function periodKpis(days, title){
  const st = statOf(days);
  return kpis([[hm(st.mins), t('k.hours'), 'big'], [st.shifts, t('k.shifts')], [st.objs, t('k.objs')], [st.people, t('k.people.p')], [st.miss, t('k.miss'), st.miss?'warn':'']], title);
}
function histView(){
  const mon = mondayOf(TODAY_KEY);
  const thisWeek = weekDays(mon);
  const weeks = [...new Set(monthDays(CUR_YM).map(d=>mondayOf(d.key)))].filter(w=>w!==mon).sort().reverse();
  const months = [...new Set(allDays().map(d=>ym(d.key)))].filter(m=>m!==CUR_YM).sort().reverse();
  const m = +CUR_YM.slice(5,7);
  // Месяц крупно — карточка больших чисел с заголовком-ссылкой; ниже строки, каждая раскрывается
  return head(t('hist.over'), t('tab.hist'))
    + periodKpis(monthDays(CUR_YM), `<button class="h2link" ${nav('month:'+CUR_YM)}>${monthTitle(CUR_YM)} ${ic('go','chev')}</button>`)
    + `<div class="card tight"><h2>${t('hist.week')}</h2><table class="tb">${periodHead(t('c.date'))}${thisWeek.slice().reverse().map(d=>periodRow(dLong(d.key), [d], 'day:'+d.key)).join('')}</table></div>`
    + `<div class="card tight"><h2>${t('hist.weeks',{m:t('mn.'+m)})}</h2><table class="tb">${periodHead(t('c.week'))}${weeks.map(w=>{ const ds = weekDays(w); return periodRow(weekLabel(ds.map(d=>d.key)), ds, 'week:'+w); }).join('')}</table></div>`
    + `<div class="card tight"><h2>${t('hist.months',{y:CUR_YM.slice(0,4)})}</h2><table class="tb">${periodHead(t('c.month'))}${months.map(x=>periodRow(monthTitle(x), monthDays(x), 'month:'+x)).join('')}</table></div>`;
}
function monthView(y_m){
  const days = monthDays(y_m);
  const weeks = [...new Set(days.map(d=>mondayOf(d.key)))].sort().reverse();
  return head('', monthTitle(y_m)) + periodKpis(days)
    + `<div class="card tight"><h2>${t('c.week')}</h2><table class="tb">${periodHead(t('c.week'))}${weeks.map(w=>{ const ds = days.filter(d=>mondayOf(d.key)===w); return periodRow(weekLabel(ds.map(d=>d.key)), ds, 'week:'+w); }).join('')}</table></div>`;
}
function weekView(mon){
  const days = weekDays(mon);
  return head('', weekLabel(days.map(d=>d.key))) + periodKpis(days)
    + `<div class="card tight"><h2>${t('c.date')}</h2><table class="tb">${periodHead(t('c.date'))}${days.slice().reverse().map(d=>periodRow(dLong(d.key), [d], 'day:'+d.key)).join('')}</table></div>`;
}

/* Объекты */
function objMonthDays(o){ return (o.closed && o.closed < CUR_YM) ? allDays() : monthDays(CUR_YM); }
function objsView(){
  const list = P.objects.filter(o => P.objF==='active' ? !o.closed : !!o.closed);
  const m = +CUR_YM.slice(5,7);
  const rows = list.map(o => {
    const ds = objMonthDays(o), st = statOf(ds, o.id);
    const ts = P.today.shifts.find(s=>s.obj===o.id);
    const today = ts ? (ts.close==null ? `<span class="badge ok">${t('live')}</span>` : `<span class="badge mute">${hhmm(ts.open)}–${hhmm(ts.close)}</span>`) : '—';
    return `<tr class="go" ${nav('obj:'+o.id)}><td><b>${esc(o.name)}</b>${o.isNew?` <span class="badge new">${t('obj.isnew')}</span>`:''}${o.closed?`<small>${t('obj.closed.on',{d:dShort(o.closed)})}</small>`:''}</td>
      <td>${esc(o.addr)}</td><td>${today}</td><td class="n">${st.days}</td><td class="n">${hm(st.mins)}</td><td>${ic('go','chev')}</td></tr>`;
  }).join('');
  const label = P.objF==='active' ? t('in.'+m) : t('obj.alltime');
  return head('', t('tab.objs'), `${pills([['active',t('obj.active')],['closed',t('obj.closed')]], P.objF, 'objF')}<button class="btnp" ${nav('newobj')}>${ic('plus')}${t('obj.new')}</button>`)
    + `<div class="card tight"><table class="tb"><tr><th>${t('c.obj')}</th><th>${t('c.addr')}</th><th>${t('c.today')}</th><th class="n">${t('c.days')} · ${label}</th><th class="n">${t('c.hours')} · ${label}</th><th></th></tr>${rows}</table></div>`;
}
function objView(id){
  const o = P.objects.find(x=>x.id===id);
  const ds = objMonthDays(o), st = statOf(ds, id);
  const m = +CUR_YM.slice(5,7);
  const label = o.closed && o.closed < CUR_YM ? t('obj.alltime') : t('in.'+m);
  const worked = ds.filter(d=>d.shifts.some(s=>s.obj===id)).slice().reverse();
  const right = o.closed ? `<span class="badge mute">${t('obj.closed.on',{d:dShort(o.closed)})}</span>` : `<button class="btn2" data-act="askCloseObj">${t('obj.close')}</button>`;
  const h = head(esc(o.addr), esc(o.name), right) + kpis([[hm(st.mins), `${t('k.hours')} · ${label}`, 'big'], [st.days, t('k.days')], [st.people, t('k.people.p')], [st.miss, t('k.miss'), st.miss?'warn':'']]);
  if (!worked.length) return h + `<div class="card"><p class="muted">${t('obj.never')}</p></div>`;
  const rows = worked.map(d => {
    const s = d.shifts.find(x=>x.obj===id);
    const sst = statOf([{...d, shifts:[s], marks:d.marks.filter(x=>x.sid===s.id)}]);
    return `<tr class="go" ${nav('dayobj:'+d.key+':'+id)}><td><b>${dShort(d.key)}</b>${d.live?` <span class="badge ok">${t('live')}</span>`:''}</td><td>${esc(full(person(s.f)))}</td>
      <td class="n">${sst.people}</td><td class="n">${hm(sst.mins)}</td><td class="n">${sst.miss?`<span class="badge warn">${sst.miss}</span>`:'—'}</td><td>${ic('go','chev')}</td></tr>`;
  }).join('');
  const diary = worked.flatMap(d => d.shifts.filter(s=>s.obj===id && s.close!=null && s.report).map(s=>({d, s}))).slice(0, 6)
    .map(({d, s}) => `<div><div class="when"><b>${dShort(d.key)}</b> · ${t('own.rep.by',{f:esc(full(person(s.f))), t:hhmm(s.close)})}</div><div class="reptext">${esc(s.report)}</div></div>`).join('');
  return h + `<div class="cols"><div class="card tight"><h2>${t('obj.days')}</h2><table class="tb"><tr><th>${t('c.date')}</th><th>${t('c.foreman')}</th><th class="n">${t('c.people')}</th><th class="n">${t('c.hours')}</th><th class="n">${t('c.miss')}</th><th></th></tr>${rows}</table></div>
    <div class="card"><h2>${t('obj.diary')}</h2><div class="diary">${diary || `<p class="muted">${t('own.rep.wait')}</p>`}</div></div></div>`;
}
function newObjView(){
  return head('', t('obj.new')) + `<div class="card"><div class="form">
    <label>${t('obj.f.name')}<input data-field="objName" value="${esc(P.objDraft.name)}" placeholder="${esc(t('obj.f.ph'))}" autocomplete="off"></label>
    <label>${t('obj.f.addr')}<input data-field="objAddr" value="${esc(P.objDraft.addr)}" autocomplete="off"></label>
    <div><button class="btnp" data-act="addObj">${t('obj.f.add')}</button></div>
    <p class="muted">${t('obj.f.note')}</p></div></div>`;
}

/* Люди — список и карточка; путь «Добавить человека» → «Выдать доступ» (два шага) и блокировка — как в login-qr.html */
function accessLine(p){
  return p.blocked ? `<span class="st off">${ic('lock')}${t('ph.blocked')}</span>`
    : p.phone==='on' ? `<span class="st on">${ic('phone')}${t('ph.on',{when: p.last ? when(p.last) : ''})}</span>`
    : `<span class="st">${ic('clock')}${t('ph.none')}</span>`;
}
function personMarks(id){
  return allDays().flatMap(d => d.marks.filter(m=>m.w===id).map(m=>({d, m}))).sort((a,b)=> a.d.key===b.d.key ? b.m.in-a.m.in : (a.d.key < b.d.key ? 1 : -1));
}
function foremanShifts(id){
  return allDays().flatMap(d => d.shifts.filter(s=>s.f===id).map(s=>({d, s}))).sort((a,b)=> a.d.key < b.d.key ? 1 : -1);
}
function peopleView(){
  const m = +CUR_YM.slice(5,7);
  const list = P.people.filter(p => P.pp==='all' || (P.pp==='b' ? p.blocked : !p.blocked && p.role===(P.pp==='f'?'foreman':'worker')));
  const rows = list.map(p => {
    let hours = '—', last = '—';
    if (p.role==='worker'){
      const ms = personMarks(p.id);
      const cur = ms.filter(x=>ym(x.d.key)===CUR_YM);
      if (cur.length) hours = hm(cur.reduce((a,x)=>a+dur(x.m, x.d),0));
      if (ms.length) last = `${dShort(ms[0].d.key)} · ${esc(objName(ms[0].m.obj))}`;
    } else {
      const ss = foremanShifts(p.id);
      if (ss.length) last = `${dShort(ss[0].d.key)} · ${esc(objName(ss[0].s.obj))}`;
    }
    return `<tr class="go ${p.id===P.newId?'new':''}" ${nav('person:'+p.id)}><td><div class="who"><span class="ava">${esc(initials(p))}</span><b>${esc(full(p))}</b></div></td>
      <td><span class="badge role ${p.role==='foreman'?'f':''}">${t('role.'+p.role)}</span></td><td>${accessLine(p)}</td>
      <td class="n">${hours}</td><td>${last}</td><td>${ic('go','chev')}</td></tr>`;
  }).join('');
  return head('', t('tab.people'), `${pills([['all',t('pp.all')],['f',t('pp.f')],['w',t('pp.w')],['b',t('pp.b')]], P.pp, 'pp')}<button class="btnp" ${nav('add')}>${ic('plus')}${t('people.add')}</button>`)
    + `<div class="card tight"><table class="tb"><tr><th>${t('c.person')}</th><th>${t('c.role')}</th><th>${t('c.access')}</th><th class="n">${t('pp.hours',{m:t('mn.'+m)})}</th><th>${t('c.last')}</th><th></th></tr>${rows}</table></div>`;
}
function personView(id){
  const sel = person(id);
  const m = +CUR_YM.slice(5,7);
  const ph = sel.phone==='on' ? `<b class="on">${t('card.since',{d:sel.since})}</b>` : `<b>${t('ph.none')}</b>`;
  const again = sel.phone==='on';
  // Одна кнопка «Выдать доступ» (Oleg 22.11), как в login-qr.html: два шага на одном экране; доступ уже выдан —
  // кнопка та же, подпись предупреждает про старый телефон. «Заблокировать доступ» / «Разблокировать» — у владельца.
  const access = `<div class="card"><h2>${t('pp.access')}</h2>
    <div class="kv"><span>${t('card.role')}</span><b>${t('role.'+sel.role)}</b></div>
    ${sel.blocked ? `<div class="kv"><span>${t('card.state')}</span><b class="off">${t('card.blocked')}</b></div>`
      : `<div class="kv"><span>${t('card.phone')}</span>${ph}</div>
    ${sel.phone==='on' && sel.last ? `<div class="kv"><span>${t('card.last')}</span><b>${when(sel.last)}</b></div>` : ''}`}
    ${sel.blocked ? `<div class="stack"><p class="muted">${t('card.blocked.s')}</p><button class="btnp" data-act="doUnblock">${ic('key')}${t('card.unblock')}</button></div>`
      : `<div class="stack"><button class="btnp" data-act="toInvite" data-id="${sel.id}">${ic('key')}${t('card.access')}</button>
        <p class="muted">${t(again?'card.access.again.s':'card.access.s')}</p>
        <button class="btnbad" data-act="askBlock">${ic('lock')}${t('card.block')}</button></div>`}</div>`;
  let work;
  if (sel.role==='worker'){
    const ms = personMarks(id);
    const cur = ms.filter(x=>ym(x.d.key)===CUR_YM);
    const rows = ms.slice(0, 8).map(({d, m}) => `<tr class="go ${m.noOut?'miss':''}" ${nav('dayobj:'+d.key+':'+m.obj)}><td><b>${dShort(d.key)}</b></td><td>${esc(objName(m.obj))}</td>
      <td>${hhmm(m.in)}–${m.out!=null ? hhmm(m.out) : m.noOut ? `<span class="w">${t('nomiss')}</span>` : t('onsite')}</td>
      <td class="n">${m.noOut ? `${dur(m,d)?hm(dur(m,d)):'—'}<span class="rule">${t('rule.by',{r:ruleTxt()})}</span>` : hm(dur(m, d))}</td></tr>`).join('');
    work = `<div class="card"><div class="kpis"><div class="kpi big"><b>${hm(cur.reduce((a,x)=>a+dur(x.m,x.d),0))}</b><span>${t('pp.hours',{m:t('mn.'+m)})}</span></div>
        <div class="kpi"><b>${new Set(cur.map(x=>x.d.key)).size}</b><span>${t('k.days')}</span></div>
        <div class="kpi ${cur.some(x=>x.m.noOut)?'warn':''}"><b>${cur.filter(x=>x.m.noOut).length}</b><span>${t('k.miss')}</span></div></div></div>
      <div class="card tight"><h2>${t('pp.shifts')}</h2>${ms.length ? `<table class="tb"><tr><th>${t('c.date')}</th><th>${t('c.obj')}</th><th>${t('su.in')}–${t('su.out')}</th><th class="n">${t('c.hours')}</th></tr>${rows}</table>` : `<p class="empty">${t('pp.none')}</p>`}</div>`;
  } else {
    const ss = foremanShifts(id);
    const rows = ss.slice(0, 8).map(({d, s}) => `<tr class="go" ${nav('dayobj:'+d.key+':'+s.obj)}><td><b>${dShort(d.key)}</b></td><td>${esc(objName(s.obj))}</td>
      <td>${hhmm(s.open)}–${s.close!=null?hhmm(s.close):t('live')}</td><td class="n">${d.marks.filter(m=>m.sid===s.id).length}</td></tr>`).join('');
    work = `<div class="card"><div class="kpis"><div class="kpi big"><b>${ss.filter(x=>ym(x.d.key)===CUR_YM).length}</b><span>${t('pp.opened',{m:t('mn.'+m)})}</span></div></div>
        <p class="muted" style="margin:10px 0 0">${t('pp.nohours')}</p></div>
      <div class="card tight"><h2>${t('pp.shifts')}</h2>${ss.length ? `<table class="tb"><tr><th>${t('c.date')}</th><th>${t('c.obj')}</th><th>${t('c.shift')}</th><th class="n">${t('c.people')}</th></tr>${rows}</table>` : `<p class="empty">${t('pp.none')}</p>`}</div>`;
  }
  return head('', esc(full(sel)), `<span class="badge role ${sel.role==='foreman'?'f':''}">${t('role.'+sel.role)}</span>`)
    + `<div class="cols"><div>${access}</div><div style="display:flex;flex-direction:column;gap:16px">${work}</div></div>`;
}
function addView(){
  const d = P.draft;
  return head('', t('add.title')) + `<div class="card"><div class="form">
    <label>${t('add.sur')}<input data-field="sur" value="${esc(d.sur)}" autocomplete="off"></label>
    <label>${t('add.name')}<input data-field="name" value="${esc(d.name)}" autocomplete="off"></label>
    <label>${t('add.role')}<span class="roles">
      <button type="button" data-act="setRole" data-v="worker" aria-pressed="${d.role==='worker'}">${t('role.worker')}</button>
      <button type="button" data-act="setRole" data-v="foreman" aria-pressed="${d.role==='foreman'}">${t('role.foreman')}</button></span></label>
    <div><button class="btnp" data-act="save">${t('add.save')}</button></div>
    <p class="muted">${t('add.note')}</p></div></div>`;
}
/* Полоска шагов экрана «Выдать доступ»: шаг 1 — установить приложение, шаг 2 — вход (как в login-qr.html) */
function stepsBar(n){
  return `<div class="steps">${[1,2].map(i=>`<span class="${i===n?'on':i<n?'past':''}"><small>${t('step.of',{n:i})}</small>${t('step.'+i)}</span>`).join('')}</div>`;
}
function inviteView(id){
  const sel = person(id);
  return head(esc(full(sel)), t('inv.title')) + `<div class="card"><div class="grant">${stepsBar(1)}
    <p class="lead">${t('inv.t',{name:esc(sel.name)})}</p>
    <div class="qrbox"><div class="qr">${qrSvg(`https://${INVITE_HOST}/app/join#${P.inviteTok}`)}</div>
      <div class="invlink">${INVITE_HOST}/app/join#${P.inviteTok}</div></div>
    <p class="muted">${t('inv.s')}</p>
    <div><button class="btnp" data-act="showCode" data-id="${sel.id}">${t('inv.code')}</button></div></div></div>`;
}
function codeBlock(c, p){
  let veil = '', count = '';
  if (c.used) veil = `<div class="veil ok">${ic('check')}${t('code.ok',{name:esc(full(p))})}<small>${t('code.ok.s')}</small></div>`;
  else if (c.left<=0) veil = `<div class="veil bad">${ic('clock')}${t('code.expired')}</div>`;
  else count = t('code.left',{t:mmss(c.left)});
  const live = !c.used && c.left>0;
  // Два способа на одном экране (Oleg 22.11): рядом — QR, далеко — 6 цифр по телефону
  return `<div class="qrbox">${live ? `<div class="way">${ic('qr')}${t('code.near')}</div>` : ''}
    <div class="qr">${live ? qrSvg('LDV1:'+c.digits+':'+c.tok) : '<div class="fallback" style="opacity:.2"></div>'}${veil}</div>
    ${live ? `<div class="way tel">${ic('phone')}${t('code.or')}</div>` : ''}
    <div class="digits ${live?'':'dead'}">${c.digits.slice(0,3)} ${c.digits.slice(3)}</div>
    <div class="ttl ${c.left<=20?'low':''}"><i style="width:${live ? c.left/CODE_TTL*100 : 0}%"></i></div>
    <div class="count">${count||'&nbsp;'}</div></div>`;
}
function codeView(id){
  const sel = person(id);
  if (!P.code || P.code.forId!==id) newCode(id, true);
  return head(esc(full(sel)), t('code.title')) + `<div class="card"><div class="grant">${stepsBar(2)}
    <p class="lead">${t('code.how',{name:esc(sel.name)})}</p>
    ${codeBlock(P.code, sel)}
    ${P.code.used ? '' : `<div><button class="btn2" data-act="showCode" data-id="${sel.id}">${t('code.new')}</button></div>`}</div></div>`;
}

/* Отчёты — часы по людям (основа зарплаты) и по объектам за неделю или месяц */
function repView(){
  const days = PERIODS[P.per]();
  const keys = days.map(d=>d.key).sort();
  const st = statOf(days);
  const acc = {};
  days.forEach(d => d.marks.forEach(m => {
    const k = P.by==='people' ? m.w : m.obj;
    const a = acc[k] || (acc[k] = {days:new Set(), mins:0, rule:0, late:0, miss:0, people:new Set()});
    a.days.add(d.key); a.mins += dur(m, d); a.people.add(m.w);
    if (m.noOut){ a.rule += dur(m, d); a.miss++; }
    if (lateOf(m, d)) a.late++;
  }));
  const tot = Object.values(acc).reduce((s,a)=>({mins:s.mins+a.mins, rule:s.rule+a.rule, late:s.late+a.late, miss:s.miss+a.miss}), {mins:0, rule:0, late:0, miss:0});
  let rows;
  if (P.by==='people'){
    rows = P.people.filter(p=>acc[p.id]).sort((a,b)=>full(a).localeCompare(full(b),'hu')).map(p => { const a = acc[p.id];
      return `<tr class="go" ${nav('person:'+p.id)}><td><div class="who"><span class="ava">${esc(initials(p))}</span><b>${esc(full(p))}</b></div></td><td class="n">${a.days.size}</td>
        <td class="n">${a.late||'—'}</td><td class="n">${a.miss ? `<span class="w">${a.miss}</span>` : '—'}</td><td class="n">${a.miss ? hm(a.rule) : '—'}</td><td class="n"><b>${hm(a.mins)}</b></td></tr>`; }).join('');
    rows = `<tr><th>${t('c.person')}</th><th class="n">${t('c.days')}</th><th class="n">${t('c.late')}</th><th class="n">${t('c.miss')}</th><th class="n">${t('c.rule')}</th><th class="n">${t('c.hours')}</th></tr>${rows}
      <tr class="tot"><td>${t('rep.total')}</td><td class="n"></td><td class="n">${tot.late}</td><td class="n">${tot.miss}</td><td class="n">${hm(tot.rule)}</td><td class="n">${hm(tot.mins)}</td></tr>`;
  } else {
    rows = P.objects.filter(o=>acc[o.id]).map(o => { const a = acc[o.id];
      return `<tr class="go" ${nav('obj:'+o.id)}><td><b>${esc(o.name)}</b></td><td class="n">${a.days.size}</td><td class="n">${a.people.size}</td>
        <td class="n">${a.miss ? `<span class="w">${a.miss}</span>` : '—'}</td><td class="n"><b>${hm(a.mins)}</b></td></tr>`; }).join('');
    rows = `<tr><th>${t('c.obj')}</th><th class="n">${t('c.days')}</th><th class="n">${t('c.people')}</th><th class="n">${t('c.miss')}</th><th class="n">${t('c.hours')}</th></tr>${rows}
      <tr class="tot"><td>${t('rep.total')}</td><td class="n"></td><td class="n">${st.people}</td><td class="n">${tot.miss}</td><td class="n">${hm(tot.mins)}</td></tr>`;
  }
  const over = keys.length ? t('rep.over',{from:dShort(keys[0]), to:dShort(keys[keys.length-1])}) : '';
  return head(over, t('tab.rep'), pills([['week',t('per.week')],['last',t('per.last')],['month',t('mn.11')],['prev',t('mn.10')],['|'],['people',t('by.people')],['objs',t('by.objs')]], [P.per, P.by], 'per'))
    + periodKpis(days)
    + `<div class="card tight">${Object.keys(acc).length ? `<table class="tb">${rows}</table>` : `<p class="empty">${t('rep.empty')}</p>`}</div>`
    + `<div class="acts-r"><button class="btn2" disabled>${ic('sheet')}${t('rep.excel')}</button><span class="badge mute">${t('rep.later')}</span><span class="muted">${t('rep.later.s')}</span></div>`;
}

/* Настройки — отдельная вкладка; решение, которое Oleg может убрать (тогда числа держит контракт и меняет Copilot) */
function setView(){
  const opt = (k, vals, fmt) => `<div class="pills">${vals.map(v=>`<button class="${P.set[k]===v?'on':''}" data-act="set" data-k="${k}" data-v="${v}">${fmt(v)}</button>`).join('')}</div>`;
  const ruleS = {zero:t('rule.zero.s'), min:t('rule.min.s',{n:P.set.noOutMin}), close:t('rule.close.s')}[P.set.noOut];
  return head('', t('tab.set'))
    + `<div class="banner dec">${ic('alert')}<div>${t('set.dec')}</div></div>`
    + `<div class="card"><h2>${t('set.noout')}</h2><p class="muted" style="margin:0 0 12px">${t('set.noout.s')}</p>
        ${opt('noOut',['zero','min','close'], v=>t('opt.'+v))}
        ${P.set.noOut==='min' ? `<div style="margin-top:10px">${opt('noOutMin',[4,7,8], v=>t('h.n',{n:v}))}</div>` : ''}
        <p class="muted" style="margin:12px 0 0">${ruleS} ${t('set.recalc')}</p></div>`
    + `<div class="cols" style="grid-template-columns:1fr 1fr"><div class="card"><h2>${t('set.grace')}</h2><p class="muted" style="margin:0 0 12px">${t('set.grace.s')}</p>
        ${opt('grace',[0,5,10,15], v=>v?t('set.min',{n:v}):t('set.grace.0'))}</div>
      <div class="card"><h2>${t('set.round')}</h2><p class="muted" style="margin:0 0 12px">${t('set.round.s')}</p>
        ${opt('round',[0,15,30], v=>v?t('set.round.n',{n:v}):t('set.round.0'))}</div></div>`;
}

/* ══ РЕНДЕР ══ */
function pageHtml(){
  const top = curView();
  if (!top) return {today:()=>dayView(P.today, true), hist:histView, objs:objsView, people:peopleView, rep:repView, set:setView}[P.tab]();
  const v = V(top);
  return {day:()=>dayView(dayOf(v.a)), dayobj:()=>shiftView(dayOf(v.a), v.b), month:()=>monthView(v.a), week:()=>weekView(v.a),
    obj:()=>objView(v.a), newobj:newObjView, person:()=>personView(+v.a), add:addView, invite:()=>inviteView(+v.a), code:()=>codeView(+v.a)}[v.k]();
}
function crumbsHtml(){
  if (!P.stack.length) return '';
  const items = [`<button data-act="crumb" data-v="0">${t('tab.'+P.tab)}</button>`,
    ...P.stack.slice(0,-1).map((s,i)=>`<button data-act="crumb" data-v="${i+1}">${viewTitle(s)}</button>`)];
  return `<div class="crumbs">${items.join('<span>›</span>')}</div>`;
}
function renderApp(){
  const f = document.activeElement;
  if (f && f.dataset && f.dataset.field) return;   // поле формы под пальцем не перерисовываем: прототип тикает раз в секунду
  const unread = P.today.shifts.filter(s=>s.isNew).length;
  const tabs = TABS.map(k => (k==='set' ? '<span class="sep"></span>' : '') + `<button class="${P.tab===k?'on':''}" data-act="tab" data-v="${k}">${t('tab.'+k)}</button>`).join('');
  const dlg = P.dlg==='block' ? [t('conf.t',{name:esc(full(person(+V(P.stack[P.stack.length-1]).a)))}), t('conf.s'), t('conf.yes'), 'doBlock']
    : P.dlg==='closeObj' ? [t('obj.close.t',{name:esc(objName(V(P.stack[P.stack.length-1]).a))}), t('obj.close.s'), t('obj.close'), 'doCloseObj'] : null;
  const app = document.getElementById('app');
  app.className = 'app' + (S.brand==='ld' ? ' ld' : '');
  const scroll = app.querySelector('.page') ? app.querySelector('.page').scrollTop : 0;
  app.innerHTML = `<header class="hdr"><div class="brand"><span class="mark">LD</span><div><b>LD Vill</b><span>${t('app.sub')}</span></div></div>
      <button class="bell" data-act="bell" title="${esc(t('bell'))}">${ic('bell')}${unread?`<em>${unread}</em>`:''}</button>
      <div class="me"><span class="ava-r">D</span><div><b>${t('owner.name')}</b><span>${t('role.owner')}</span></div></div></header>
    <nav class="tabbar">${tabs}</nav>
    <main class="page"><div class="inner">${crumbsHtml()}${pageHtml()}</div></main>
    ${dlg ? `<div class="dim"></div><div class="dialog"><b>${dlg[0]}</b><p>${dlg[1]}</p><div class="row2"><button class="btn2" data-act="dlgNo">${t('conf.no')}</button><button class="btn2 yes" data-act="${dlg[3]}">${dlg[2]}</button></div></div>` : ''}
    ${P.toast ? `<div class="toast">${P.toast}</div>` : ''}`;
  if (!P._jump) app.querySelector('.page').scrollTop = scroll;
  P._jump = false;
  document.getElementById('url').textContent = `${INVITE_HOST}/#p/timesheet:owner:${P.tab}${P.stack.length ? '/' + P.stack[P.stack.length-1] : ''}`;
}

/* ══ ДЕЙСТВИЯ ══ */
function go(fn){ fn(); P._jump = true; }
function toast(txt){ P.toast = txt; clearTimeout(P._tt); P._tt = setTimeout(()=>{ P.toast = null; renderApp(); }, 3500); }
function newCode(id, quiet){
  P.code = {forId:id, digits:six(), tok:tok(16), left:CODE_TTL, used:false};
  if (!quiet) logEv(`Дорин показал код для входа для ${full(person(id))}: ${P.code.digits}, живёт ${CODE_TTL/60} мин, срабатывает один раз (как в login-qr.html).`);
}
const curView = () => P.stack[P.stack.length-1] || '';   // не top: это имя занято окном браузера (window.top)
const ACT = {
  tab(el){ go(()=>{ P.tab = el.dataset.v; P.stack = []; P.dlg = null; }); },
  push(el){ go(()=>{
    const v = el.dataset.v;
    P.stack.push(v);
    // Дорин открыл день объекта с новым отчётом — отчёт прочитан, счётчик в колокольчике гаснет
    const x = V(v);
    if (x.k==='dayobj' && x.a===TODAY_KEY){ const s = P.today.shifts.find(s=>s.obj===x.b); if (s && s.isNew){ s.isNew = false; logEv(`Дорин прочитал отчёт «${objName(x.b)}» — счётчик новых отчётов уменьшился.`); } }
  }); },
  crumb(el){ go(()=>{ P.stack = P.stack.slice(0, +el.dataset.v); P.dlg = null; }); },
  bell(){ go(()=>{ P.tab = 'today'; P.stack = []; }); },
  objF(el){ P.objF = el.dataset.v; },
  pp(el){ P.pp = el.dataset.v; },
  per(el){ const v = el.dataset.v; if (['people','objs'].includes(v)) P.by = v; else P.per = v; },
  set(el){
    const k = el.dataset.k, v = isNaN(+el.dataset.v) ? el.dataset.v : +el.dataset.v;
    P.set[k] = v;
    logEv(`Настройки: ${({grace:'порог опоздания', round:'округление', noOut:'часы без ухода', noOutMin:'минимальный день'})[k]} — ${({grace:v+' мин', round:v?('до '+v+' мин'):'не округлять', noOut:ruleTxt(), noOutMin:v+' ч'})[k]}. Пересчитаны «Сегодня», «История», «Отчёты» и карточки людей.`);
  },
  /* объекты */
  addObj(){
    const name = P.objDraft.name.trim(), addr = P.objDraft.addr.trim();
    if (!name){ toast(t('obj.need')); return; }
    const id = 'n' + (P.objects.length+1);
    P.objects.push({id, name, addr: addr || '—', since:TODAY_KEY, isNew:true});
    P.objDraft = {name:'', addr:''};
    go(()=>{ P.stack = ['obj:'+id]; P.objF = 'active'; });
    logEv(`Дорин завёл объект «${name}» — он сразу появился у бригадиров в списке объектов с пометкой «новый».`);
  },
  askCloseObj(){ P.dlg = 'closeObj'; },
  doCloseObj(){
    const o = P.objects.find(x=>x.id===V(curView()).a); P.dlg = null;
    o.closed = TODAY_KEY;
    logEv(`Дорин закрыл объект «${o.name}»: бригадиры больше не видят его в списке, история и часы остались.`);
  },
  /* люди — как в login-qr.html */
  setRole(el){ P.draft.role = el.dataset.v; },
  save(){
    const d = P.draft;
    if (!d.sur.trim() || !d.name.trim()){ toast(t('need.names')); logEv('Фамилия и имя обязательны — экран не сохранит пустое.'); return; }
    const id = Math.max(...P.people.map(p=>p.id))+1;
    P.people.unshift({id, sur:d.sur.trim(), name:d.name.trim(), role:d.role, phone:'none'});
    P.newId = id; P.inviteTok = tok(10);
    go(()=>{ P.stack = ['person:'+id, 'invite:'+id]; });
    logEv(`Дорин добавил ${full(person(id))} (${d.role==='worker'?'рабочий':'бригадир'}) — без пароля. Сразу «Выдать доступ», шаг 1 из 2 — QR установки приложения.`);
  },
  toInvite(el){
    const id = +el.dataset.id;
    if (person(id).blocked){ logEv(`${full(person(id))} заблокирован — выдать доступ нельзя (движок откажет).`); return; }
    P.inviteTok = tok(10);
    go(()=>{ P.stack.push('invite:'+id); });
    logEv(`«Выдать доступ» для ${full(person(id))}, шаг 1 из 2: QR, который ставит приложение.${person(id).phone==='on' ? ' Доступ уже был выдан: после входа на новом телефоне старый перестанет работать.' : ''}`);
  },
  showCode(el){
    const id = +el.dataset.id;
    if (person(id).blocked){ logEv(`${full(person(id))} заблокирован — выдать доступ нельзя (движок откажет).`); return; }
    newCode(id);
    go(()=>{ if (V(curView()).k==='invite') P.stack.push('code:'+id); else if (V(curView()).k!=='code') P.stack.push('code:'+id); });
  },
  askBlock(){ P.dlg = 'block'; }, dlgNo(){ P.dlg = null; },
  doBlock(){
    const p = person(+V(curView()).a); P.dlg = null;
    p.blocked = true; p.phone = 'none'; delete p.last;
    if (P.code && P.code.forId===p.id) P.code.left = 0;
    logEv(`Дорин заблокировал ${full(p)}: движок закрыл вход на всех его телефонах, коды для него не выпускаются. Прошлые смены и часы остались в отчётах.`);
  },
  doUnblock(){
    const p = person(+V(curView()).a); p.blocked = false;
    logEv(`Дорин разблокировал ${full(p)}. Войдёт он так же, как в первый раз: «Выдать доступ» и новый код.`);
  },

  /* пульт: остальной мир */
  openKel(){
    if (P.today.shifts.some(s=>s.obj==='kel')){ logEv('Kelenföld уже открыт.'); return; }
    P.clock = Math.max(P.clock, mn('10:20')); P.sec = 0;
    P.today.shifts.push({id:903, obj:'kel', f:3, open:P.clock, close:null});
    P.today.marks.push({w:10, obj:'kel', sid:903, in:P.clock+3, out:null});
    const p3 = person(3); if (p3.last) p3.last = {d:0, t:hhmm(P.clock)};
    const p10 = person(10); if (p10.phone==='on') p10.last = {d:0, t:hhmm(P.clock+3)};
    logEv('Бригадир Kovács Péter открыл смену на «Kelenföld, irodaház» и отсканировал Balogh Tamás. У Дорина на «Сегодня» — третья строка, счётчики выросли.');
  },
  move(){
    const m = P.today.marks.find(x=>x.w===5 && x.obj==='fer' && x.out==null && !x.noOut);
    const bud = P.today.shifts.find(s=>s.obj==='bud' && s.close==null);
    if (!m || !bud){ logEv('Иван Петров уже не на Ferihegy или Budaörs закрыт — переезжать некуда.'); return; }
    P.clock = Math.max(P.clock, mn('13:35')); P.sec = 0;
    m.out = mn('13:00');
    P.today.marks.push({w:5, obj:'bud', sid:bud.id, in:mn('13:35'), out:null});
    logEv('Иван Петров уехал с Ferihegy в 13:00 (скан ухода у Tóth László) и пришёл на Budaörs в 13:35 (скан у Nagy Gábor). Часы делятся сами; в дне объекта — «переезд на…» и «приехал с…».');
  },
  endDay(){
    const open = P.today.shifts.filter(s=>s.close==null);
    if (!open.length){ logEv('Все смены уже закрыты.'); return; }
    P.clock = Math.max(P.clock, mn('17:05')); P.sec = 0;
    const closeAt = {fer:mn('17:02'), bud:mn('17:05'), kel:mn('16:55')};
    const reps = {fer:'Zsaluzás a 4. szinten kész. Holnap betonozás 7:00-tól.', bud:'Aljzatbetonozás kész a raktárcsarnok északi részén. Farkas Gergő a távozás beolvasása nélkül ment el.', kel:'Gipszkarton a 3. emeleten, 30% kész.'};
    open.forEach(s => {
      s.close = closeAt[s.obj] || P.clock; s.report = reps[s.obj] || REPORTS[0]; s.photos = s.obj==='fer' ? 2 : 1; s.isNew = true;
      P.today.marks.filter(m=>m.sid===s.id && m.out==null && !m.noOut).forEach(m => {
        if (m.w===9) m.noOut = true; else m.out = s.close - 3 - (m.w % 4);
      });
    });
    logEv(`Конец дня: бригадиры закрыли смены (${open.map(s=>objName(s.obj)).join(', ')}) и отправили отчёты. У Farkas Gergő на Budaörs уход не отсканирован — в табеле «уход не отмечен», часы по правилу: ${ruleTxt()}. У Дорина в колокольчике — ${open.length} новых отчёта.`);
  },
  signIn(){
    const c = P.code;
    if (!c || c.used || c.left<=0 || V(curView()).k!=='code'){ logEv('На экране кабинета сейчас нет живого кода для входа. Люди → человек → «Выдать доступ» → «Приложение уже есть — дальше».'); return; }
    const p = person(c.forId);
    c.used = true; p.phone = 'on'; p.since = dShort(TODAY_KEY); p.last = {d:0, t:hhmm(P.clock)};
    logEv(`${full(p)} вошёл в значке по коду с экрана Дорина (скан или 6 цифр). Движок привязал телефон; в «Людях» строка «Телефон привязан · сегодня ${hhmm(P.clock)}».`);
  },
  expire(){
    if (!P.code || P.code.used || P.code.left<=0){ logEv('Живого кода для входа сейчас нет — истекать нечему.'); return; }
    P.code.left = 0; logEv(`Прошло ${CODE_TTL/60} минут — код для входа истёк. Дорин может нажать «Новый код».`);
  },
  brand(){ S.brand = S.brand==='ld' ? 'engine' : 'ld'; syncUrl(); logEv(S.brand==='ld' ? 'Цвета LD Vill: тёмный и салатовый из принятых макетов, шрифт Plus Jakarta Sans — так станет, когда у картриджа будет своя палитра.' : 'Цвета движка — как у LD Vill на стенде сейчас.'); },
  lang(el){ S.lang = el.dataset.v; syncUrl(); render(); },
  reset(){ resetProto(); P.stack = []; P.tab = 'today'; },
};

setInterval(()=>{
  P.sec++;
  if (P.sec>=60){ P.sec = 0; P.clock++; }
  if (P.code && !P.code.used && P.code.left>0){ P.code.left--; if (P.code.left===0){ logEv('Срок кода для входа вышел. Дорин может нажать «Новый код».'); renderPult(); } }
  if (V(curView()).k==='code') renderApp();
}, 1000);

function render(){
  document.documentElement.lang = S.lang;
  document.querySelectorAll('[data-t]').forEach(el=>el.innerHTML=t(el.dataset.t));
  renderApp();
  renderPult();
  document.getElementById('notes').innerHTML = NOTES;
}
function syncUrl(){
  const o = {lang:S.lang, tab:P.tab};
  if (S.brand==='ld') o.brand = 'ld';
  if (P.stack.length) o.go = P.stack.join(',');
  history.replaceState(null, '', '?' + new URLSearchParams(o));
}
document.addEventListener('input', e=>{
  const f = e.target.dataset && e.target.dataset.field;
  if (f==='sur' || f==='name') P.draft[f] = e.target.value;
  if (f==='objName') P.objDraft.name = e.target.value;
  if (f==='objAddr') P.objDraft.addr = e.target.value;
});
document.addEventListener('focusout', e=>{ if (e.target.dataset && e.target.dataset.field) setTimeout(renderApp, 0); });
document.addEventListener('click', e=>{
  const a = e.target.closest('[data-act]');
  if (!a || !ACT[a.dataset.act]) return;
  if (document.activeElement && document.activeElement.dataset && document.activeElement.dataset.field) document.activeElement.blur();
  ACT[a.dataset.act](a);
  syncUrl(); renderApp(); renderPult();
});
resetProto();
render();
if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(()=>{});
