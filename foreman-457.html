<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LD Brigád — рабочее место бригадира · LD Vill</title>
<meta name="theme-color" content="#213946">
<!-- Ставится на телефон как приложение (PWA): на iPhone — «Поделиться → На экран „Домой“», на Android — «Установить». -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="LD Brigád">
<link rel="manifest" href="foreman.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<!--
  Чистовой макет рабочего места бригадира LD Vill (TG-444). Пара к принятому «Мой код» рабочего (my-code.html):
  тот же каркас телефона, палитра, размеры, языки и установка значком.

  Что здесь:
    · живой прототип (вид по умолчанию): вход, открытие смены на объекте из справочника, сканер пропусков,
      «рабочие на смене», отчёт и итог смены перед закрытием (в том числе когда не все отметили конец работы), прошлые смены только
      для чтения, меню с кодом для входа. Пульт играет остальной мир — рабочий показывает живой, просроченный
      или уже использованный код, чужой QR, связь, время дня, ошибка сервера; журнал пульта говорит, что
      произошло и какую точку движка звал экран. На телефоне пульт — выдвижная панель снизу;
    · доска всех состояний для обзора на компьютере (вид «все состояния»);
    · три размера экрана: узкий Android 360×640, iPhone 390×844, большой iPhone 430×932; тексты hu / ru / en;
    · решения, которые Oleg может поменять, и записка для разработчика — под прототипом.
  Адрес принимает ?lang=hu|ru|en&view=proto|all&size=s|m|l — для ссылок и снимков;
  ?debug красит рамку телефона, где содержимое не влезло (экраны со списками прокручиваются и не красятся).

  Экран входа, «Бригада», карточка человека и «Выдать доступ» (шаг 1 — установка, шаг 2 — вход) — экраны first, team, card,
  invite и code из login-qr.html (TG-443, вход по QR; кнопки — прямым действием, правило Oleg 21.11)
  один в один: тексты, одноразовый QR на 5 минут (код внутри QR, человек его не видит), «Код истёк» и
  «Новый код», заблокированному кода нет. Издалека входят ПИН-кодом — его выдаёт владелец (Oleg 25.11).
  Весь путь входа (камера, ПИН-код, ошибки) живёт там; здесь обе кнопки входа сразу открывают приложение.
  Данные выдуманы, сервера нет.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<style>
  /* ══ ТОКЕНЫ LD VILL — те же, что в my-code.html ══ */
  :root{
    --c-dark:#213946;      /* шапка, нижняя панель */
    --c-ink:#343A42;       /* основной текст (графит с ldvill.com) */
    --c-muted:#6B7680;     /* вторичный текст */
    --c-line:#E2E7E9;      /* рамки */
    --c-surface:#FFFFFF;   /* карточки */
    --c-ground:#F5F7F7;    /* фон экрана */
    --c-lime:#C7FF00;      /* акцент: активная вкладка, главная кнопка (лайм с ldvill.com) */
    --c-lime-ink:#7FA300;  /* акцент на светлом фоне */
    --c-warn:#E8A100;      --c-warn-bg:#FFF6DD; --c-warn-ink:#7A5400;
    --c-bad:#D64545;       --c-bad-bg:#FDECEC;
    --c-ok:#2E9E5B;        --c-ok-bg:#E7F6EE;
    --font:"Plus Jakarta Sans","Segoe UI",Arial,sans-serif;
    --radius:2px;          /* бренд — прямые углы */
    /* размеры телефона */
    --ph-w:390px; --ph-h:844px; --safe-top:47px; --safe-bottom:34px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:#E9EEF0;color:var(--c-ink);font-family:var(--font);-webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit;cursor:pointer}

  /* ══ ПУЛЬТ МАКЕТА (не часть экрана) ══ */
  .deck{max-width:1440px;margin:0 auto;padding:20px 20px 40px}
  .deck h1{font-size:22px;margin:0 0 4px;font-weight:800}
  .deck .sub{color:var(--c-muted);margin:0 0 16px;font-size:14px}
  .controls{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;margin-bottom:20px}
  .seg{display:inline-flex;border:1px solid #C9D2D6;background:#fff}
  .seg button{border:0;background:none;padding:7px 12px;font-size:13px;font-weight:600}
  .seg button[aria-pressed="true"]{background:var(--c-dark);color:#fff}
  .ctl-l{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--c-muted);margin-right:6px;font-family:ui-monospace,Menlo,monospace}

  .stage{display:flex;flex-direction:column;gap:36px}
  .board{display:grid;grid-template-columns:repeat(auto-fill,minmax(440px,1fr));gap:28px 24px;justify-items:center}
  .sizes{display:flex;flex-wrap:wrap;gap:28px 40px;align-items:flex-end;margin-bottom:12px}
  .sec{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--c-muted);font-family:ui-monospace,Menlo,monospace;margin:8px 0 20px}
  .cell figcaption{margin-top:8px;font-size:13px;max-width:var(--ph-w)}
  .cell figcaption b{display:block;font-size:14px}
  .cell figcaption code{font-size:11px;color:var(--c-muted)}
  .cell figcaption .dec{display:inline-block;margin-top:4px;font-size:11px;font-weight:700;background:var(--c-warn-bg);color:var(--c-warn-ink);padding:1px 6px}
  figure{margin:0}

  .notes{max-width:860px;background:#fff;border:1px solid var(--c-line);padding:18px 20px;font-size:14px;line-height:1.5}
  .notes h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--c-muted);margin:18px 0 6px;font-family:ui-monospace,Menlo,monospace}
  .notes h2:first-child{margin-top:0}
  .notes table{border-collapse:collapse;width:100%;font-size:13px}
  .notes td,.notes th{border-top:1px solid var(--c-line);padding:5px 6px 5px 0;vertical-align:top;text-align:left}
  .notes code{font-size:12px;background:var(--c-ground);padding:0 3px}
  .notes ol.decisions li{margin-bottom:6px}
  .tag{display:inline-block;font-size:10px;font-weight:700;padding:1px 5px;letter-spacing:.04em;text-transform:uppercase}
  .tag.have{background:var(--c-ok-bg);color:var(--c-ok)}
  .tag.ask{background:var(--c-warn-bg);color:var(--c-warn-ink)}
  .tag.cli{background:var(--c-ground);color:var(--c-muted)}

  /* ══ ТЕЛЕФОН ══ */
  .phone{width:var(--ph-w);height:var(--ph-h);background:var(--c-ground);position:relative;overflow:hidden;
    outline:10px solid #11181C;border-radius:44px;box-shadow:0 18px 40px rgba(0,0,0,.18);display:flex;flex-direction:column}
  .top{flex:none}
  .sb{height:var(--safe-top);background:var(--c-dark);color:#fff;display:flex;align-items:flex-end;justify-content:space-between;padding:0 30px 8px;font-size:15px;font-weight:600;flex:none}
  .sb .net{font-size:12px;letter-spacing:.05em}
  .appbar{background:var(--c-dark);color:#fff;padding:10px 20px 16px;flex:none}
  .appbar .row{display:flex;align-items:center;gap:12px}
  .logo{width:34px;height:34px;background:var(--c-lime);color:var(--c-dark);display:grid;place-items:center;font-weight:800;font-size:14px;letter-spacing:-.02em}
  .who{line-height:1.2;flex:1;min-width:0}
  .who b{display:block;font-size:15px}
  .who span{font-size:12px;color:#B9C6CD}
  .appbar h2{margin:14px 0 0;font-size:26px;font-weight:800;letter-spacing:-.01em}
  .appbar h2.long{font-size:20px;line-height:1.15}
  .appbar h2 small{display:block;font-size:13px;font-weight:600;opacity:.7;margin-top:3px}
  .appbar .ham{border:0;background:none;color:#fff;width:34px;height:34px;display:grid;place-items:center;padding:0}
  .appbar .ham svg{width:24px;height:24px}
  .appbar .backb{border:0;background:none;color:#fff;padding:0;font-size:14px;font-weight:700;display:flex;align-items:center;gap:4px;opacity:.85}
  .appbar .backb svg{width:18px;height:18px}

  .body{flex:1;overflow:hidden;padding:16px 20px;display:flex;flex-direction:column;gap:14px}
  .body.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;min-height:0}   /* min-height:0 — иначе тело растёт по содержимому и низ обрезает рамка телефона */
  .body.scroll > *{flex-shrink:0}   /* длинный экран прокручивается, а не сплющивает блоки (фото, камеру) */
  .tabs{flex:none;display:flex;background:var(--c-dark);padding-bottom:var(--safe-bottom)}
  .tabs span{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0 6px;font-size:12px;font-weight:600;color:#C9D5DB;border-top:3px solid transparent;cursor:pointer} /* неактивная читается: «Прошлые» было почти не видно (Oleg 24.11) */
  .tabs span.on{color:#fff;border-top-color:var(--c-lime)}
  .tabs svg{width:22px;height:22px}

  .state{display:flex;gap:12px;align-items:flex-start;background:var(--c-surface);border:1px solid var(--c-line);padding:12px 14px}
  .state svg{flex:none;width:22px;height:22px;margin-top:1px}
  .state b{display:block;font-size:15px}
  .state span{font-size:13px;color:var(--c-muted)}
  .state.off svg{color:var(--c-muted)}


  .qrbox{background:#fff;border:1px solid var(--c-line);padding:18px 18px 14px;display:flex;flex-direction:column;align-items:center;gap:12px}
  .qr{width:var(--qr);height:var(--qr);position:relative;display:grid;place-items:center}
  .qr svg{width:var(--qr);height:var(--qr);display:block}
  .qr .fallback{width:var(--qr);height:var(--qr);display:grid;place-items:center;background:repeating-conic-gradient(#343A42 0 25%,#fff 0 50%) 0 0/24px 24px;opacity:.85}
  .ttl{width:100%;height:6px;background:var(--c-line)}
  .ttl i{display:block;height:100%;background:var(--c-lime-ink);transition:width .9s linear}
  .ttl.low i{background:var(--c-warn)}
  .count{font-size:14px;color:var(--c-muted);font-variant-numeric:tabular-nums}
  .count b{color:var(--c-ink)}
  .hint{margin:0;text-align:center;font-size:13px;color:var(--c-muted)}

  .compact .appbar{padding:6px 16px 10px} .compact .appbar h2{font-size:21px;margin-top:8px} .compact .appbar h2.long{font-size:17px}
  .compact .logo{width:28px;height:28px;font-size:12px}
  .compact .body{padding:10px 16px;gap:10px}
  .compact .state{padding:8px 12px} .compact .state span{font-size:12px}
  .compact .qrbox{padding:12px 12px 10px;gap:8px}
  .compact .warnl{padding:6px 8px;font-size:12px}
  .compact .tabs span{padding:7px 0 5px}
  .phone.overflow{outline-color:var(--c-bad)}

  /* установка на iPhone — как в my-code.html */
  .safari{flex:none;display:flex;justify-content:space-around;align-items:center;background:#F2F2F4;border-top:1px solid #D6D6DA;padding:10px 0 calc(var(--safe-bottom) + 4px);color:#0A84FF;font-size:22px}
  .safari svg{width:22px;height:22px}
  .safari .hl{outline:2px solid var(--c-lime-ink);outline-offset:5px;border-radius:4px}
  .dim{position:absolute;inset:0;background:rgba(17,24,28,.45);z-index:6}
  .sheet{position:absolute;left:12px;right:12px;bottom:calc(var(--safe-bottom) + 64px);background:#fff;padding:18px 18px 12px;box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:7}
  .sheet .st{font-size:18px;display:block}
  .sheet p{margin:4px 0 12px;font-size:13px;color:var(--c-muted)}
  .sheet ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
  .sheet li{display:flex;gap:10px;align-items:center;font-size:14px}
  .sheet .n{flex:none;width:24px;height:24px;background:var(--c-dark);color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px}
  .sheet .inl{width:18px;height:18px;vertical-align:-4px;color:#0A84FF}
  .ghost{border:0;background:none;color:var(--c-muted);font-weight:700;font-size:14px;padding:12px 0 2px;width:100%}
  .sheet .arrow{position:absolute;left:50%;bottom:-10px;margin-left:-10px;width:20px;height:20px;background:#fff;transform:rotate(45deg)}

  /* Три вида кнопок (TG-454): главная — лайм во всю ширину, одна на экран; тихая — контур; ссылка — текст. */
  .btn{border:0;background:var(--c-lime);color:var(--c-dark);font-weight:800;font-size:16px;padding:15px 22px;width:100%;margin-top:4px;border-radius:var(--radius);display:flex;align-items:center;justify-content:center;gap:10px}
  .btn svg{width:22px;height:22px}
  .btn.line{background:#fff;color:var(--c-ink);border:1px solid #C9D2D6}
  .link{border:0;background:none;padding:0;color:var(--c-dark);font-weight:800;text-decoration:underline;text-underline-offset:3px;font-size:inherit}
  .btn[disabled]{background:var(--c-line);color:var(--c-muted);cursor:not-allowed}
  .btn.line[disabled]{background:#fff}

  /* вход */
  .login{flex:1;display:flex;flex-direction:column;justify-content:center;gap:10px;padding:0 6px}
  .login .logo.big{width:64px;height:64px;font-size:24px;margin-bottom:6px}
  .login > b{font-size:26px;font-weight:800} .login > span{color:var(--c-muted);margin-bottom:18px}
  /* Экран входа с тремя способами — как в login-qr-456.html (TG-456, замечание Oleg 25.11) */
  .lnk{border:0;background:none;color:var(--c-muted);font:inherit;font-size:14px;text-decoration:underline;text-underline-offset:3px;padding:6px;align-self:center;cursor:pointer}
  .lnk svg{width:15px;height:15px;vertical-align:-2px}
  .lnk.strong{color:var(--c-ink);font-weight:700;font-size:15px}
  .orline{display:flex;align-items:center;gap:10px;color:var(--c-muted);font-size:13px}
  .orline::before,.orline::after{content:'';flex:1;border-top:1px solid var(--c-line)}

  /* ══ ЭКРАНЫ БРИГАДИРА ══ */
  .h3{margin:4px 0 -4px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--c-muted);font-weight:700}
  .nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .nums div{background:#fff;border:1px solid var(--c-line);padding:8px 10px}
  .nums b{display:block;font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
  .nums span{font-size:12px;color:var(--c-muted)}
  .nums .here b{color:var(--c-ok)}
  .compact .nums b{font-size:20px}
  .people{background:#fff;border:1px solid var(--c-line)}
  .people .p{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--c-line)}
  .people .p:first-child{border-top:0}
  .people .dot{flex:none;width:10px;height:10px;border-radius:50%;background:var(--c-muted)}
  .people .p.in .dot{background:var(--c-ok)}
  .people .p.miss .dot{background:var(--c-warn)}
  .people .n{flex:1;font-weight:700;font-size:15px;min-width:0}
  .people .tm{font-size:13px;color:var(--c-muted);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
  .people .tm em{font-style:normal;color:var(--c-ok);font-weight:700}
  .people .tm .w{color:var(--c-warn-ink);font-weight:700}
  .compact .people .p{padding:7px 10px} .compact .people .n{font-size:14px}
  /* паузы (TG-457, макет «Мой код»): кто сейчас на перекуре или обеде — жёлтым, сверх срока — красным */
  .people .p.pause .dot{background:var(--c-warn)}
  .people .tm .pz{color:var(--c-warn-ink);font-weight:700} .people .tm .pz.over{color:var(--c-bad)}
  .pausing{background:var(--c-warn-bg);border-left:4px solid var(--c-warn);padding:8px 10px;font-size:13px;color:var(--c-warn-ink)}
  .pausing b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
  .pausing div{display:flex;justify-content:space-between;gap:8px;padding:2px 0;color:var(--c-ink)}
  .pausing div span{white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--c-warn-ink);font-weight:700}
  .pausing div span.over{color:var(--c-bad)}
  .sumt td .w{white-space:normal}   /* «конец работы не отмечен» переносится: с колонкой «Паузы» на 360 точек иначе не влезают часы */
  .sumt td small{display:block;font-weight:400;font-size:11.5px;color:var(--c-muted);white-space:normal}
  .empty{background:#fff;border:1px dashed #C9D2D6;padding:18px 14px;text-align:center;color:var(--c-muted);font-size:14px}

  .objs{display:flex;flex-direction:column;gap:8px}
  .obj{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--c-line);padding:12px 14px;text-align:left;width:100%}
  .obj svg{flex:none;width:22px;height:22px;color:var(--c-dark)}
  .obj b{display:block;font-size:15px}
  .obj span{font-size:13px;color:var(--c-muted)}
  .obj[disabled]{opacity:.6;cursor:not-allowed}
  .obj[disabled] span{color:var(--c-warn-ink);font-weight:600}
  .obj .go{margin-left:auto;color:var(--c-muted)}
  .compact .obj{padding:9px 12px}

  /* сканер: камера внутри приложения */
  .cam{flex:1;position:relative;background:radial-gradient(circle at 50% 40%,#3B4A52,#11181C 75%);display:flex;align-items:center;justify-content:center;min-height:240px}
  .cam .frame{width:62%;aspect-ratio:1;position:relative}
  .cam .frame i{position:absolute;width:34px;height:34px;border:4px solid var(--c-lime)}
  .cam .frame i:nth-child(1){left:0;top:0;border-right:0;border-bottom:0}
  .cam .frame i:nth-child(2){right:0;top:0;border-left:0;border-bottom:0}
  .cam .frame i:nth-child(3){left:0;bottom:0;border-right:0;border-top:0}
  .cam .frame i:nth-child(4){right:0;bottom:0;border-left:0;border-top:0}
  .cam .aim{position:absolute;left:0;right:0;top:14px;text-align:center;color:#fff;font-size:14px;font-weight:600;padding:0 16px}
  .res{position:absolute;left:12px;right:12px;bottom:12px;background:#fff;padding:14px 14px 12px;display:flex;gap:12px;align-items:flex-start;box-shadow:0 8px 24px rgba(0,0,0,.35);border-left:6px solid var(--c-ok)}
  .res .ri{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--c-ok);color:#fff}
  .res .ri svg{width:24px;height:24px}
  .res b{display:block;font-size:17px}
  .res .rt{font-size:20px;font-weight:800;line-height:1.2;font-variant-numeric:tabular-nums}
  .res span{display:block;font-size:13px;color:var(--c-muted);margin-top:2px}
  .res small{display:block;font-family:ui-monospace,Menlo,monospace;font-size:10.5px;color:var(--c-muted);margin-top:4px}
  .res.out{border-left-color:var(--c-dark)} .res.out .ri{background:var(--c-dark)}
  .res.warn{border-left-color:var(--c-warn)} .res.warn .ri{background:var(--c-warn)}
  .res.bad{border-left-color:var(--c-bad)} .res.bad .ri{background:var(--c-bad)}

  /* скан как регистрация (Oleg 24.11): прочитала один код — камера стоп, крупно кто и что, «Подтвердить» */
  .cam.off{background:#2A353B;min-height:0;flex:none;height:110px}
  .cam.off .res{position:static;margin:0 12px;flex:1}
  .reg{background:#fff;border:1px solid var(--c-line);border-top:6px solid var(--c-ok);padding:14px 16px 10px;display:flex;flex-direction:column;gap:8px}
  .reg.out{border-top-color:var(--c-dark)} .reg.short{border-top-color:var(--c-warn)}

  .work{display:flex;gap:40px;align-items:flex-start;flex-wrap:wrap}

  /* На узком экране (телефон Oleg) — один телефон на всю ширину, без рамки; пульт — выдвижная панель снизу */
  @media (max-width:460px){
    .deck{padding:12px 0 30px}

  body.standalone .pult.open{transform:none}
  body.standalone .pult .handle{display:block;flex:none;height:44px;border:0;background:var(--c-lime);color:var(--c-dark);font-weight:800;font-size:15px;width:100%}
  body.standalone .pult .ptitle{display:none}
  body.standalone .pult .pin{overflow:auto;padding-bottom:calc(16px + env(safe-area-inset-bottom, 0px))}
  body.standalone .log{max-height:none}
  /* Отступы по краям — как в my-code.html: нижний безопасный отступ один раз и только под меню; на экране входа меню нет.
     Обычная колонка (TG-440): телефон прибит к краям окна, внутри шапка — содержимое (flex:1) — меню; ничего не прибито
     поверх и ничего не досчитывает скрипт. Строка состояния значка — black, не black-translucent: окно кончается на дне
     экрана, отступ меню — ровно safe-area (app/README.md, «Экран во весь телефон»). Оттягивание выключено у html. */
  html.standalone{background:var(--c-ground);overscroll-behavior:none}
  body.standalone .tabs span{box-sizing:border-box;height:49px;justify-content:center;gap:2px;padding:0}

</style>

<script>
/* ══ ДАННЫЕ (выдуманы) ══ */
const FOREMAN = 'Tóth László';
/* Справочник объектов — системный: бригадир выбирает из него, сам объекты не заводит. busy — на объекте уже открыта смена
   другого бригадира (на объекте одна смена). */
const OBJECTS = [
  {id:'fer', name:'Ferihegy, 2-es terminál', addr:'Budapest, XVIII. ker.'},
  {id:'bud', name:'Budaörs, raktárcsarnok',  addr:'Budaörs, Gyár u. 2.', busy:'Nagy Gábor'},
  {id:'kel', name:'Kelenföld, irodaház',     addr:'Budapest, XI. ker.'},
];
/* Рабочие, которые на пульте показывают код. Бригадир их заранее не выбирает: «свои» — те, кого он отметил на своей смене. */
const WORKERS = ['Horváth Ádám','Иван Петров','Kiss Péter','Szabó Márk'];
/* «Бригада» — заведённые владельцем рабочие, кому бригадир может выдать доступ (как в login-qr.html, TG-443).
   Заблокированному код не выдаётся. */
const TEAM = [
  {id:2, sur:'Horváth', name:'Ádám',  role:'worker', phone:'on',   last:{d:0,  t:'07:48'}},
  {id:3, sur:'Kiss',    name:'Péter', role:'worker', phone:'on',   last:{d:-1, t:'17:00'}},
  {id:5, sur:'Szabó',   name:'Márk',  role:'worker', phone:'none'},
  {id:4, sur:'Varga',   name:'Zsolt', role:'worker', phone:'none', blocked:true},
];

const ic = (n, cls='') => `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${IC[n]}</svg>`;

/* ══ ЭКРАН ══
   Один рендер на всё: экран рисуется из модели m — и живой прототип (модель P), и доска состояний (застывшие модели).
   m.screen: login · noshift · pick · shift · scan · close · summary · closed · past (список) · pastday (смена на весь экран, лента) · lcpick · lcode;
   поверх — m.sheet: confirm · menu; m.install — шторка установки. */
function marksStat(marks){
  // Считаем людей, а не отметки: ушёл и вернулся — две отметки, но один человек.
  const people = new Set(marks.map(x=>x.n));
  const here = new Set(marks.filter(x=>!x.out && !x.miss).map(x=>x.n));
  const left = [...people].filter(n=>!here.has(n) && marks.some(x=>x.n===n && x.out)).length;
  return {here:here.size, came:people.size, left};
}
/* Часы смены: по каждой отметке конец − начало работы − паузы; без конца работы часов нет (так и в табель). */
const mins = s => +s.slice(0,2)*60 + +s.slice(3,5);
const hm = m => t('hm',{h:Math.floor(m/60), m:String(m%60).padStart(2,'0')});
const hhmmDur = m => Math.floor(m/60)+':'+String(m%60).padStart(2,'0');   // часы в таблице и цифрах отчёта — коротко, «9:12»
/* Паузы: now — минуты «сейчас» для идущей паузы (часы сервера); законченная считается от начала до конца. */
const pMin = (p, now) => Math.max(0, (p[2] ? mins(p[2]) : now) - mins(p[1]));
const pauseNow = x => !x.out && !x.miss ? (x.p||[]).find(p=>!p[2]) : null;
const pauseSum = (x, now) => (x.p||[]).reduce((a,p)=>a+pMin(p, now),0);
/* «перекур 2×, 19 мин · обед 32 мин» — как строка дня в «Моих сменах» рабочего */
function pauseText(x, now){
  const of = k => (x.p||[]).filter(p=>p[0]===k), sm = of('smoke'), ln = of('lunch');
  const sum = ps => ps.reduce((a,p)=>a+pMin(p, now),0);
  return [sm.length ? t('days.smoke',{n:sm.length, m:sum(sm)}) : '', ln.length ? t('days.lunch',{m:sum(ln)}) : ''].filter(Boolean).join(' · ');
}
function shiftTotals(marks, now = 24*60){
  const rows = marks.map(x=>({...x, pz:pauseSum(x, now), m: x.out ? mins(x.out)-mins(x.in)-pauseSum(x, now) : null}));
  return {rows, people:new Set(marks.map(x=>x.n)).size, total:rows.reduce((a,r)=>a+(r.m||0),0), pz:rows.reduce((a,r)=>a+r.pz,0),

}
/* Кто сейчас на паузе (TG-457): одна жёлтая плашка над списком — имя, перекур или обед, с какого времени и сколько из

function pausingBlock(marks, clock){
  const now = Math.floor(clock/60);
  const on = marks.map(x=>({x, p:pauseNow(x)})).filter(r=>r.p);
  if (!on.length) return '';
  return `<div class="pausing"><b>${t('pz.now')}</b>${on.map(({x, p})=>{
    const m = pMin(p, now), lim = BREAK_MIN[p[0]], over = m - lim;
    return `<div>${esc(x.n)} · ${t('brk.'+p[0]).toLowerCase()} ${p[1]}<span class="${over>0?'over':''}">${over>0 ? t('pz.over',{m:over}) : t('pz.of',{m, lim})}</span></div>`;
  }).join('')}</div>`;
}
/* Карточка отчёта смены — один вид везде (Oleg 22.11, третий круг): итог перед отправкой, «Отчёт отправлен» и

    <div class="rstats"><div><b>${T_.people}</b><span>${t('rc.people')}</span></div><div><b>${hhmmDur(T_.total)}</b><span>${t('rc.hours')}</span></div>

/* Таблица итога: паузы по людям (TG-457) — колонка «Паузы» (ч:мм) и под именем мелко «перекур 2×, 19 мин · обед 32 мин»;

    <tr class="tot"><td>${t('su.tot')}</td><td colspan="2">${t('rc.people.n',{n:T_.people})}</td><td>${T_.pz?hhmmDur(T_.pz):'—'}</td><td>${hhmmDur(T_.total)}</td></tr></table>`;

<tr><td>Порог раннего ухода</td><td><span class="tag ask">контракт</span> поле документа процесса «Настройки» (<code>settings</code>) контрактов LD Vill — единственный документ в статусе «Действует» (<code>active</code>), рядом с <code>default_start</code> и <code>round_minutes</code> из TG-458; новое поле, например <code>min_stay_minutes</code>, целое, по умолчанию 15, правит владелец. Отдельных настроек модуля в движке больше нет (engine#691): приложение читает этот документ обычным списком документов процесса с фильтром по статусу, поэтому бригадиру нужно право читать «Настройки». Документа нет — приложение берёт 15. Вопрос «точно уход?» задаёт приложение, движок уход не запрещает. <span class="tag ask">уточнить</span> подсветка таких отметок в кабинете владельца: вычисляемое поле «короткая отметка» (длительность меньше порога настройки) — рецепта сравнения с настройкой у движка нет, рядом есть <code>duration</code> и <code>late</code>; решает оркестратор до кода.</td></tr>
<tr><td>«Сейчас на паузе», паузы в итоге смены</td><td><span class="tag ask">контракт добавит</span> пауза — отметка рабочего без бригадира: вид (перекур / обед), начало и конец по времени сервера, связь с его отметкой начала работы (макет «Мой код», записка). Экран смены читает паузы отметок своей смены тем же списком, что и отметки; идущая пауза — без конца. Часы отметки = конец − начало работы − паузы: <span class="tag ask">уточнить</span> считать ли их полем отметки при уходе (тогда закрытие смены закрывает и идущие паузы) — тот же вопрос, что часы в кабинете владельца. Сроки — поля документа «Настройки» (<code>smoke_minutes</code>, <code>lunch_minutes</code>, включатель пауз), бригадиру нужно право их читать.</td></tr>
<tr><td>Ошибки скана</td><td><span class="tag have">есть</span> <code>409 pass_expired</code> — «код просрочен»; <code>pass_already_used</code> — «уже использован»; <code>pass_unknown</code> и <code>pass_wrong_process</code> — «это не пропуск LD Vill»; <code>409 PASS_ARRIVAL_PENDING</code> — «начало работы только что отмечено, отсканируйте через пару секунд» (код не тратится); <code>400 INVALID_TRANSITION</code> (смена уже закрыта) и <code>404 REPORT_NOT_FOUND</code> — экран возвращается к «Смена не открыта»; 5xx и обрыв — «сервер не ответил». Без сети гасить нельзя: проверяет сервер.</td></tr>
<tr><td>«Рабочие на смене», счётчики «на объекте · пришли · ушли»</td><td>Счётчики — по людям, а не по отметкам: ушёл и вернулся — две отметки, один человек. <span class="tag ask">уточнить</span> отметки рабочих под этой сменой (документы процесса отметок, связанные со сменой) — список документов есть, но «только отмеченные мной» — фильтр по тому, кто погасил код. Так как на объекте одна смена и её открыл этот бригадир, все отметки под ней — его; отдельный фильтр нужен, только если Oleg поменяет решение 1.</td></tr>
<tr><td>Отчёт и закрытие смены</td><td><span class="tag ask">уточнить</span> поле отчёта у смены (обязательное на переходе «закрыть» — guard или <code>required</code> на шаге) и фото (поле-файл). Формат пропусков «забыл уйти» не решает: «конец работы не отмечен» — дело перехода закрытия смены в контракте (например, действие, которое закрывает открытые отметки со статусом «без конца работы»).</td></tr>
<tr><td>Отчёт голосом</td><td><span class="tag cli">клиент</span> распознавание речи — средство телефона (Web Speech API, а на iPhone — диктовка клавиатуры), в движок уходит готовый текст. <span class="tag ask">уточнить</span> «Поправить с AI» — новая AI-задача движка «поправить текст отчёта» (контракт <code>ai_tasks</code>); в аварийном режиме без AI кнопка скрыта, как и другие AI-кнопки платформы.</td></tr>
<tr><td>Прошлые смены</td><td><span class="tag have">есть</span> список документов-смен этого бригадира (закрытые), от новой к старой: список строк (дата, объект, время, люди, часы — из тех же отметок, что итог), а нажатая смена — карточка документа только для чтения. <span class="tag cli">клиент</span> смена на весь экран — лента с вертикальным свайпом (CSS scroll-snap), на компьютере — колесо и стрелки; длинная лента подгружается страницами по мере листания.</td></tr>
<tr><td>Вход, «Бригада», «Выдать доступ»</td><td><span class="tag ask">TG-443</span> экраны — из <code>login-qr.html</code> один в один; точки движка «выдать код входа» и вход по нему — новые, описаны в записке под тем макетом. Список «Бригада» — заведённые владельцем рабочие с признаком «телефон привязан / заблокирован».</td></tr>
<tr><td>Имя и роль в шапке</td><td><span class="tag cli">клиент</span> вошедший человек.</td></tr>
</table>

<h2>Как экран переходит из состояния в состояние</h2>
<p>После входа — «Смена не открыта» (1): кнопки сканера нет, есть одна — «Начать смену». Дальше выбор объекта (2; первым — объект прошлого раза) и подтверждение (3), где только объект и время. Открытая смена (4): объект и время открытия — в заголовке, под ним счётчики «на объекте · пришли · ушли», главная кнопка «Сканировать пропуск» и под ней одна строка «Начало или конец работы рабочий выбирает у себя на телефоне»; после скана — итог последнего скана «Начало работы · имя · время». «Сканировать пропуск» открывает камеру (6). Камера читает один код и останавливается (Oleg 24.11): карточка регистрации — крупно имя, начало или конец работы, время, объект, смена — и «Подтвердить» (6a); при раннем уходе — вопрос «точно уход?» (6b); код на начало работы у того, кто на объекте, — «уже на объекте», ничего не меняется (6c). После «Подтвердить» — итог «Начало работы · имя · время» и строка в списке «Рабочие на смене» (7, 8); следующего — кнопкой «Сканировать следующего». «Готово» — назад к смене (5). «Закрыть смену» — тихая кнопка внизу (14): отчёт обязателен, его можно набрать или надиктовать (15a–15d); у кого нет ухода — одна строка с именами и «Назад к смене» (15). «Дальше: итог смены» (15e, 15f) — итоговый отчёт, он же подтверждение: «Отправить и закрыть смену» или «Поправить отчёт». После отправки (16) — та же карточка отчёта и «Готово», которое ведёт домой. Прошлые смены — вкладка снизу или пункт меню: сначала список компактных строк (17) — дата, объект, время, люди, часы, сколько без конца работы (уточнение Oleg 22.11). Нажал на строку — смена открывается на весь экран (18), и там соседние смены листаются вертикальным свайпом, как в TikTok (на компьютере — колесо и стрелки); справа — точки «где вы»; «Назад» — к списку на то же место; только чтение.</p>
<p>Связь у бригадира пропала — открыть смену, отметить и закрыть смену нельзя: всё это проверяет сервер. Экран говорит об этом прямо, отчёт не теряется.</p>

<h2>Размеры</h2>
<p>Те же три опорных размера, что у «Мой код»: 360×640, 390×844, 430×932. Экраны со списками (смена, сканер, выбор объекта, закрытие, итог) прокручиваются, «Прошлые» листаются по смене — кнопка «Сканировать пропуск» стоит выше списка людей и видна без прокрутки; на сканере камера и кнопка «Готово» видны без прокрутки, список — под ними. Экран итога закрытия — без прокрутки.</p>
`;

/* ══ ЖИВОЙ ПРОТОТИП ══
   Телефон бригадира ведёт себя как настоящий экран, а пульт играет «остальной мир»: рабочих с их кодами, сеть, сервер.
   Время — часы сервера. */
const P = {};
function resetProto(){
  TEAM.splice(0, TEAM.length, ...JSON.parse(TEAM0));
  Object.assign(P, {screen:'login', sheet:null, install:false, net:true, clock:7*3600+43*60+30, shift:null, res:null, reg:null,
    report:'', photos:0, voice:null, aiOff:false, chosen:null, closedInfo:null, past:PAST0.map(d=>({...d})), pastIdx:0, listTop:0, jump:null,
    lc:null, failNext:false, worker:0, log:[], drawer:P.drawer||false});
  logEv('Бригадир открыл приложение — экран входа.');
}
function logEv(text){ P.log.unshift({at:hhmm(P.clock)+':'+String(P.clock%60).padStart(2,'0'), text}); if (P.log.length>40) P.log.pop(); renderPult(); }
const needHint = () => !INSTALLED && S.size!=='s';
const home = () => P.shift ? 'shift' : 'noshift';
function go(screen){ P.screen = screen; P.sheet = null; if (screen!=='scan'){ P.res = null; P.reg = null; } }
/* Итог скана стоит, пока бригадир не нажмёт «Сканировать следующего» — камера сама не включается (Oleg 24.11). */
function scanRes(kind, name, extra={}){ P.reg = null; P.res = {kind, name, time:hhmm(P.clock), ...extra}; }
/* Камера прочитала код (в жизни — «чей код», POST …/pass/lookup: имя хозяина и действие из кода, ничего не гасит). */
function readCode(intent, name){
  if (!P.net){ scanRes('offline', name); logEv('Камера прочитала код, но у бригадира нет сети — проверяет сервер, отметки нет.'); return; }
  if (P.failNext){ P.failNext=false; scanRes('error', name); logEv('Движок ответил 503 — камера остановлена, «Сканировать снова».'); return; }
  const open = P.shift.marks.find(x=>x.n===name && !x.out && !x.miss);
  if (intent==='in' && open){ scanRes('already', name, {since:open.in}); logEv(`${name}: код на начало работы, а он на объекте с ${open.in}. Движок ничего не меняет, код не тратится.`); return; }
  if (intent==='out' && !open){ scanRes('noin', name); logEv(`${name}: код на конец работы, а начала работы нет. Движок ничего не меняет, код не тратится.`); return; }
  if (open && P.clock - open.inSec < PENDING_SEC){ scanRes('pending', name); logEv(`${name}: начало работы только что отмечено, отметка ещё в очереди движка — 409 PASS_ARRIVAL_PENDING, код не потрачен.`); return; }
  const stay = open ? Math.max(0, Math.round((P.clock - open.inSec)/60)) : 0;
  P.res = null; P.reg = {kind:intent, name, time:hhmm(P.clock), stay};
  logEv(`Камера прочитала код ${name} и остановилась: ${intent==='in'?'начало работы':'конец работы'}${intent==='out' && stay<SHORT_MIN ? ` — пробыл ${stay} мин, меньше порога ${SHORT_MIN} мин: экран спрашивает «точно уход?»` : ''}. Ждём «Подтвердить».`);
}
const ACT = {
  login(){ go(home()); P.install = needHint(); logEv((P.shift ? 'Вход выполнен. Открытая смена на месте — движок её помнит.' : 'Вход выполнен. Смены нет — сканер закрыт, пока бригадир не отметится на объекте.')+(P.install?' Открыто в Safari на iPhone — шторка «как установить».':'')); },
  later(){ P.install=false; logEv('Бригадир нажал «Позже» — шторка спрятана.'); },
  pick(){ go('pick'); logEv('Выбор объекта из справочника системы.'); },
  choose(id){ P.chosen = id; P.sheet = 'confirm'; },
  cancel(){ P.sheet = null; },
  open(){
    if (!P.net){ logEv('Нет связи — смена не открыта.'); return; }
    if (P.failNext){ P.failNext=false; P.sheet=null; logEv('Движок ответил 503 на открытие смены — бригадир повторит.'); return; }
    P.shift = {obj:P.chosen, opened:hhmm(P.clock), marks:[]}; P.report=''; P.photos=0; go('shift');
    logEv(`Смена открыта: ${objName(P.chosen)}, ${P.shift.opened} по часам сервера (создан документ смены, переход «открыть»). Теперь можно сканировать.`);
  },
  scan(){ go('scan'); P.reg = null; P.res = null; logEv('Камера включена — прочитает один код и остановится. Теперь на пульте: «рабочий показывает код».'); },
  /* «Подтвердить»: только теперь код гасится (POST …/documents/{смена}/pass/redeem); время — сервера. */
  confirm(){
    const r = P.reg; if (!r) return;
    const time = hhmm(P.clock), open = P.shift.marks.find(x=>x.n===r.name && !x.out && !x.miss);
    P.shift.last = {kind:r.kind, name:r.name, time};
    // уход с паузы — пауза кончается временем ухода (как в «Мой код»: «Закончить работу» видна и на паузе)
    if (r.kind==='out' && open){ const pz = pauseNow(open); if (pz) pz[2] = time; open.out = time; if (r.stay < SHORT_MIN) open.short = true; }
    else P.shift.marks.push({n:r.name, in:time, inSec:P.clock});
    scanRes(r.kind, r.name);
    logEv(`Бригадир подтвердил: ${r.kind==='in'?'НАЧАЛО РАБОТЫ':'КОНЕЦ РАБОТЫ'} ${r.name}, ${time} по часам сервера${r.kind==='out' && r.stay<SHORT_MIN ? ' — ранний уход, в кабинете владельца отметка подсвечена' : ''}. Камера стоит до «Сканировать следующего».`);
  },
  regcancel(){ logEv(`Бригадир нажал «Отмена» — код ${P.reg?.name||''} не погашен, камера снова ищет код.`); P.reg = null; P.res = null; },
  scandone(){ go('shift'); },
  toclose(){ go('close'); logEv('Экран закрытия смены: без отчёта дальше не пройти.'); },
  /* «Назад к смене» с закрытия и итога (TG-454): отчёт, надиктованное и фото живут в смене, а не в экране —
     бригадир досканирует уход, снова нажмёт «Закрыть смену», и всё на месте. Шла запись голоса — она останавливается. */
  toshift(){
    if (P.voice==='rec') P.voice = null;   // запись не закончена — надиктованного нет, в поле только набранное руками
    go('shift');
    logEv(`Бригадир вернулся к смене отметить конец работы. Отчёт${P.photos?` и ${P.photos} фото`:''} сохранены — вернутся на закрытии.`);
  },
  tosummary(){
    if (!(P.report||'').trim()){ logEv('Отчёт пустой — дальше не пройти.'); return; }
    go('summary'); logEv('Итог смены: таблица по рабочим, всего людей и часов, кто без конца работы, текст отчёта. Это и есть подтверждение закрытия.');
  },
  photo(){ P.photos = Math.min(4, P.photos+1); logEv('Бригадир добавил фото к отчёту (по желанию).'); },
  close(){
    if (!(P.report||'').trim()){ logEv('Отчёт пустой — смену не закрыть.'); return; }
    if (!P.net){ logEv('Нет связи — смена не закрыта, отчёт остаётся в телефоне.'); return; }
    const open = P.shift.marks.filter(x=>!x.out && !x.miss);
    // идущая пауза кончается закрытием смены; часов у «без конца работы» всё равно нет
    open.forEach(x=>{ const pz = pauseNow(x); if (pz) pz[2] = hhmm(P.clock); x.miss = true; });
    const info = {today:true, date:TODAY, obj:objName(P.shift.obj), from:P.shift.opened, to:hhmm(P.clock), report:P.report, photos:P.photos, marks:P.shift.marks, miss:open.length};
    const how = P.voice==='ai' ? 'исправленный AI' : P.voice==='raw' ? 'надиктованный, как есть' : 'набранный руками';
    logEv(`Отчёт ушёл ${how}.`);
    P.past.unshift(info); P.closedInfo = info; P.shift = null; P.voice = null; go('closed');
    logEv(`Смена закрыта${open.length?` без конца работы у ${open.length} чел. (${open.map(x=>x.n).join(', ')}) — у них «конец работы не отмечен»`:''}. Отчёт ушёл руководителю.`);
  },
  tab(arg){
    if (arg==='past'){ P.jump = P.screen==='pastday' ? 'list' : null; if (!P.jump) P.listTop = 0; go('past'); return; }
    go(home());
  },
  back(arg){
    if (arg==='shift') return ACT.toshift();
    if (arg==='past') P.jump = 'list';   // «Назад» из смены — к списку на то же место (уточнение Oleg 22.11)
    go(arg==='home' ? home() : arg);
  },
  /* Строка списка «Прошлых» → смена на весь экран; соседние — свайпом в ленте. Место в списке запоминаем. */
  pastday(i){
    const b = document.querySelector('.proto .phone .body'); P.listTop = b ? b.scrollTop : 0;
    P.pastIdx = +i; P.jump = 'feed'; go('pastday');
    logEv(`Бригадир открыл прошлую смену ${P.past[+i].date} на весь экран; соседние — свайпом вверх-вниз.`);
  },
  menu(){ P.sheet = 'menu'; },
  lang(l){ S.lang = l; P.sheet = null; syncUrl(); render(); },
  lcpick(){ go('lcpick'); },
  /* карточка человека, как в login-qr.html (TG-443): одна кнопка «Выдать доступ»; заблокированному доступ не выдать */
  lccard(id){
    const p = TEAM.find(x=>x.id===+id);
    if (p.blocked){ logEv(`${full(p)} заблокирован — выдать доступ нельзя (движок откажет). Разблокировать может владелец.`); return; }
    P.lcFor = p.id; go('lccard');
    logEv(`Карточка ${full(p)}: «Выдать доступ»${p.phone==='on' ? ' — доступ уже был, подпись предупреждает про старый телефон' : ''}.`);
  },
  lcinv(id){ P.lcFor = +id; P.lcInv = tok(10); go('lcinv'); logEv(`«Выдать доступ» для ${full(TEAM.find(x=>x.id===+id))}, шаг 1 из 2: QR, который ставит приложение. Значок уже есть — «Приложение уже есть — дальше».`); },
  /* как showCode в login-qr.html (TG-443): «Выдать доступ»; заблокированному код не выпускается; «Новый код» гасит прежний */
  lcode(id){
    const p = TEAM.find(x=>x.id===+id);
    if (p.blocked){ logEv(`${full(p)} заблокирован — выдать доступ нельзя (движок откажет). Разблокировать может владелец.`); return; }
    P.lcFor = p.id; P.lc = {forId:p.id, digits:six(), tok:tok(16), left:CODE_TTL, used:false}; go('lcode');
    logEv(`Бригадир показал QR для входа для ${full(p)}: живёт ${CODE_TTL/60} мин, срабатывает один раз (движок: выдать код входа — новая точка, TG-443).`);
  },
  logout(){ go('login'); logEv('Бригадир вышел. Открытая смена остаётся открытой на сервере.'); },

  /* голос: запись → надиктовано → (AI поправил ⇄ как было) */
  vrec(){ if (P.voice==null) P.beforeVoice = P.report||''; P.voice='rec'; logEv('Бригадир нажал «Надиктовать» — телефон слушает и превращает речь в текст.'); },
  /* «Надиктовать заново»: надиктованное (и его правка AI) уходит, набранное руками до диктовки остаётся */
  vredo(){ P.report = P.beforeVoice||''; P.voice='rec'; logEv('Бригадир нажал «Надиктовать заново» — прежняя диктовка убрана, телефон слушает снова.'); },
  vstop(){
    const had = (P.beforeVoice||'').trim();
    P.voice='raw'; P.report = had ? had + ' ' + VOICE_RAW : VOICE_RAW;
    logEv('Распознано: текст '+(had ? 'дописан к набранному' : 'в поле')+' как есть — без знаков и цифр. Можно отправить так или поправить с AI.');
  },
  vfix(){
    if (P.aiOff){ logEv('AI недоступен — остаётся отправить как есть.'); return; }
    P.beforeAi = P.report; P.voice='ai'; P.report = VOICE_AI; logEv('AI поправил отчёт: знаки, цифры, опечатки (движок: AI-задача «поправить текст»).');
  },
  vundo(){ P.voice='raw'; P.report = P.beforeAi ?? VOICE_RAW; logEv('Бригадир вернул текст, каким он был до AI.'); },

  /* остальной мир */
  /* Главный путь: рабочий подходит и показывает код. Смена открыта, а камеры нет — бригадир открывает её (пульт делает это
     за него); камера стоит после прошлого скана — код не читается, пока бригадир не нажмёт «Сканировать следующего». */
  come(i){
    P.worker = +i;
    if (!P.shift){ logEv(`${WORKERS[P.worker]} показывает код, но смены нет: без чекина на объекте сканировать нельзя. Начните смену.`); return; }
    if (P.screen!=='scan'){ go('scan'); logEv('Бригадир открыл камеру в приложении.'); }
    if (P.reg || P.res){ logEv(`${WORKERS[P.worker]} показывает код, но камера остановлена — бригадир сначала ${P.reg?'подтвердит или отменит прочитанный':'нажмёт «Сканировать следующего»'}. Второй скан сам не пройдёт.`); return; }
    // Рабочий нажал у себя кнопку по делу: не на объекте — «Начать работу», на объекте — «Закончить работу»
    const name = WORKERS[P.worker], on = P.shift.marks.some(x=>x.n===name && !x.out && !x.miss);
    readCode(on ? 'out' : 'in', name);
  },
  /* Конец дня одной кнопкой: 17:00, все четверо пришли, двое ушли со сканом, двое уехали без скана ухода — экран закрытия. */
  endday(){
    if (!P.shift){ logEv('Смены нет — закрывать нечего. Начните смену.'); return; }
    P.clock = Math.max(P.clock, 17*3600);
    WORKERS.forEach((n,i)=>{ if (!P.shift.marks.some(x=>x.n===n)) P.shift.marks.push({n, in:hhmm(8*3600+i*120), inSec:0}); });
    // за день кто-то сходил на перекур и обед — в итоге смены видны паузы по людям
    P.shift.marks.forEach((x,i)=>{ if (!x.p) x.p = i%2 ? [['lunch', hhmm(12*3600+i*300), hhmm(12*3600+i*300+31*60)]]
      : [['smoke', hhmm(10*3600+i*240), hhmm(10*3600+i*240+8*60)], ['lunch', hhmm(12*3600+30*60), hhmm(13*3600+5*60)]]; });
    P.shift.marks.forEach(x=>{ const pz = pauseNow(x); if (pz) pz[2] = hhmm(P.clock - 6*60); });
    const open = P.shift.marks.filter(x=>!x.out && !x.miss);
    open.slice(0, Math.max(0, open.length-2)).forEach(x=>{ x.out = hhmm(P.clock - 5*60); });
    const left = P.shift.marks.filter(x=>!x.out && !x.miss).map(x=>x.n);
    go('close');
    logEv(`Конец дня, ${hhmm(P.clock)}. Без скана ухода уехали: ${left.join(', ')}. Экран закрытия смены.`);
  },
  /* Паузы (TG-457): рабочий нажимает «Перекур», «Обед» или «Вернулся» у себя в «Мой код» — бригадир ничего не нажимает,
     на его экране смены пауза видна сама (в жизни — отметка паузы в движке, экран смены её читает). */
  brk(kind){
    const name = WORKERS[P.worker], x = P.shift && P.shift.marks.find(m=>m.n===name && !m.out && !m.miss);
    if (!x){ logEv(`${name} не на объекте — паузу отмечает только тот, у кого есть начало работы.`); return; }
    if (pauseNow(x)){ logEv(`${name} уже на паузе — сначала «Вернулся».`); return; }
    (x.p = x.p||[]).push([kind, hhmm(P.clock), null]);
    if (!['shift','scan'].includes(P.screen) && P.shift) go('shift');
    logEv(`${name} нажал у себя «${kind==='lunch'?'Обед':'Перекур'}» — у бригадира на смене строка «Сейчас на паузе» (срок ${BREAK_MIN[kind]} мин по «Настройкам»).`);
  },
  brkback(){
    const name = WORKERS[P.worker], x = P.shift && P.shift.marks.find(m=>m.n===name && pauseNow(m));
    if (!x){ logEv(`${name} не на паузе.`); return; }
    const pz = pauseNow(x); pz[2] = hhmm(P.clock);
    logEv(`${name} нажал «Вернулся»: ${pz[0]==='lunch'?'обед':'перекур'} ${pMin(pz, Math.floor(P.clock/60))} мин. В часы не входит.`);
  },
  min10(){ P.clock += 600; logEv('Прошло 10 минут.'); },
  aioff(){ P.aiOff = !P.aiOff; if (P.aiOff && P.voice==='ai'){ P.voice='raw'; P.report = P.beforeAi ?? VOICE_RAW; } logEv(P.aiOff ? 'AI платформы недоступен (аварийный режим): кнопки «Поправить с AI» нет.' : 'AI снова доступен.'); },
  show(kind){
    const name = WORKERS[P.worker];
    if (P.shift && P.screen!=='scan'){ go('scan'); logEv('Бригадир открыл камеру в приложении.'); }
    if (P.screen!=='scan'){ logEv(`${name} показывает код, но у бригадира не открыт сканер${P.shift?'':' — и смены нет: без чекина на объекте сканировать нельзя'}.`); return; }
    if (P.reg || P.res){ logEv(`${name} показывает код, но камера остановлена — сначала «Подтвердить» или «Сканировать следующего».`); return; }
    if (!P.net){ scanRes('offline', name); logEv('Камера прочитала код, но у бригадира нет сети — проверяет сервер, отметки нет.'); return; }
    if (P.failNext){ P.failNext=false; scanRes('error', name); logEv('Движок ответил 503 на код.'); return; }
    if (kind==='expired'){ scanRes('expired', name); logEv(`${name}: просроченный код — 409 pass_expired.`); return; }
    if (kind==='used'){ scanRes('used', name); logEv(`${name}: уже погашенный код — 409 pass_already_used.`); return; }
    if (kind==='unknown'){ scanRes('unknown', ''); logEv('Камера прочитала чужой QR — 409 pass_unknown.'); return; }
    // Рабочий на объекте и снова показывает код на начало работы (нажал не ту кнопку или после перезапуска)
    if (kind==='again'){
      // не на объекте — считаем, что пришёл к открытию смены: пульт показывает именно повторный код на начало работы
      if (!P.shift.marks.some(x=>x.n===name && !x.out && !x.miss)){ P.shift.marks.push({n:name, in:P.shift.opened, inSec:P.clock-600}); }
      readCode('in', name); return;
    }
    // Пришёл три минуты назад и уже показывает код на конец работы — ранний уход
    if (kind==='short'){
      const open = P.shift.marks.find(x=>x.n===name && !x.out && !x.miss);
      if (open){ open.inSec = P.clock - 180; open.in = hhmm(P.clock - 180); }
      else P.shift.marks.push({n:name, in:hhmm(P.clock-180), inSec:P.clock-180});
      readCode('out', name); return;
    }
  },
  signedin(){
    if (P.screen!=='lcode' || !P.lc || P.lc.used || P.lc.left<=0){ logEv('Живого кода для входа на экране бригадира нет — входить нечем.'); return; }
    P.lc.used = true; const p = TEAM.find(x=>x.id===P.lc.forId); p.phone = 'on'; p.last = {d:0, t:hhmm(P.clock)};
    logEv(`${full(p)} вошёл по коду в своём значке — телефон привязан, этим кодом больше не войти.`);
  },
  net(){ P.net = !P.net; logEv(P.net ? 'Связь у бригадира вернулась.' : 'Связь у бригадира пропала.'); },
  hour(){ P.clock += 3600; logEv('Прошёл час.'); },
  fail(){ P.failNext = true; logEv('Сервер сломался: следующий запрос получит 503.'); },
  reset(){ resetProto(); },
  drawer(){ P.drawer = !P.drawer; renderPult(); },
};
function protoModel(){ return {...P, id:P.screen}; }

function screenHtml(){
  if (S.view==='proto') return `<div class="proto">${STANDALONE ? phone(protoModel(), nativeSize(), true) : phone(protoModel(), S.size)}</div>`;
  const main = STATES.find(s=>s.id==='shift');
  const sizes = Object.keys(DEV).map(k=>`<figure class="cell">${phone(main, k)}
      <figcaption><b>${t('dev.'+k)}</b><code>foreman · shift · ${DEV[k].w}×${DEV[k].h}</code></figcaption></figure>`).join('');
  const states = STATES.map(s=>`<figure class="cell" id="cell-${s.id}">${phone(s, S.size)}
      <figcaption><b>${t('c.'+s.id)}</b>${t('c.'+s.id+'.d')}${['noshift','pick','confirm','close0','close','voice-raw','voice-ai','voice-aioff','summary','summary-ok','closed'].includes(s.id)?`<br><span class="dec">${t('dec')}</span>`:''}<br><code>foreman · ${s.id} · ${DEV[S.size].w}×${DEV[S.size].h}</code></figcaption></figure>`).join('');
  return `<h3 class="sec">${t('sec.sizes')}</h3><div class="sizes">${sizes}</div>
    <h3 class="sec">${t('sec.states',{size:DEV[S.size].w+'×'+DEV[S.size].h})}</h3><div class="board">${states}</div>`;
}
function renderScreens(){
  // Часы перерисовывают экран раз в секунду — прокрутку того же экрана сохраняем, иначе список прыгает наверх.
  const was = document.querySelector('.proto .phone'), keep = was && was.dataset.state === P.screen ? was.querySelector('.body').scrollTop : 0;
  document.getElementById('screens').innerHTML = screenHtml();
  if (keep){ const b = document.querySelector('.proto .phone .body'); if (b) b.scrollTop = keep; }
  // Переход «список ↔ смена на весь экран»: лента открывается на выбранной смене, список — на прежнем месте
  if (P.jump && S.view==='proto'){
    const b = document.querySelector('.proto .phone .body');
    if (b && P.jump==='feed'){ const s = b.querySelectorAll('.slide'); if (s[P.pastIdx]) b.scrollTop = s[P.pastIdx].offsetTop - s[0].offsetTop; }
    if (b && P.jump==='list') b.scrollTop = P.listTop || 0;
    P.jump = null;
  }
  // Лента «Прошлых» на доске состояний — пролистана до своей смены (data-idx)
  document.querySelectorAll('.board .body.feed, .sizes .body.feed').forEach(b=>{ const s = b.querySelectorAll('.slide'); const i = +b.dataset.idx||0; if (s[i]) b.scrollTop = s[i].offsetTop - s[0].offsetTop; });
  if (DEBUG) document.querySelectorAll('.phone .body:not(.scroll)').forEach(b=>{ if (b.scrollHeight > b.clientHeight + 1) b.closest('.phone').classList.add('overflow'); });
  if (DEBUG) measure();
}
/* ?debug — замер окна поверх экрана, как в my-code.html. */
function measure(){
  let box = document.getElementById('measure');
  if (!box){ box = document.createElement('pre'); box.id = 'measure';
    box.style.cssText = 'position:fixed;z-index:30;left:8px;top:45%;margin:0;padding:6px 8px;font:11px/1.35 monospace;background:rgba(255,255,255,.92);color:#000;border:1px solid red;pointer-events:none';
    document.body.appendChild(box); }
  const probe = document.createElement('div');
  probe.style.cssText = 'position:fixed;padding-bottom:env(safe-area-inset-bottom, 0px);padding-top:env(safe-area-inset-top, 0px)';
  document.body.appendChild(probe);
  const cs = getComputedStyle(probe), rect = sel => { const el = document.querySelector(sel); return el ? Math.round(el.getBoundingClientRect().bottom) : '—'; };
  box.textContent = [
    `screen ${screen.width}×${screen.height}`, `inner ${innerWidth}×${innerHeight}`,
    `visual ${Math.round(visualViewport?.height ?? 0)}`, `html ${document.documentElement.clientHeight}`,
    `safe top ${cs.paddingTop} bottom ${cs.paddingBottom}`,
    `phone.bottom ${rect('.phone')}  tabs.bottom ${rect('.tabs')}`,
    `standalone ${matchMedia('(display-mode: standalone)').matches} nav ${navigator.standalone}`,
  ].join('\n');
  probe.remove();
}
if (DEBUG){ addEventListener('resize', measure); setTimeout(measure, 1000); }
function render(){
  document.documentElement.lang = S.lang;
  document.querySelectorAll('[data-t]').forEach(el=>el.innerHTML=t(el.dataset.t));
  document.querySelectorAll('#seg-lang button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.v===S.lang));
  document.querySelectorAll('#seg-view button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.v===S.view));
  document.querySelectorAll('#seg-size button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.v===S.size));
  document.body.dataset.view = S.view;
  renderScreens();
  renderPult();
  document.getElementById('notes').innerHTML = NOTES;
}

/* Часы сервера идут; экран отчёта не перерисовывается (там идёт набор текста) — меняется только время в строке состояния. */
setInterval(()=>{
  if (S.view!=='proto') return;
  P.clock++;
  // как в login-qr.html: истёкший код сам не меняется — «Код истёк» и кнопка «Новый код»
  if (P.lc && !P.lc.used && P.lc.left>0){ P.lc.left--; if (P.lc.left===0) logEv('Срок кода для входа вышел. Бригадир может нажать «Новый код».'); }
  // отчёт (идёт набор), список и лента «Прошлых» (прокрутка, свайп, нажатие) не перерисовываются — меняется только время
  if (['close','past','pastday'].includes(P.screen)){ const sb=document.querySelector('.proto .sb span'); if (sb) sb.textContent=hhmm(P.clock); return; }
  renderScreens();
}, 1000);

const BTN = [
  ['endday',  '🌇 Конец дня: двое ушли без скана'],
  ['show',    '🔁 Снова код на начало работы (уже на объекте)', 'again'],
  ['show',    '⏱ Конец работы через 3 минуты после начала', 'short'],
  ['show',    '⌛ Просроченный код', 'expired'],
  ['show',    '♻ Уже использованный код', 'used'],
  ['show',    '❓ Чужой QR (не пропуск)', 'unknown'],
  ['signedin','🔑 Человек вошёл по коду для входа'],
  ['aioff',   null],
  ['net',     null],
  ['hour',    '⏩ Время дня +1 час'],
  ['fail',    '💥 Ошибка сервера'],
  ['reset',   '↺ Начать сначала'],
];
function renderPult(){
  const el = document.getElementById('pult'); if (!el) return;
  if (S.view!=='proto'){ el.hidden = true; return; }
  el.hidden = false;
  el.className = 'pult' + (P.drawer ? ' open' : '');
  el.innerHTML = `<button class="handle" data-act="drawer">Пульт — остальной мир ${P.drawer?'▼':'▲'}</button>
    <div class="pin">
      <b class="ptitle">Пульт — остальной мир</b>
      <p class="how">Войдите и начните смену на объекте. Дальше рабочие подходят по одному: кнопка с именем — человек нажал у себя «Начать работу» (или «Закончить работу», если он на объекте) и показывает код. Камера читает один код и останавливается: бригадир видит, кто и что, и жмёт «Подтвердить»; следующего — кнопкой «Сканировать следующего». Пока камера стоит, второй код не читается.</p>
      <p class="who-l">Подходит и показывает код:</p>
      <div class="acts come">${WORKERS.map((w,i)=>`<button data-act="come" data-arg="${i}" class="main">📱 ${esc(w)}</button>`).join('')}</div>
      <p class="who-l" style="margin-top:12px">Паузу отмечает сам рабочий у себя в «Мой код» — тот, кто подходил последним (${esc(WORKERS[P.worker])}):</p>
      <div class="acts"><button data-act="brk" data-arg="smoke">☕ Перекур</button><button data-act="brk" data-arg="lunch">🍽 Обед</button>
        <button data-act="brkback">↩ Вернулся</button><button data-act="min10">⏩ +10 минут</button></div>
      <p class="who-l" style="margin-top:12px">Код с ошибкой — у того, кто подходил последним (${esc(WORKERS[P.worker])}):</p>
      <div class="acts">${BTN.map(([a,l,arg])=>`<button data-act="${a}" ${arg?`data-arg="${arg}"`:''}>${a==='net' ? (P.net?'📵 Связь пропала':'📶 Связь вернулась') : a==='aioff' ? (P.aiOff?'🤖 AI снова доступен':'🤖 AI недоступен') : l}</button>`).join('')}</div>
      <div class="pctl">${ctlHtml()}</div>
      <div class="log"><b>Что произошло</b>${P.log.map(e=>`<div><time>${e.at}</time>${e.text}</div>`).join('')}</div>
    </div>`;
}
function ctlHtml(){
  const seg = (id, items, cur) => `<span class="seg" data-seg="${id}">${items.map(([v,l])=>`<button data-v="${v}" aria-pressed="${v===cur}">${l}</button>`).join('')}</span>`;
  if (STANDALONE) return seg('lang', [['hu','hu'],['ru','ru'],['en','en']], S.lang);
  return seg('lang', [['hu','hu'],['ru','ru'],['en','en']], S.lang) + seg('size', [['s','360'],['m','390'],['l','430']], S.size)
    + seg('view', [['proto',t('ctl.one')],['all',t('ctl.all')]], S.view);
}

function syncUrl(){ history.replaceState(null,'','?'+new URLSearchParams({lang:S.lang, view:S.view, size:S.size})); }
function setOpt(kind, v){ S[kind]=v; syncUrl(); render(); }
document.addEventListener('click', e=>{
  const a = e.target.closest('[data-act]');
  if (a && !a.disabled && ACT[a.dataset.act]){
    // доска состояний — только для обзора: нажатия внутри неё не двигают прототип
    if (a.closest('.board, .sizes')) return;
    const pultAct = !!a.closest('.pult');
    if (pultAct && a.dataset.act!=='drawer' && (STANDALONE || matchMedia('(max-width:460px)').matches)) P.drawer = false;
    ACT[a.dataset.act](a.dataset.arg); renderScreens(); renderPult(); return;
  }
  const b = e.target.closest('[data-seg] button, #seg-lang button, #seg-view button, #seg-size button');
  if (b){ const kind = b.parentElement.dataset.seg || b.parentElement.id.replace('seg-',''); setOpt(kind, b.dataset.v); }
});
/* Текст отчёта — без перерисовки экрана (иначе пропадёт курсор): включаем кнопку закрытия на месте. */
document.addEventListener('input', e=>{
  if (e.target.dataset.in!=='report' || e.target.closest('.board, .sizes')) return;
  P.report = e.target.value;
  const filled = P.report.trim().length > 0;
  const f = document.getElementById('rep-field'); if (f) f.classList.toggle('need', !filled);
  const btn = document.getElementById('close-btn'); if (btn) btn.disabled = !filled || !P.net;
});

/* ══ ЛЕНТА «ПРОШЛЫХ» (TG-454) ══
   Свайп — родная прокрутка с прилипанием (scroll-snap). Здесь: точки «где вы» по прокрутке, а на компьютере —
   колесо мыши и стрелки ↑/↓ листают по одной смене. Длинная смена (не влезла в экран) сначала докручивается сама. */
const feedBody = () => S.view==='proto' && P.screen==='pastday' ? document.querySelector('.proto .body.feed') : null;
function feedIdx(b){
  const s = [...b.querySelectorAll('.slide')], top = b.scrollTop + s[0].offsetTop;
  let i = 0; s.forEach((el,k)=>{ if (el.offsetTop - b.clientHeight/2 <= top) i = k; });
  return i;
}
function feedGo(b, dir){
  const s = b.querySelectorAll('.slide'), i = Math.max(0, Math.min(s.length-1, feedIdx(b)+dir));
  b.scrollTo({top: s[i].offsetTop - s[0].offsetTop, behavior:'smooth'});
}
/* Можно ли листать дальше, или текущая длинная смена ещё не докручена в эту сторону. */
function feedEdge(b, dir){
  const cur = b.querySelectorAll('.slide')[feedIdx(b)], r = cur.getBoundingClientRect(), v = b.getBoundingClientRect();
  return dir > 0 ? r.bottom <= v.bottom + 2 : r.top >= v.top - 2;
}
document.addEventListener('scroll', e=>{
  const b = feedBody(); if (!b || e.target !== b) return;
  const i = feedIdx(b); if (i === P.pastIdx) return;
  P.pastIdx = i;
  const dots = b.parentElement.querySelector('.feeddots');
  if (dots) dots.outerHTML = feedDots(b.querySelectorAll('.slide').length, i);
}, true);
let feedLock = 0;
document.addEventListener('wheel', e=>{
  const b = feedBody(); if (!b || !b.contains(e.target) || Math.abs(e.deltaY) < 4) return;
  const dir = e.deltaY > 0 ? 1 : -1;
  if (!feedEdge(b, dir)) return;          // длинную смену докручивает родная прокрутка
  e.preventDefault();
  if (Date.now() < feedLock) return;      // один жест колеса или тачпада — одна смена
  feedLock = Date.now() + 600; feedGo(b, dir);
}, {passive:false});
document.addEventListener('keydown', e=>{
  const b = feedBody(); if (!b || !['ArrowDown','ArrowUp','PageDown','PageUp'].includes(e.key)) return;
  const dir = e.key==='ArrowDown' || e.key==='PageDown' ? 1 : -1;
  if (!feedEdge(b, dir)) return;
  e.preventDefault(); feedGo(b, dir);
});
resetProto();
render();
/* Как у «Мой код»: оболочка в кэше, открывается и без сети (sw.js рядом). */
if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
