<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LD Kód — «Мой код» · LD Vill</title>
<meta name="theme-color" content="#213946">
<!-- Ставится на телефон как приложение (PWA): на iPhone — «Поделиться → На экран „Домой“», на Android — «Установить». -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="LD Kód">
<link rel="manifest" href="my-code.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<!--
  Чистовой макет одного экрана мобильного приложения LD Vill — «Мой код» рабочего (TG-411).
  По нему пишется первый настоящий экран приложения. Черновик всех экранов — index.html рядом.

  Что здесь:
    · живой прототип (вид по умолчанию): вход, «Мой код» с настоящим отсчётом минуты; пульт играет
      остальной мир — бригадир сканирует, связь пропала и вернулась, перемотка к концу минуты, ошибка
      сервера, перезапуск приложения; журнал пульта говорит, что произошло и какую точку движка звал экран.
      На телефоне пульт — выдвижная панель снизу;
    · доска всех состояний для обзора на компьютере (вид «все состояния»);
    · три размера экрана: узкий Android 360×640, iPhone 390×844, большой iPhone 430×932; тексты hu / ru / en;
    · блок «Данные экрана»: какое поле откуда берётся у движка (PR движка #601, задача TG-408).
  Адрес принимает ?lang=hu|ru|en&view=proto|all&size=s|m|l — для ссылок и снимков;
  ?debug красит рамку телефона, где содержимое не влезло без прокрутки.

  Палитра и шрифт — ldvill.com: лаймовый #C7FF00 и графит #343A42 сверены с логотипом и иконками
  сайта 17.11.2026; остальные токены — из чернового макета (index.html). Прямые углы — бренд.
  Данные выдуманы, сервера нет.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<style>
  /* ══ ТОКЕНЫ LD VILL — кандидаты в brand/tokens.json ══ */
  :root{
    --c-dark:#213946;      /* шапка, нижняя панель */
    --c-ink:#343A42;       /* основной текст (графит с ldvill.com) */
    --c-muted:#6B7680;     /* вторичный текст */
    --c-line:#E2E7E9;      /* рамки */
    --c-surface:#FFFFFF;   /* карточки */
    --c-ground:#F5F7F7;    /* фон экрана */
    --c-lime:#C7FF00;      /* акцент: активная вкладка, полоса срока (лайм с ldvill.com) */
    --c-lime-ink:#7FA300;  /* акцент на светлом фоне */
    --c-warn:#E8A100;      --c-warn-bg:#FFF6DD; --c-warn-ink:#7A5400;
    --c-bad:#D64545;       --c-bad-bg:#FDECEC;
    --c-ok:#2E9E5B;        --c-ok-bg:#E7F6EE;
    --font:"Plus Jakarta Sans","Segoe UI",Arial,sans-serif;
    --radius:2px;          /* бренд — прямые углы */
    /* размеры телефона */
    --ph-w:390px; --ph-h:844px; --safe-top:47px; --safe-bottom:34px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:#E9EEF0;color:var(--c-ink);font-family:var(--font);-webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit;cursor:pointer}

  /* ══ ПУЛЬТ МАКЕТА (не часть экрана) ══ */
  .deck{max-width:1440px;margin:0 auto;padding:20px 20px 40px}
  .deck h1{font-size:22px;margin:0 0 4px;font-weight:800}
  .deck .sub{color:var(--c-muted);margin:0 0 16px;font-size:14px}
  .controls{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;margin-bottom:20px}
  .seg{display:inline-flex;border:1px solid #C9D2D6;background:#fff}
  .seg button{border:0;background:none;padding:7px 12px;font-size:13px;font-weight:600}
  .seg button[aria-pressed="true"]{background:var(--c-dark);color:#fff}
  .ctl-l{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--c-muted);margin-right:6px;font-family:ui-monospace,Menlo,monospace}
  select{font:inherit;font-size:13px;padding:6px 8px;border:1px solid #C9D2D6;background:#fff;border-radius:0}

  .stage{display:flex;flex-direction:column;gap:36px}
  .board{display:grid;grid-template-columns:repeat(auto-fill,minmax(440px,1fr));gap:28px 24px;justify-items:center}
  .sizes{display:flex;flex-wrap:wrap;gap:28px 40px;align-items:flex-end;margin-bottom:12px}
  .sec{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--c-muted);font-family:ui-monospace,Menlo,monospace;margin:8px 0 20px}
  .cell figcaption{margin-top:8px;font-size:13px;max-width:var(--ph-w)}
  .cell figcaption b{display:block;font-size:14px}
  .cell figcaption code{font-size:11px;color:var(--c-muted)}
  figure{margin:0}

  .notes{max-width:860px;background:#fff;border:1px solid var(--c-line);padding:18px 20px;font-size:14px;line-height:1.5}
  .notes h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--c-muted);margin:18px 0 6px;font-family:ui-monospace,Menlo,monospace}
  .notes h2:first-child{margin-top:0}
  .notes table{border-collapse:collapse;width:100%;font-size:13px}
  .notes td,.notes th{border-top:1px solid var(--c-line);padding:5px 6px 5px 0;vertical-align:top;text-align:left}
  .notes code{font-size:12px;background:var(--c-ground);padding:0 3px}
  .tag{display:inline-block;font-size:10px;font-weight:700;padding:1px 5px;letter-spacing:.04em;text-transform:uppercase}
  .tag.have{background:var(--c-ok-bg);color:var(--c-ok)}
  .tag.ask{background:var(--c-warn-bg);color:var(--c-warn-ink)}
  .tag.cli{background:var(--c-ground);color:var(--c-muted)}

  /* ══ ТЕЛЕФОН ══ */
  .phone{width:var(--ph-w);height:var(--ph-h);background:var(--c-ground);position:relative;overflow:hidden;
    outline:10px solid #11181C;border-radius:44px;box-shadow:0 18px 40px rgba(0,0,0,.18);display:flex;flex-direction:column}
  .top{flex:none}
  .sb{height:var(--safe-top);background:var(--c-dark);color:#fff;display:flex;align-items:flex-end;justify-content:space-between;padding:0 30px 8px;font-size:15px;font-weight:600;flex:none}
  .sb .net{font-size:12px;letter-spacing:.05em}
  .appbar{background:var(--c-dark);color:#fff;padding:10px 20px 16px;flex:none}
  .appbar .row{display:flex;align-items:center;gap:12px}
  .logo{width:34px;height:34px;background:var(--c-lime);color:var(--c-dark);display:grid;place-items:center;font-weight:800;font-size:14px;letter-spacing:-.02em}
  .who{line-height:1.2}
  .who b{display:block;font-size:15px}
  .who span{font-size:12px;color:#B9C6CD}
  .appbar h2{margin:14px 0 0;font-size:26px;font-weight:800;letter-spacing:-.01em}

  .body{flex:1;overflow:hidden;padding:16px 20px;display:flex;flex-direction:column;gap:14px}
  .tabs{flex:none;display:flex;background:var(--c-dark);padding-bottom:var(--safe-bottom)}
  /* неактивная вкладка читается (замечание Oleg 24.11: «Прошлые» на тёмном почти не видно), активная — белая с лаймом */
  .tabs span{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0 6px;font-size:12px;font-weight:600;color:#C9D5DB;border-top:3px solid transparent;cursor:pointer}
  .tabs span.on{color:#fff;border-top-color:var(--c-lime)}

  /* таймер работы и паузы (Oleg 24.11) */
  .timer{background:var(--c-surface);border:1px solid var(--c-line);padding:12px 14px;display:flex;flex-direction:column;gap:2px}
  .timer .l{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--c-muted)}
  .timer .v{font-size:34px;font-weight:800;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums}
  .timer .s{font-size:13px;color:var(--c-muted)}
  .timer.pause{background:var(--c-warn-bg);border-color:#F1D58A;border-left:4px solid var(--c-warn)}
  .timer.pause .l,.timer.pause .s{color:var(--c-warn-ink)}
  .timer.pause .over{color:var(--c-bad);font-weight:700}
  .compact .timer{padding:8px 12px} .compact .timer .v{font-size:27px}
  .brk{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .brk .btn{margin:0;padding:12px;font-size:15px;background:#fff;color:var(--c-ink);border:1px solid #C9D2D6;display:flex;align-items:center;justify-content:center;gap:8px}
  .brk .btn svg{width:20px;height:20px}
  .btn.back{background:var(--c-warn);color:#1F1600}
  .done .obj{font-size:15px;font-weight:700}
  .done .day{margin-top:14px;background:#fff;border:1px solid #BFE5CF;padding:10px 14px;font-size:14px;line-height:1.45}
  .done .day b{font-size:22px;display:block}

  /* «Мои смены» рабочего */
  .body.scroll{overflow:auto}
  .tot{display:grid;grid-template-columns:1fr 1fr;gap:10px;flex:none}
  .tot div{background:var(--c-dark);color:#fff;padding:10px 12px}
  .tot span{display:block;font-size:12px;color:#C9D5DB}
  .tot b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
  .tot small{font-size:12px;color:#C9D5DB}
  .sh{background:#fff;border:1px solid var(--c-line);padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:13px;flex:none}
  .sh .d{font-weight:800;font-size:15px}
  .sh .h{grid-row:1/3;grid-column:2;text-align:right;font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
  .sh .h small{display:block;font-size:11px;font-weight:600;color:var(--c-muted)}
  .sh .o,.sh .m{color:var(--c-muted)}
  .sh .m{grid-column:1/-1}
  .chip{display:inline-block;font-size:11px;font-weight:700;padding:1px 6px;margin-left:4px}
  .chip.late{background:var(--c-warn-bg);color:var(--c-warn-ink)} .chip.ok{background:var(--c-ok-bg);color:var(--c-ok)}
  .chip.miss{background:var(--c-bad-bg);color:var(--c-bad)}
  .grp{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--c-muted);margin:4px 0 -6px;flex:none}

  /* Пульт имитации прямо в экране (Oleg 24.11: с телефона не нашёл, как «бригадир отсканировал»): пунктирная лаймовая
     полоса под шапкой, кнопки — по тому, что сейчас на экране. Это не часть приложения. */
  .sim{flex:none;display:flex;gap:6px;align-items:center;padding:6px 10px;background:#11181C;border-bottom:2px dashed var(--c-lime);overflow-x:auto}
  .sim > i{font-style:normal;font-size:10px;font-weight:800;letter-spacing:.08em;color:var(--c-lime);font-family:ui-monospace,Menlo,monospace;flex:none}
  .sim button{flex:none;border:1px solid var(--c-lime);background:transparent;color:#fff;font-size:13px;font-weight:700;padding:7px 10px;white-space:nowrap}
  .sim button.go{background:var(--c-lime);color:var(--c-dark)}
  .tabs svg{width:22px;height:22px}

  .state{display:flex;gap:12px;align-items:flex-start;background:var(--c-surface);border:1px solid var(--c-line);padding:12px 14px}
  .state svg{flex:none;width:22px;height:22px;margin-top:1px}
  .state b{display:block;font-size:15px}
  .state span{font-size:13px;color:var(--c-muted)}
  .state.on{border-left:4px solid var(--c-ok)} .state.on svg{color:var(--c-ok)}
  .state.off svg{color:var(--c-muted)}

  .banner{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;font-size:13px;line-height:1.35}
  .banner svg{flex:none;width:20px;height:20px}
  .banner.warn{background:var(--c-warn-bg);color:var(--c-warn-ink);border-left:4px solid var(--c-warn)}
  .banner b{display:block;font-size:14px}

  .qrbox{background:#fff;border:1px solid var(--c-line);padding:18px 18px 14px;display:flex;flex-direction:column;align-items:center;gap:12px}
  .qr{width:var(--qr);height:var(--qr);position:relative;display:grid;place-items:center}
  .qr svg{width:var(--qr);height:var(--qr);display:block}
  .qr .fallback{width:var(--qr);height:var(--qr);display:grid;place-items:center;background:repeating-conic-gradient(#343A42 0 25%,#fff 0 50%) 0 0/24px 24px;opacity:.85}
  .qr .veil{position:absolute;inset:0;background:rgba(255,255,255,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;font-weight:700;padding:0 18px}
  .qr .veil.bad{color:var(--c-bad)}
  .qr .veil svg{width:40px;height:40px}
  .qr .veil small{font-weight:500;color:var(--c-muted);font-size:13px}
  .spin{width:28px;height:28px;border:3px solid var(--c-line);border-top-color:var(--c-dark);border-radius:50%;animation:sp 0.9s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .ttl{width:100%;height:6px;background:var(--c-line)}
  .ttl i{display:block;height:100%;background:var(--c-lime-ink);transition:width .9s linear}
  .ttl.low i{background:var(--c-warn)}
  .count{font-size:14px;color:var(--c-muted);font-variant-numeric:tabular-nums}
  .count b{color:var(--c-ink)}
  .hint{margin:0;text-align:center;font-size:13px;color:var(--c-muted)}

  .done{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;background:var(--c-ok-bg);border:1px solid #BFE5CF}
  .done .big{width:84px;height:84px;border-radius:50%;background:var(--c-ok);color:#fff;display:grid;place-items:center;margin-bottom:10px}
  .done .big svg{width:46px;height:46px}
  .done .what{font-size:16px;font-weight:700;color:var(--c-ok)}
  .done .time{font-size:56px;font-weight:800;letter-spacing:-.02em;line-height:1}
  .done .by{font-size:15px;margin-top:6px}
  .done .back{font-size:13px;color:var(--c-muted);margin-top:18px}

  .err{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:0 10px}
  .err .big{width:72px;height:72px;border-radius:50%;background:var(--c-bad-bg);color:var(--c-bad);display:grid;place-items:center}
  .err .big svg{width:38px;height:38px}
  .err b{font-size:19px}
  .err p{margin:0;font-size:14px;color:var(--c-muted)}
  .err small{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--c-muted)}
  /* узкий экран (360×640): шапка и отступы сжимаются, QR меньше — всё влезает без прокрутки */
  .compact .appbar{padding:6px 16px 10px} .compact .appbar h2{font-size:21px;margin-top:8px}
  .compact .logo{width:28px;height:28px;font-size:12px}
  .compact .body{padding:10px 16px;gap:10px}
  .compact .state{padding:8px 12px} .compact .state span{font-size:12px}
  .compact .qrbox{padding:12px 12px 10px;gap:8px}
  .compact .banner{padding:7px 10px;font-size:12px}
  .compact .tabs span{padding:7px 0 5px}
  .compact .done .time{font-size:46px} .compact .done .big{width:68px;height:68px;margin-bottom:4px}
  .compact .err .big{width:56px;height:56px}
  .phone.overflow{outline-color:var(--c-bad)}

  /* установка на iPhone */
  .safari{flex:none;display:flex;justify-content:space-around;align-items:center;background:#F2F2F4;border-top:1px solid #D6D6DA;padding:10px 0 calc(var(--safe-bottom) + 4px);color:#0A84FF;font-size:22px}
  .safari svg{width:22px;height:22px}
  .safari .hl{outline:2px solid var(--c-lime-ink);outline-offset:5px;border-radius:4px}
  .dim{position:absolute;inset:0;background:rgba(17,24,28,.45)}
  .sheet{position:absolute;left:12px;right:12px;bottom:calc(var(--safe-bottom) + 64px);background:#fff;padding:18px 18px 12px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
  .sheet .st{font-size:18px;display:block}
  .sheet p{margin:4px 0 12px;font-size:13px;color:var(--c-muted)}
  .sheet ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
  .sheet li{display:flex;gap:10px;align-items:center;font-size:14px}
  .sheet .n{flex:none;width:24px;height:24px;background:var(--c-dark);color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px}
  .sheet .inl{width:18px;height:18px;vertical-align:-4px;color:#0A84FF}
  .ghost{border:0;background:none;color:var(--c-muted);font-weight:700;font-size:14px;padding:12px 0 2px;width:100%}
  .sheet .arrow{position:absolute;left:50%;bottom:-10px;margin-left:-10px;width:20px;height:20px;background:#fff;transform:rotate(45deg)}

  .btn{border:0;background:var(--c-lime);color:var(--c-dark);font-weight:800;font-size:16px;padding:14px 22px;width:100%;margin-top:10px;border-radius:var(--radius)}
  /* две кнопки «Отметить приход / уход» (Oleg 24.11): крупные, во всю ширину; главная — лайм, вторая — контур */
  .acts2{display:flex;flex-direction:column;gap:10px;margin-top:auto}
  .acts2 .btn{margin:0;padding:22px;font-size:19px;display:flex;align-items:center;justify-content:center;gap:12px}
  .acts2 .btn svg{width:24px;height:24px}
  .btn.line{background:#fff;color:var(--c-ink);border:1px solid #C9D2D6}
  .compact .acts2 .btn{padding:16px;font-size:17px}
  /* подпись над кодом: на какое действие код */
  .for{align-self:stretch;text-align:center;font-weight:800;font-size:17px;padding:6px 0;background:var(--c-ok-bg);color:var(--c-ok)}
  .for.out{background:var(--c-ground);color:var(--c-dark)}
  .compact .for{font-size:15px;padding:4px 0}
  .ghost.cancel{padding:4px 0 0;font-size:15px}

  /* вход */
  .login{flex:1;display:flex;flex-direction:column;justify-content:center;gap:10px;padding:0 6px}
  .login .logo.big{width:64px;height:64px;font-size:24px;margin-bottom:6px}
  .login > b{font-size:26px;font-weight:800} .login > span{color:var(--c-muted);margin-bottom:18px}
  .login label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--c-muted)}
  .login input{font:inherit;font-size:16px;color:var(--c-ink);padding:12px;border:1px solid var(--c-line);background:#fff;border-radius:0}

  /* живой прототип: телефон и пульт рядом */
  .work{display:flex;gap:40px;align-items:flex-start;flex-wrap:wrap}
  body[data-view="proto"] .controls{display:none}
  body[data-view="proto"] .notes{margin-top:8px}
  .pult{width:420px;max-width:100%;background:#fff;border:1px solid var(--c-line);font-size:14px}
  .pult .handle{display:none}
  .pult .pin{padding:16px 18px}
  .pult .ptitle{display:block;font-size:16px;margin-bottom:4px}
  .pult .how{margin:0 0 12px;color:var(--c-muted);font-size:13px;line-height:1.45}
  .acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .acts button{border:1px solid #C9D2D6;background:#fff;padding:11px 10px;font-weight:700;font-size:13px;text-align:left}
  .acts button.main{grid-column:1/-1;background:var(--c-dark);color:#fff;border-color:var(--c-dark);font-size:15px;text-align:center}
  .acts button:active{transform:translateY(1px)}
  .pctl{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
  .log{border-top:1px solid var(--c-line);padding-top:10px;font-size:12.5px;line-height:1.4;max-height:360px;overflow:auto}
  .log b{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--c-muted);margin-bottom:6px;font-family:ui-monospace,Menlo,monospace}
  .log div{padding:4px 0;border-bottom:1px dashed var(--c-line)}
  .log div:first-of-type{color:var(--c-ink);font-weight:600}

function qrSvg(code){

function qrBlock(st, code){

  if (left===0 && !net) veil = `<div class="veil bad">${ic('wifioff')}${t('qr.cantget')}<small>${t('qr.cantget.s')}</small></div>`;
  if (st.scanned) veil = `<div class="veil"><div class="spin"></div>${t('qr.scanned')}<small>${t('qr.scanned.s')}</small></div>`;
  const qr = left===0 ? '<div class="fallback" style="opacity:.25"></div>' : qrSvg(code);
  const pct = Math.max(0, left/TTL*100);
  return `<div class="qrbox"><div class="for ${st.intent==='out'?'out':''}">${t(st.intent==='out'?'qr.for.out':'qr.for.in')}</div><div class="qr">${qr}${veil}</div>

const dur = s => { s = Math.max(0, Math.floor(s/60)); const h = Math.floor(s/60), m = s%60;
  return (h ? `${h} ${t('u.h')} ` : '') + `${m} ${t('u.m')}`; };
const hm = s => { s = Math.max(0, Math.floor(s/60)); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); };
const mmss = s => Math.floor(s/60)+':'+String(Math.floor(s)%60).padStart(2,'0');

  if (!day || (!day.smoke && !day.lunch)) return t('done.nobrk');
  return pauseParts(day.smoke, Math.round((day.smokeSec||0)/60), day.lunch, Math.round((day.lunchSec||0)/60));
}

<h2>Как экран переходит из состояния в состояние</h2>
<p>Экран открыт — две кнопки, кода нет (1a). Рабочий нажал «Отметить приход» или «Отметить уход» — экран берёт код на это действие (1 или 6a); «Отмена» возвращает к кнопкам. Пока код на экране, раз в 2–3 секунды спрашивает, что с ним стало (<code>state</code>: live — ждём, consumed — отметка прошла, expired — срок вышел). Бригадир погасил код — экран показывает отметку (5 или 7) несколько секунд и возвращается <b>к кнопкам, а не к новому коду</b> (Oleg 24.11): после прихода — с плашкой «на объекте» и главной кнопкой «Отметить уход» (6), после ухода — «не отмечены» и главной «Отметить приход» (1a). Срок вышел, а отметки нет — сам берёт новый код на то же действие (2), без кнопки.</p>
<p>Связь пропала — код остаётся на экране, пока не вышел срок (3): срок и одноразовость проверяет движок в момент гашения по сети бригадира, так что код годен. Срок вышел без связи — кода нет, экран ждёт сеть (4) и обновится сам.</p>
<p>Ошибка выдачи (8): 5xx и обрыв по таймауту — «попробовать снова»; <code>403 PASS_ISSUER_FORBIDDEN</code> — человеку не положен код: тот же экран без кнопки, тексты <code>err.403.t</code> и <code>err.403.s</code> в таблице переводов; <code>404 PASS_NOT_CONFIGURED</code> — ошибка настройки стенда, текст тот же, что у 5xx.</p>

<h2>Размеры: экран подстраивается</h2>
<p>Приложение — для Android и iPhone, поэтому экран не привязан к одному размеру. В макете три опорных: узкий Android 360×640, iPhone 14/15 390×844 и большой iPhone 430×932 (CSS-пиксели). Безопасные зоны берутся у системы (<code>env(safe-area-inset-*)</code>); в макете — 24/0, 47/34 и 59/34.</p>
<p>Правило: всё на экране кода видно без прокрутки. QR — самый большой квадрат, который влезает: 188 на узком, 236 на обычном, 264 на большом; меньше 180 не делать — с 40–60 см его хуже читает камера бригадира. На узком экране (по высоте меньше 700) шапка и отступы сжимаются. Ширина текста — по экрану, длинные венгерские фразы переносятся.</p>
<p>Шрифт Plus Jakarta Sans; лайм <code>#C7FF00</code> и графит <code>#343A42</code> — с ldvill.com; углы прямые.</p>

<h2>Первый вход на iPhone: установка (9)</h2>
<p>На iPhone приложение ставится только из Safari через «Поделиться», затем «На экран „Домой“». Экран показывает шторку с тремя шагами, когда открыт в Safari на iOS и не с экрана «Домой» (<code>navigator.standalone === false</code>). Код под шторкой продолжает жить: бригадир может сканировать и до установки. «Позже» прячет шторку до следующего открытия. Названия пунктов в шагах — как в меню iOS на языке телефона. На Android установку предлагает сам Chrome (<code>beforeinstallprompt</code>), отдельной подсказки не нужно.</p>

  intent(kind){ P.intent = kind==='out' ? 'out' : 'in'; P.tab='code'; logEv(`Рабочий нажал «${P.intent==='out'?'Отметить уход':'Отметить приход'}».`); fetchCode(); },
  cancel(){ toButtons(); logEv('Рабочий нажал «Отмена» — код убран, на экране снова кнопки.'); },
  tab(arg){ if (arg==='days' && !P.shifts) return; P.tab = arg==='days' ? 'days' : 'code'; logEv(P.tab==='days' ? 'Рабочий открыл «Мои смены».' : 'Рабочий вернулся на «Мой код».'); },
  /* Бригадир в два шага, как в foreman.html: камера прочла код (карточка регистрации) → «Подтвердить». */
  scan(){
    if (P.screen!=='app' || P.phase!=='live'){ logEv('Бригадир навёл камеру — на экране рабочего сейчас нет кода. Рабочему нужно нажать «Отметить приход» или «Отметить уход».'); return; }
    if (P.consumed){ logEv('Бригадир сканирует — движок: «код уже использован».'); return; }
    if (P.scanned){ logEv('Код уже прочитан, бригадир ещё не подтвердил.'); return; }
    const action = P.intent==='out' ? 'close' : 'open';
    // Код несёт намерение: движок не выбирает сам, а сверяет его с тем, что есть. Не сходится — ничего не меняет.
    if (action==='open' && P.serverOn){ logEv(`Бригадир отсканировал код на приход, а рабочий уже на объекте с ${P.serverOn.since}. Движок ничего не меняет, код не тратится; бригадир видит «уже на объекте».`); return; }
    if (action==='close' && !P.serverOn){ logEv('Бригадир отсканировал код на уход, а прихода нет. Движок ничего не меняет, код не тратится; бригадир видит «прихода нет».'); return; }
    P.scanned = true;
    logEv(`Камера бригадира ${FOREMAN} прочла код: на его экране карточка «${WORKER.name} · ${action==='open'?'приход':'уход'} · ${hhmm(P.clock)}» и кнопка «Подтвердить». У рабочего код закрыт «ждём подтверждения».`);
  },
  confirm(){
    if (!P.scanned){ if (P.phase==='live') { ACT.scan(); if (!P.scanned) return; } else { logEv('Подтверждать нечего: бригадир ещё ничего не отсканировал.'); return; } }
    const action = P.intent==='out' ? 'close' : 'open', time = hhmm(P.clock);
    P.consumed = true; P.scanned = false;
    P.serverOn = action==='open' ? {since:time} : null;
    logEv(`Бригадир ${FOREMAN} нажал «Подтвердить»: ${action==='open'?'ПРИХОД':'УХОД'}, время сервера ${time}, объект ${OBJ}.`);
    if (P.online) later(1500, ()=>showDone({action, time}));
    else { P.pending = {action, time}; logEv('У телефона рабочего нет сети — он узнает об отметке, когда связь вернётся.'); }
  },
  brk(kind){
    if (!P.onSite || P.pause) return;
    P.pause = {kind: kind==='lunch'?'lunch':'smoke', from:P.clock};
    logEv(`Рабочий нажал «${kind==='lunch'?'Обед':'Перекур'}» — таймер работы встал, идёт таймер паузы (${P.pause.kind==='smoke'?P.smokeMin:SET.lunchMin} мин по «Настройкам»).`);
  },
  brkback(){
    if (!P.pause) return;
    P.pause.to = P.clock; P.pauses.push(P.pause);
    logEv(`Рабочий нажал «Вернулся»: ${BRK[P.pause.kind]} ${mmss(pauseSec(P.pause))}. Таймер работы продолжает.`); P.pause = null;
  },
  skip(sec){
    const s = Number(sec)||7200; P.clock += s;
    if (P.phase==='live'){ P.left = 0; logEv(`Прошло ${s>=3600?s/3600+' ч':s/60+' мин'} — код за это время истёк, экран берёт новый.`); fetchCode(); return; }
    logEv(`Прошло ${s>=3600?s/3600+' ч':s/60+' мин'}.` + (P.pause ? ' Рабочий всё ещё на паузе — идёт её таймер.' : P.onSite ? ' Таймер «На работе» ушёл вперёд.' : ''));
  },
  shifts(){ P.shifts = !P.shifts; if (!P.shifts) P.tab='code';
    logEv(P.shifts ? 'Дорин дал рабочему право видеть свои смены («Люди») — внизу появилась вкладка «Мои смены».' : 'Дорин убрал право видеть смены — вкладки «Мои смены» нет, нижнего меню нет.'); },
  breaks(){ P.breaks = !P.breaks; if (!P.breaks && P.pause) ACT.brkback();
    logEv(P.breaks ? 'Дорин включил паузы в «Настройках» — у рабочего кнопки «Перекур» и «Обед».' : 'Дорин выключил паузы в «Настройках» — кнопок пауз нет.'); },
  smokemin(){ P.smokeMin = P.smokeMin===5 ? 10 : P.smokeMin===10 ? 15 : 5; logEv(`Дорин поставил перекур по умолчанию ${P.smokeMin} мин («Настройки»).`); },
  net(){
    P.online = !P.online;
    logEv(P.online ? 'Связь у телефона рабочего вернулась.' : 'Связь у телефона рабочего пропала. Код на экране ещё годен до конца срока.');
    if (P.online && P.pending){ const p=P.pending; P.pending=null; later(1500, ()=>showDone(p)); }
    else if (P.online && P.phase==='nocode') fetchCode();
  },
  rewind(){
    if (P.phase!=='live' || P.left<=4){ logEv('Перематывать нечего: код сейчас не идёт.'); return; }
    P.clock += P.left-4; P.left = 4; logEv('Перемотали к концу минуты.');
  },
  fail(){
    P.failNext = true; logEv('Сервер сломался: следующая выдача кода получит 503.');
    if (P.screen==='app' && ['live','nocode'].includes(P.phase)) fetchCode();
  },
  restart(){
    if (P.screen!=='app'){ logEv('Приложение и так на экране входа.'); return; }
    P.onSite = null; P.done = null; P.pending = null; P.pause = null; P.hint = needHint();
    logEv(P.serverOn
      ? 'Приложение перезапущено. Открытую отметку рабочего движок пока не отдаёт — экран покажет «не отмечены» и главной кнопкой приход, хотя рабочий на объекте. Нажмёт «Отметить приход» — бригадир увидит «уже на объекте», ничего не изменится; нужна кнопка «Отметить уход».'
      : 'Приложение перезапущено.');
    toButtons();
  },
  reset(){ resetProto(); },
  drawer(){ P.drawer = !P.drawer; renderPult(); },
};
function showDone(d){
  if (d.action==='close'){
    if (P.pause){ P.pause.to = P.clock; P.pauses.push(P.pause); P.pause = null; }
    d.day = dayOf();
    const inn = P.onSite?.since || '08:02', sm = Math.round(d.day.smokeSec/60), lm = Math.round(d.day.lunchSec/60);
    // Сегодняшняя смена — первой строкой «Моих смен»
    P.today = {isToday:1, work:d.day.work, date:'24.11', obj:OBJ, in:inn, out:d.time, smoke:[d.day.smoke, sm], lunch:[d.day.lunch, lm]};
    P.pauses = [];
  }
  P.phase='done'; P.done=d; P.onSite = d.action==='open' ? {since:d.time, sec:P.clock} : null;
  logEv(`Экран спросил «что стало с моим кодом» (POST /api/passes/status) — consumed: ${d.action==='open'?'приход':'уход'} ${d.time}, ${FOREMAN}.`
    + (d.day ? ` Итог дня: ${hm(d.day.work)} работы, паузы ${Math.round((d.day.smokeSec+d.day.lunchSec)/60)} мин.` : ''));
  // После отметки — назад к кнопкам, а не к новому коду: следующий код только по нажатию (Oleg 24.11)
  if (d.action==='close') later(8000, ()=>{ if (P.phase==='done') toButtons(); });  // итог дня читают дольше
  else later(4000, ()=>{ if (P.phase==='done') toButtons(); });
}
/* Пульт имитации прямо в экране телефона: только то, что имеет смысл сейчас (Oleg 24.11). */
function simBar(){
  const b = (act, label, go, arg) => `<button data-act="${act}" ${arg?`data-arg="${arg}"`:''} class="${go?'go':''}">${label}</button>`;
  let h = '';
  if (P.screen==='login') h = '<span style="color:#C9D5DB;font-size:13px">войдите — кнопка «Войти» на экране</span>';
  else if (P.tab==='days') h = '';
  else if (P.phase==='live' && !P.scanned) h = b('scan','📷 Бригадир отсканировал',true) + b('rewind','⏩ к концу минуты');
  else if (P.phase==='live' && P.scanned) h = b('confirm','✅ Бригадир подтвердил',true);
  else if (P.phase==='choose' && P.onSite) h = b('skip','⏩ Прошло 2 часа',true,'7200') + b('skip','+10 мин',false,'600');
  else if (P.phase==='choose') h = '<span style="color:#C9D5DB;font-size:13px">нажмите «Отметить приход»</span>';
  return `<div class="sim"><i>ИМИТАЦИЯ</i>${h}${b('drawer','⚙︎ ещё')}</div>`;
}
function protoState(){
  const day = P.onSite ? dayOf() : null;
  const base = {clock:hhmm(P.clock), net:P.online?undefined:false, since:P.onSite?.since, install:P.hint, intent:P.intent||'in',
    shifts:P.shifts, breaks:P.breaks, smokeMin:P.smokeMin, sim:simBar(), work:day?.work, day,
    pause: P.pause ? {kind:P.pause.kind, sec:pauseSec(P.pause)} : null};
  if (P.screen==='login') return {...base, id:'login', install:false, work:undefined};
  if (P.tab==='days') return {...base, id:'days', tab:'days', today:P.today, install:false};
  switch (P.phase){
    case 'choose':     return {...base, id: P.onSite ? (P.pause ? 'pause' : 'onsite') : 'choose'};
    case 'live':       return {...base, id: P.scanned ? 'scanned' : P.online ? (P.intent==='out'?'code-out':'code') : 'offline', left:P.left, scanned:P.scanned};
    case 'refreshing': return {...base, id:'refresh', left:0};
    case 'nocode':     return {...base, id:'offline-expired', left:0, net:false};
    case 'done':       return {...base, id: P.done.action==='open'?'done-in':'done-out', mark:P.done.time, day:P.done.day, install:false};
    case 'error':      return {...base, id:'error'};
    default:           return {...base, id:'refresh', left:0};
  }
}
setInterval(()=>{
  if (S.view!=='proto') return;
  P.clock++;
  if (P.screen==='app' && P.phase==='live' && !P.scanned){
    P.left--;
    if (P.left<=0){ logEv('Срок кода вышел.'+(P.online?' Экран сам берёт новый.':'')); fetchCode(); }
  }
  renderScreens();
}, 1000);

const BTN = [
  ['scan',   '📷 Бригадир отсканировал'],
  ['confirm','✅ Бригадир подтвердил'],
  ['skip',   '⏩ Прошло 2 часа', '7200'],
  ['skip',   '⏩ Прошло 10 минут', '600'],
  ['net',    null],
  ['rewind', '⏩ Перемотать к концу минуты'],
  ['fail',   '💥 Ошибка сервера'],
  ['restart','🔄 Перезапуск приложения'],
  ['reset',  '↺ Начать сначала'],
];
function renderPult(){
  const el = document.getElementById('pult'); if (!el) return;
  if (S.view!=='proto'){ el.hidden = true; return; }
  el.hidden = false;
  el.className = 'pult' + (P.drawer ? ' open' : '');
  const yn = v => v ? 'да' : 'нет';
  el.innerHTML = `<button class="handle" data-act="drawer">Пульт — остальной мир ${P.drawer?'▼':'▲'}</button>
    <div class="pin">
      <b class="ptitle">Пульт — остальной мир</b>
      <p class="how">Войдите, нажмите «Отметить приход» и покажите код. Бригадир — в два шага: «отсканировал» (камера прочла код) и «подтвердил». Дальше тикает «На работе»; «Прошло 2 часа» двигает время. Полоса «ИМИТАЦИЯ» в самом экране показывает нужную кнопку сейчас.</p>
      <div class="acts">${BTN.map(([a,l,arg])=>`<button data-act="${a}" ${arg?`data-arg="${arg}"`:''} class="${a==='scan'||a==='confirm'?'main':''}">${a==='net' ? (P.online?'📵 Связь пропала':'📶 Связь вернулась') : l}</button>`).join('')}</div>
      <p class="how" style="margin:14px 0 6px"><b>Что решает Дорин</b></p>
      <div class="acts">
        <button data-act="shifts">Право видеть смены: <b>${yn(P.shifts)}</b></button>
        <button data-act="breaks">Паузы включены: <b>${yn(P.breaks)}</b></button>
        <button data-act="smokemin">Перекур по умолчанию: <b>${P.smokeMin} мин</b></button>
      </div>
      <div class="pctl">${ctlHtml()}</div>
      <div class="log"><b>Что произошло</b>${P.log.map(e=>`<div><time>${e.at}</time>${e.text}</div>`).join('')}</div>
    </div>`;
}
function ctlHtml(){
  const seg = (id, items, cur) => `<span class="seg" data-seg="${id}">${items.map(([v,l])=>`<button data-v="${v}" aria-pressed="${v===cur}">${l}</button>`).join('')}</span>`;
  if (STANDALONE) return seg('lang', [['hu','hu'],['ru','ru'],['en','en']], S.lang); // размер — настоящий, доска — на компьютере
  return seg('lang', [['hu','hu'],['ru','ru'],['en','en']], S.lang) + seg('size', [['s','360'],['m','390'],['l','430']], S.size)
    + seg('view', [['proto',t('ctl.one')],['all',t('ctl.all')]], S.view);
}

function syncUrl(){ history.replaceState(null,'','?'+new URLSearchParams({lang:S.lang, view:S.view, size:S.size})); }
function setOpt(kind, v){ S[kind]=v; syncUrl(); render(); }
document.addEventListener('click', e=>{
  const a = e.target.closest('[data-act]');
  if (a && ACT[a.dataset.act]){
    // на телефоне пульт после действия сворачивается — сразу видно, что стало с экраном
    if (a.dataset.act!=='drawer' && (STANDALONE || matchMedia('(max-width:460px)').matches)) P.drawer = false;
    ACT[a.dataset.act](a.dataset.arg); renderScreens(); renderPult(); return;
  }
  const b = e.target.closest('[data-seg] button, #seg-lang button, #seg-view button, #seg-size button');
  if (b){ const kind = b.parentElement.dataset.seg || b.parentElement.id.replace('seg-',''); setOpt(kind, b.dataset.v); }
});
resetProto();
render();
/* Как у чернового приложения: оболочка в кэше, открывается и без сети (sw.js рядом). */
if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
