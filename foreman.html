<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LD Brigád — рабочее место бригадира · LD Vill</title>
<meta name="theme-color" content="#213946">
<!-- Ставится на телефон как приложение (PWA): на iPhone — «Поделиться → На экран „Домой“», на Android — «Установить». -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LD Brigád">
<link rel="manifest" href="foreman.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<!--
  Чистовой макет рабочего места бригадира LD Vill (TG-444). Пара к принятому «Мой код» рабочего (my-code.html):
  тот же каркас телефона, палитра, размеры, языки и установка значком.

  Что здесь:
    · живой прототип (вид по умолчанию): вход, открытие смены на объекте из справочника, сканер пропусков,
      «мои люди на смене», отчёт и закрытие смены (в том числе «Закрыть без их ухода»), прошлые смены только
      для чтения, меню с кодом для входа. Пульт играет остальной мир — рабочий показывает живой, просроченный
      или уже использованный код, чужой QR, связь, время дня, ошибка сервера; журнал пульта говорит, что
      произошло и какую точку движка звал экран. На телефоне пульт — выдвижная панель снизу;
    · доска всех состояний для обзора на компьютере (вид «все состояния»);
    · три размера экрана: узкий Android 360×640, iPhone 390×844, большой iPhone 430×932; тексты hu / ru / en;
    · решения, которые Oleg может поменять, и записка для разработчика — под прототипом.
  Адрес принимает ?lang=hu|ru|en&view=proto|all&size=s|m|l — для ссылок и снимков;
  ?debug красит рамку телефона, где содержимое не влезло (экраны со списками прокручиваются и не красятся).

  Экран входа, «Бригада» и «Впустить в приложение» (вопрос про значок, шаг 1, шаг 2) — экраны first, team, let,
  invite и code из login-qr.html (TG-443, вход по QR; «Впустить» — по замечанию Oleg 21.11)
  один в один: тексты, QR с шестью цифрами, 2 минуты, «Код истёк» и «Новый код», заблокированному кода нет.
  Весь путь входа (камера, 6 цифр, ошибки) живёт там; здесь обе кнопки входа сразу открывают приложение.
  Данные выдуманы, сервера нет.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<style>
  /* ══ ТОКЕНЫ LD VILL — те же, что в my-code.html ══ */
  :root{
    --c-dark:#213946;      /* шапка, нижняя панель */
    --c-ink:#343A42;       /* основной текст (графит с ldvill.com) */
    --c-muted:#6B7680;     /* вторичный текст */
    --c-line:#E2E7E9;      /* рамки */
    --c-surface:#FFFFFF;   /* карточки */
    --c-ground:#F5F7F7;    /* фон экрана */
    --c-lime:#C7FF00;      /* акцент: активная вкладка, главная кнопка (лайм с ldvill.com) */
    --c-lime-ink:#7FA300;  /* акцент на светлом фоне */
    --c-warn:#E8A100;      --c-warn-bg:#FFF6DD; --c-warn-ink:#7A5400;
    --c-bad:#D64545;       --c-bad-bg:#FDECEC;
    --c-ok:#2E9E5B;        --c-ok-bg:#E7F6EE;
    --font:"Plus Jakarta Sans","Segoe UI",Arial,sans-serif;
    --radius:2px;          /* бренд — прямые углы */
    /* размеры телефона */
    --ph-w:390px; --ph-h:844px; --safe-top:47px; --safe-bottom:34px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:#E9EEF0;color:var(--c-ink);font-family:var(--font);-webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit;cursor:pointer}

  /* ══ ПУЛЬТ МАКЕТА (не часть экрана) ══ */
  .deck{max-width:1440px;margin:0 auto;padding:20px 20px 40px}
  .deck h1{font-size:22px;margin:0 0 4px;font-weight:800}
  .deck .sub{color:var(--c-muted);margin:0 0 16px;font-size:14px}
  .controls{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;margin-bottom:20px}
  .seg{display:inline-flex;border:1px solid #C9D2D6;background:#fff}
  .seg button{border:0;background:none;padding:7px 12px;font-size:13px;font-weight:600}
  .seg button[aria-pressed="true"]{background:var(--c-dark);color:#fff}
  .ctl-l{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--c-muted);margin-right:6px;font-family:ui-monospace,Menlo,monospace}

  .stage{display:flex;flex-direction:column;gap:36px}
  .board{display:grid;grid-template-columns:repeat(auto-fill,minmax(440px,1fr));gap:28px 24px;justify-items:center}
  .sizes{display:flex;flex-wrap:wrap;gap:28px 40px;align-items:flex-end;margin-bottom:12px}
  .sec{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--c-muted);font-family:ui-monospace,Menlo,monospace;margin:8px 0 20px}
  .cell figcaption{margin-top:8px;font-size:13px;max-width:var(--ph-w)}
  .cell figcaption b{display:block;font-size:14px}
  .cell figcaption code{font-size:11px;color:var(--c-muted)}
  .cell figcaption .dec{display:inline-block;margin-top:4px;font-size:11px;font-weight:700;background:var(--c-warn-bg);color:var(--c-warn-ink);padding:1px 6px}
  figure{margin:0}

  .notes{max-width:860px;background:#fff;border:1px solid var(--c-line);padding:18px 20px;font-size:14px;line-height:1.5}
  .notes h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--c-muted);margin:18px 0 6px;font-family:ui-monospace,Menlo,monospace}
  .notes h2:first-child{margin-top:0}
  .notes table{border-collapse:collapse;width:100%;font-size:13px}
  .notes td,.notes th{border-top:1px solid var(--c-line);padding:5px 6px 5px 0;vertical-align:top;text-align:left}
  .notes code{font-size:12px;background:var(--c-ground);padding:0 3px}
  .notes ol.decisions li{margin-bottom:6px}
  .tag{display:inline-block;font-size:10px;font-weight:700;padding:1px 5px;letter-spacing:.04em;text-transform:uppercase}
  .tag.have{background:var(--c-ok-bg);color:var(--c-ok)}
  .tag.ask{background:var(--c-warn-bg);color:var(--c-warn-ink)}
  .tag.cli{background:var(--c-ground);color:var(--c-muted)}

  /* ══ ТЕЛЕФОН ══ */
  .phone{width:var(--ph-w);height:var(--ph-h);background:var(--c-ground);position:relative;overflow:hidden;
    outline:10px solid #11181C;border-radius:44px;box-shadow:0 18px 40px rgba(0,0,0,.18);display:flex;flex-direction:column}
  .top{flex:none}
  .sb{height:var(--safe-top);background:var(--c-dark);color:#fff;display:flex;align-items:flex-end;justify-content:space-between;padding:0 30px 8px;font-size:15px;font-weight:600;flex:none}
  .sb .net{font-size:12px;letter-spacing:.05em}
  .appbar{background:var(--c-dark);color:#fff;padding:10px 20px 16px;flex:none}
  .appbar .row{display:flex;align-items:center;gap:12px}
  .logo{width:34px;height:34px;background:var(--c-lime);color:var(--c-dark);display:grid;place-items:center;font-weight:800;font-size:14px;letter-spacing:-.02em}
  .who{line-height:1.2;flex:1;min-width:0}
  .who b{display:block;font-size:15px}
  .who span{font-size:12px;opacity:.7}
  .appbar h2{margin:14px 0 0;font-size:26px;font-weight:800;letter-spacing:-.01em}
  .appbar h2.long{font-size:20px;line-height:1.15}
  .appbar h2 small{display:block;font-size:13px;font-weight:600;opacity:.7;margin-top:3px}
  .appbar .ham{border:0;background:none;color:#fff;width:34px;height:34px;display:grid;place-items:center;padding:0}
  .appbar .ham svg{width:24px;height:24px}
  .appbar .backb{border:0;background:none;color:#fff;padding:0;font-size:14px;font-weight:700;display:flex;align-items:center;gap:4px;opacity:.85}
  .appbar .backb svg{width:18px;height:18px}

  .body{flex:1;overflow:hidden;padding:16px 20px;display:flex;flex-direction:column;gap:14px}
  .body.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch}
  .tabs{flex:none;display:flex;background:var(--c-dark);padding-bottom:var(--safe-bottom)}
  .tabs span{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0 6px;font-size:12px;font-weight:600;color:rgba(255,255,255,.6);border-top:3px solid transparent;cursor:pointer}
  .tabs span.on{color:#fff;border-top-color:var(--c-lime)}
  .tabs svg{width:22px;height:22px}

  .state{display:flex;gap:12px;align-items:flex-start;background:var(--c-surface);border:1px solid var(--c-line);padding:12px 14px}
  .state svg{flex:none;width:22px;height:22px;margin-top:1px}
  .state b{display:block;font-size:15px}
  .state span{font-size:13px;color:var(--c-muted)}
  .state.on{border-left:4px solid var(--c-ok)} .state.on svg{color:var(--c-ok)}
  .state.off svg{color:var(--c-muted)}

  .banner{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;font-size:13px;line-height:1.35}
  .banner svg{flex:none;width:20px;height:20px}
  .banner.warn{background:var(--c-warn-bg);color:var(--c-warn-ink);border-left:4px solid var(--c-warn)}
  .banner.bad{background:var(--c-bad-bg);color:var(--c-bad);border-left:4px solid var(--c-bad)}
  .banner.info{background:#fff;border:1px solid var(--c-line);border-left:4px solid var(--c-dark);color:var(--c-ink)}
  .banner b{display:block;font-size:14px}
  .banner ul{margin:4px 0 0;padding-left:18px}

  .qrbox{background:#fff;border:1px solid var(--c-line);padding:18px 18px 14px;display:flex;flex-direction:column;align-items:center;gap:12px}
  .qr{width:var(--qr);height:var(--qr);position:relative;display:grid;place-items:center}
  .qr svg{width:var(--qr);height:var(--qr);display:block}
  .qr .fallback{width:var(--qr);height:var(--qr);display:grid;place-items:center;background:repeating-conic-gradient(#343A42 0 25%,#fff 0 50%) 0 0/24px 24px;opacity:.85}
  .ttl{width:100%;height:6px;background:var(--c-line)}
  .ttl i{display:block;height:100%;background:var(--c-lime-ink);transition:width .9s linear}
  .ttl.low i{background:var(--c-warn)}
  .count{font-size:14px;color:var(--c-muted);font-variant-numeric:tabular-nums}
  .count b{color:var(--c-ink)}
  .hint{margin:0;text-align:center;font-size:13px;color:var(--c-muted)}

  .done{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;background:var(--c-ok-bg);border:1px solid #BFE5CF;padding:0 14px}
  .done .big{width:84px;height:84px;border-radius:50%;background:var(--c-ok);color:#fff;display:grid;place-items:center;margin-bottom:10px}
  .done .big svg{width:46px;height:46px}
  .done .what{font-size:16px;font-weight:700;color:var(--c-ok)}
  .done .time{font-size:56px;font-weight:800;letter-spacing:-.02em;line-height:1}
  .done .by{font-size:15px;margin-top:6px}
  .done .back{font-size:13px;color:var(--c-muted);margin-top:18px}
  .compact .appbar{padding:6px 16px 10px} .compact .appbar h2{font-size:21px;margin-top:8px} .compact .appbar h2.long{font-size:17px}
  .compact .logo{width:28px;height:28px;font-size:12px}
  .compact .body{padding:10px 16px;gap:10px}
  .compact .state{padding:8px 12px} .compact .state span{font-size:12px}
  .compact .qrbox{padding:12px 12px 10px;gap:8px}
  .compact .banner{padding:7px 10px;font-size:12px}
  .compact .tabs span{padding:7px 0 5px}
  .compact .done .time{font-size:46px} .compact .done .big{width:68px;height:68px;margin-bottom:4px}
  .phone.overflow{outline-color:var(--c-bad)}

  /* установка на iPhone — как в my-code.html */
  .safari{flex:none;display:flex;justify-content:space-around;align-items:center;background:#F2F2F4;border-top:1px solid #D6D6DA;padding:10px 0 calc(var(--safe-bottom) + 4px);color:#0A84FF;font-size:22px}
  .safari svg{width:22px;height:22px}
  .safari .hl{outline:2px solid var(--c-lime-ink);outline-offset:5px;border-radius:4px}
  .dim{position:absolute;inset:0;background:rgba(17,24,28,.45);z-index:6}
  .sheet{position:absolute;left:12px;right:12px;bottom:calc(var(--safe-bottom) + 64px);background:#fff;padding:18px 18px 12px;box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:7}
  .sheet .st{font-size:18px;display:block}
  .sheet p{margin:4px 0 12px;font-size:13px;color:var(--c-muted)}
  .sheet ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
  .sheet li{display:flex;gap:10px;align-items:center;font-size:14px}
  .sheet .n{flex:none;width:24px;height:24px;background:var(--c-dark);color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px}
  .sheet .inl{width:18px;height:18px;vertical-align:-4px;color:#0A84FF}
  .ghost{border:0;background:none;color:var(--c-muted);font-weight:700;font-size:14px;padding:12px 0 2px;width:100%}
  .sheet .arrow{position:absolute;left:50%;bottom:-10px;margin-left:-10px;width:20px;height:20px;background:#fff;transform:rotate(45deg)}

  .btn{border:0;background:var(--c-lime);color:var(--c-dark);font-weight:800;font-size:16px;padding:14px 22px;width:100%;margin-top:10px;border-radius:var(--radius);display:flex;align-items:center;justify-content:center;gap:10px}
  .btn svg{width:22px;height:22px}
  .btn.big{font-size:18px;padding:18px 22px;margin-top:0}
  .btn.dark{background:var(--c-dark);color:#fff}
  .btn.line{background:#fff;color:var(--c-ink);border:1px solid #C9D2D6}
  .btn[disabled]{background:var(--c-line);color:var(--c-muted);cursor:not-allowed}
  .btn.line[disabled]{background:#fff}
  .note-s{margin:0;font-size:12.5px;color:var(--c-muted);line-height:1.4}

  /* вход */
  .login{flex:1;display:flex;flex-direction:column;justify-content:center;gap:10px;padding:0 6px}
  .login .logo.big{width:64px;height:64px;font-size:24px;margin-bottom:6px}
  .login > b{font-size:26px;font-weight:800} .login > span{color:var(--c-muted);margin-bottom:18px}

  /* ══ ЭКРАНЫ БРИГАДИРА ══ */
  .h3{margin:4px 0 -4px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--c-muted);font-weight:700}
  .nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .nums div{background:#fff;border:1px solid var(--c-line);padding:8px 10px}
  .nums b{display:block;font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
  .nums span{font-size:12px;color:var(--c-muted)}
  .nums .here b{color:var(--c-ok)}
  .compact .nums b{font-size:20px}
  .people{background:#fff;border:1px solid var(--c-line)}
  .people .p{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--c-line)}
  .people .p:first-child{border-top:0}
  .people .dot{flex:none;width:10px;height:10px;border-radius:50%;background:var(--c-muted)}
  .people .p.in .dot{background:var(--c-ok)}
  .people .p.miss .dot{background:var(--c-warn)}
  .people .n{flex:1;font-weight:700;font-size:15px;min-width:0}
  .people .tm{font-size:13px;color:var(--c-muted);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
  .people .tm em{font-style:normal;color:var(--c-ok);font-weight:700}
  .people .tm .w{color:var(--c-warn-ink);font-weight:700}
  .compact .people .p{padding:7px 10px} .compact .people .n{font-size:14px}
  .empty{background:#fff;border:1px dashed #C9D2D6;padding:18px 14px;text-align:center;color:var(--c-muted);font-size:14px}

  .objs{display:flex;flex-direction:column;gap:8px}
  .obj{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--c-line);padding:12px 14px;text-align:left;width:100%}
  .obj svg{flex:none;width:22px;height:22px;color:var(--c-dark)}
  .obj b{display:block;font-size:15px}
  .obj span{font-size:13px;color:var(--c-muted)}
  .obj[disabled]{opacity:.6;cursor:not-allowed}
  .obj[disabled] span{color:var(--c-warn-ink);font-weight:600}
  .obj .go{margin-left:auto;color:var(--c-muted)}
  .compact .obj{padding:9px 12px}

  /* сканер: камера внутри приложения */
  .cam{flex:1;position:relative;background:radial-gradient(circle at 50% 40%,#3B4A52,#11181C 75%);display:flex;align-items:center;justify-content:center;min-height:240px}
  .cam .frame{width:62%;aspect-ratio:1;position:relative}
  .cam .frame i{position:absolute;width:34px;height:34px;border:4px solid var(--c-lime)}
  .cam .frame i:nth-child(1){left:0;top:0;border-right:0;border-bottom:0}
  .cam .frame i:nth-child(2){right:0;top:0;border-left:0;border-bottom:0}
  .cam .frame i:nth-child(3){left:0;bottom:0;border-right:0;border-top:0}
  .cam .frame i:nth-child(4){right:0;bottom:0;border-left:0;border-top:0}
  .cam .aim{position:absolute;left:0;right:0;top:14px;text-align:center;color:#fff;font-size:14px;font-weight:600;padding:0 16px}
  .res{position:absolute;left:12px;right:12px;bottom:12px;background:#fff;padding:14px 14px 12px;display:flex;gap:12px;align-items:flex-start;box-shadow:0 8px 24px rgba(0,0,0,.35);border-left:6px solid var(--c-ok)}
  .res .ri{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--c-ok);color:#fff}
  .res .ri svg{width:24px;height:24px}
  .res b{display:block;font-size:17px}
  .res .rt{font-size:30px;font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums}
  .res span{display:block;font-size:13px;color:var(--c-muted);margin-top:2px}
  .res small{display:block;font-family:ui-monospace,Menlo,monospace;font-size:10.5px;color:var(--c-muted);margin-top:4px}
  .res.out{border-left-color:var(--c-dark)} .res.out .ri{background:var(--c-dark)}
  .res.warn{border-left-color:var(--c-warn)} .res.warn .ri{background:var(--c-warn)}
  .res.bad{border-left-color:var(--c-bad)} .res.bad .ri{background:var(--c-bad)}
  .scanbar{display:flex;gap:10px;align-items:center}
  .scanbar .btn{margin:0;width:auto;flex:1}
  .scanbar .cnt{font-size:13px;color:var(--c-muted)}
  .scanbar .cnt b{color:var(--c-ink);font-size:18px}

  /* отчёт */
  .rep{display:flex;flex-direction:column;gap:6px}
  .rep label{font-size:13px;font-weight:700}
  .rep label i{font-style:normal;color:var(--c-bad)}
  .rep textarea{font:inherit;font-size:15px;color:var(--c-ink);border:1px solid #C9D2D6;background:#fff;padding:10px 12px;min-height:110px;resize:vertical;border-radius:0}
  .rep textarea.need{border-color:var(--c-warn)}
  .photos{display:flex;gap:8px;flex-wrap:wrap}
  .photos .ph{width:58px;height:58px;background:linear-gradient(135deg,#9FB0B8,#5E727C);display:grid;place-items:center;color:#fff}
  .photos .ph svg{width:20px;height:20px}
  .photos button{width:58px;height:58px;border:1px dashed #9FB0B8;background:#fff;color:var(--c-muted);display:grid;place-items:center;padding:0}
  .photos button svg{width:22px;height:22px}
  .ro{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--c-muted);background:#fff;border:1px solid var(--c-line);padding:4px 8px;align-self:flex-start}
  .ro svg{width:14px;height:14px}

  lang: LI[qs.get('lang')] !== undefined ? qs.get('lang') : 'ru',
  view: qs.get('view')==='all' ? 'all' : 'proto',   // по умолчанию — живой прототип

/* Открыт с экрана «Домой» (установленное приложение) — телефонный вид на весь экран, пульт за кнопкой в углу.

const INSTALLED = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true || qs.has('standalone');
/* Телефон в обычном браузере (сенсорный экран без наведения) — тот же вид на весь экран; ?desktop — служебный вид. */
const PHONE = !qs.has('desktop') && matchMedia('(pointer:coarse) and (hover:none)').matches;
const STANDALONE = INSTALLED || PHONE;
if (STANDALONE){ S.view = 'proto'; document.body.classList.add('standalone'); document.documentElement.classList.add('standalone'); }
/* Окно значка — фоны html и body цвета меню (TG-428), по navigator.standalone, а не по медиазапросу. */
if (INSTALLED) document.documentElement.classList.add('installed');
const nativeSize = () => innerWidth < 380 || innerHeight < 700 ? 's' : innerWidth < 420 ? 'm' : 'l';
// ?debug — красная рамка у телефона, где содержимое не влезло (кроме экранов со списками — они прокручиваются), и замер окна.
const DEBUG = qs.has('debug') || (INSTALLED && location.hostname === 'localhost');
function t(k, v={}){ const row=T[k]; if(!row) return k; let s=row[LI[S.lang]]; for(const [a,b] of Object.entries(v)) s=s.split('{'+a+'}').join(b); return s; }
const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* как в login-qr.html (TG-443): шесть цифр, токен в QR, «м:сс», «сегодня / вчера» */
const six = () => String(Math.floor(Math.random()*1e6)).padStart(6,'0');
const tok = n => { const a='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789'; let s=''; for(let i=0;i<n;i++) s+=a[Math.floor(Math.random()*a.length)]; return s; };
const mmss = s => Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
const when = w => w==null ? '' : w.d===0 ? t('when.today',{t:w.t}) : t('when.yday',{t:w.t});
const hhmm = s => String(Math.floor(s/3600)%24).padStart(2,'0')+':'+String(Math.floor(s/60)%60).padStart(2,'0');
const objName = id => OBJECTS.find(o=>o.id===id)?.name || '';

const ic = (n, cls='') => `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${IC[n]}</svg>`;

/* ══ ЭКРАН ══
   Один рендер на всё: экран рисуется из модели m — и живой прототип (модель P), и доска состояний (застывшие модели).
   m.screen: login · noshift · pick · shift · scan · close · closed · past · pastday · lcpick · lcode;
   поверх — m.sheet: confirm · menu; m.install — шторка установки. */
function marksStat(marks){
  const here = marks.filter(x=>!x.out && !x.miss).length, left = marks.filter(x=>x.out).length;
  // «всего» — люди, а не отметки: ушёл и вернулся — две отметки, но один человек
  return {here, left, all:new Set(marks.map(x=>x.n)).size};
}
function peopleList(marks){
  if (!marks.length) return `<div class="empty">${t('sh.empty')}</div>`;
  return `<div class="people">${marks.map(x=>{
    const cls = x.miss ? 'miss' : x.out ? 'out' : 'in';
    const tm = x.miss ? `${x.in} – <span class="w">${t('nomiss')}</span>` : x.out ? `${x.in} – ${x.out}` : `${x.in} · <em>${t('onsite')}</em>`;
    return `<div class="p ${cls}"><span class="dot"></span><span class="n">${esc(x.n)}</span><span class="tm">${tm}</span></div>`;
  }).join('')}</div>`;
}
function resultCard(r){
  if (!r) return '';
  const k = r.kind, ok = k==='in'||k==='out';
  const cls = k==='in' ? '' : k==='out' ? 'out' : k==='pending' ? 'warn' : 'bad';
  const icon = ok ? 'check' : k==='offline' ? 'wifioff' : 'alert';
  const code = {pending:'409 PASS_ARRIVAL_PENDING', expired:'409 pass_expired', used:'409 pass_already_used', unknown:'409 pass_unknown', offline:'—', error:'HTTP 503'}[k];
  if (ok) return `<div class="res ${cls}"><span class="ri">${ic(icon)}</span><div><b>${t(k==='in'?'r.in':'r.out')}</b>
      <div class="rt">${r.time}</div><span><b style="display:inline;font-size:15px">${esc(r.name)}</b> · ${t('r.next')}</span></div></div>`;
  return `<div class="res ${cls}"><span class="ri">${ic(icon)}</span><div><b>${t('r.'+k)}</b>${r.name?`<span><b style="display:inline;font-size:14px">${esc(r.name)}</b></span>`:''}
      <span>${t('r.'+k+'.s')}</span><small>${code}</small></div></div>`;
}
/* Строка человека и блок кода — из login-qr.html (TG-443) без изменений смысла. */
function personRow(p){
  const st = p.blocked ? `<span class="off">${ic('lock')}${t('ph.blocked')}</span>`
    : p.phone==='on' ? `<span class="on">${ic('phone')}${t('ph.on',{when: p.last ? when(p.last) : ''})}</span>`
    : `<span>${ic('clock')}${t('ph.none')}</span>`;
  return `<button class="prow" data-act="lclet" data-arg="${p.id}"><span class="ava">${esc(initials(p))}</span>
    <span class="tx"><b>${esc(full(p))}</b>${st}</span><span class="rtag">${t('role.'+p.role)}</span>${ic('go','go')}</button>`;
}
function codeBlock(c, p){
  let veil = '', count = '';
  if (c.used) veil = `<div class="veil ok">${ic('check')}${t('code.ok',{name:esc(full(p))})}<small>${t('code.ok.s')}</small></div>`;
  else if (c.left<=0) veil = `<div class="veil bad">${ic('clock')}${t('code.expired')}</div>`;
  else count = t('code.left',{t:mmss(c.left)});
  const live = !c.used && c.left>0;
  return `<div class="qrbox"><div class="qr">${live ? qrSvg('LDV1:'+c.digits+':'+c.tok) : '<div class="fallback" style="opacity:.2"></div>'}${veil}</div>
    ${live ? `<div class="count">${t('code.or')}</div>` : ''}
    <div class="digits ${live?'':'dead'}">${c.digits.slice(0,3)} ${c.digits.slice(3)}</div>
    <div class="ttl ${c.left<=20?'low':''}"><i style="width:${live ? c.left/CODE_TTL*100 : 0}%"></i></div>
    <div class="count">${count||'&nbsp;'}</div></div>`;
}
function qrSvg(code){
  if (!window.qrcode) return '<div class="fallback"></div>';
  const q = qrcode(0,'M'); q.addData(code); q.make(); return q.createSvgTag({cellSize:6, margin:0, scalable:true});
}
function body(m){

  switch (m.screen){
    case 'login':   // экран «first» из login-qr.html (TG-443): весь путь скана и 6 цифр — там; здесь обе кнопки входят сразу
      return `<div class="login"><div class="logo big">LD</div><b>${t('first.t')}</b><span>${t('first.s')}</span>
        <button class="btn" data-act="login">${ic('camera')}${t('first.scan')}</button>
        <button class="btn line" data-act="login">${t('first.dig')}</button>
        <p class="note c">${t('first.nopass')}</p></div>`;
    case 'noshift':
      return `<div class="state off">${ic('pin')}<div><b>${t('ns.t')}</b><span>${t('ns.s')}</span></div></div>
        ${m.lastClosed ? `<p class="note-s">${t('ns.after',{obj:esc(objName(m.lastClosed))})}</p>` : ''}
        <button class="btn big" data-act="pick">${ic('pin')}${t('ns.start')}</button>
        <button class="btn line" disabled>${ic('scan')}${t('ns.noscan')}</button>`;
    case 'pick':
      return `<div class="banner info">${ic('alert')}<div><b>${t('pk.rule1')}</b>${t('pk.rule2')}<br>${t('pk.rule3')}</div></div>
        ${offBanner(t('cf.offline'))}
        <div class="objs">${OBJECTS.map(o=>{

          return `<button class="obj" data-act="choose" data-arg="${o.id}" ${busy?'disabled':''}>${ic('pin')}<div><b>${esc(o.name)}</b>
            <span>${busy ? t('pk.busy',{who:esc(o.busy)}) : esc(o.addr)}</span></div>${busy?'':`<span class="go">${ic('chev')}</span>`}</button>`;
        }).join('')}</div>`;
    case 'shift': {
      const st = marksStat(m.shift.marks);

        <div class="nums"><div class="here"><b>${st.here}</b><span>${t('n.here')}</span></div><div><b>${st.left}</b><span>${t('n.left')}</span></div><div><b>${st.all}</b><span>${t('n.all')}</span></div></div>
        <button class="btn big" data-act="scan">${ic('scan')}${t('sh.scan')}</button>
        <div class="h3">${t('sh.mine')}</div>
        ${peopleList(m.shift.marks)}
        <button class="btn line" data-act="toclose">${t('sh.close')}</button>`;
    }
    case 'scan': {
      const st = marksStat(m.shift.marks);
      return `<div class="cam"><div class="aim">${t('sc.aim')}</div><div class="frame"><i></i><i></i><i></i><i></i></div>${resultCard(m.res)}</div>
        <div class="scanbar"><span class="cnt">${t('sc.here',{n:st.here})}</span><button class="btn dark" data-act="scandone">${t('sc.done')}</button></div>`;
    }
    case 'close': {
      const open = m.shift.marks.filter(x=>!x.out && !x.miss);
      const filled = (m.report||'').trim().length > 0;
      const dis = !filled || !net;
      return `${offBanner(t('cl.offline'))}
        <div class="rep"><label for="rep">${t('cl.rep')} <i>*</i></label>
          <textarea id="rep" data-in="report" class="${filled?'':'need'}" placeholder="${esc(t('cl.rep.ph'))}">${esc(m.report||'')}</textarea>
          <p class="note-s" id="rep-need" ${filled?'hidden':''}>${t('cl.rep.need')}</p></div>
        <div class="rep"><label>${t('cl.photo')}</label><div class="photos">${'<span class="ph">'+ic('img')+'</span>'.repeat(m.photos||0)}${(m.photos||0)<4?`<button data-act="photo" aria-label="+">${ic('cam')}</button>`:''}</div></div>
        ${open.length ? `<div class="banner warn">${ic('alert')}<div><b>${t('cl.miss.t',{n:open.length})}</b><ul>${open.map(x=>`<li>${esc(x.n)} · ${x.in}</li>`).join('')}</ul>${t('cl.miss.s')}</div></div>` : ''}
        <button class="btn ${open.length?'dark':''}" id="close-btn" data-act="close" ${dis?'disabled':''}>${t(open.length?'cl.btn.miss':'cl.btn')}</button>`;
    }
    case 'closed': {
      const c = m.closedInfo;
      return `<div class="done"><div class="big">${ic('check')}</div><div class="what">${t('cd.what')}</div>
        <div class="time">${c.to}</div><div class="by">${t('cd.sum',{obj:'<b>'+esc(c.obj)+'</b>',n:c.marks.length})}</div>
        ${c.miss ? `<div class="by" style="color:var(--c-warn-ink);font-weight:700">${t('cd.miss',{n:c.miss})}</div>` : ''}
        <div class="back">${t('cd.sent')}</div></div>
        <button class="btn" data-act="pick">${t('cd.new')}</button>`;
    }
    case 'past':
      return (m.past||PAST0).map((d,i)=>{
        const miss = d.marks.filter(x=>x.miss).length;
        return `<button class="day ${d.today?'today':''}" data-act="pastday" data-arg="${i}"><b>${d.today?t('pa.today')+' · ':''}${d.date} · ${esc(d.obj)}</b>
          <span>${t('pa.line',{from:d.from,to:d.to,n:d.marks.length})}${miss?` · <span class="w">${t('pa.miss',{n:miss})}</span>`:''}</span></button>`;
      }).join('');
    case 'pastday': {
      const d = (m.past||PAST0)[m.pastIdx||0];
      return `<span class="ro">${ic('lock')}${t('ro')}</span>
        <div class="h3">${t('pd.people')}</div>${peopleList(d.marks)}

    }
    case 'lcpick':  // экран «team» из login-qr.html (TG-443)
      return `<div class="list">${TEAM.map(p=>personRow(p)).join('')}</div>
          <p class="note">${t('team.hint')}</p>`;
    case 'lclet': { // экран «let» из login-qr.html (TG-443): «значок уже есть?»
      const p = TEAM.find(x=>x.id===m.lcFor);
      return `<div class="pcard"><b style="font-size:17px">${esc(full(p))}</b><span class="note">${t('let.t',{name:esc(p.name)})}</span></div>

          <button class="btn" data-act="lcode" data-arg="${p.id}">${ic('key')}${t('let.yes')}</button>

          <p class="note">${t('let.unsure')}</p>`;
    }
    case 'lcinv': { // экран «invite» из login-qr.html (TG-443): шаг 1, QR ставит приложение
      const p = TEAM.find(x=>x.id===m.lcFor);
      return `<p class="note" style="color:var(--c-ink);font-weight:700;font-size:15px">${t('inv.t',{name:esc(p.name)})}</p>
          <div class="qrbox"><div class="qr">${qrSvg('https://ldvill.theguild.hu/app/join#'+(m.lcInv||'Hq7tKpZ2mX'))}</div></div>
          <p class="note">${t('inv.s')}</p>
          <button class="btn" data-act="lcode" data-arg="${p.id}">${t('inv.code')}</button>`;
    }
    case 'lcode': { // экран «code» из login-qr.html (TG-443): шаг 2
      const p = TEAM.find(x=>x.id===m.lc.forId);
      return `<p class="note" style="color:var(--c-ink);font-weight:700;font-size:15px">${t('code.how',{name:esc(p.name)})}</p>
          ${codeBlock(m.lc, p)}
          ${m.lc.used ? '' : `<button class="btn line sm" data-act="lcode" data-arg="${p.id}">${t('code.new')}</button>`}`;
    }
  }
  return '';
}
/* Шапка: у экранов первого уровня — имя и меню, у вложенных — «Назад». */
function appbar(m){
  const back = {pick:'home', pastday:'past', lcpick:'home', lclet:'lcpick', lcinv:'lclet', lcode:'lclet'}[m.screen];
  let title = '', cls = '';
  switch (m.screen){
    case 'noshift': title = t('t.noshift'); break;
    case 'pick': title = t('t.pick'); break;
    case 'shift': case 'scan': title = esc(objName(m.shift.obj)) + `<small>${t(m.screen==='scan'?'t.scan':'tab.shift')}</small>`; cls='long'; break;
    case 'close': title = t('t.close') + `<small>${esc(objName(m.shift.obj))}</small>`; cls='long'; break;
    case 'closed': title = t('t.closed'); break;
    case 'past': title = t('t.past'); break;
    case 'pastday': { const d=(m.past||PAST0)[m.pastIdx||0]; title = d.date+' · '+esc(d.obj); cls='long'; break; }
    case 'lcpick': title = t('tab.team'); break;
    case 'lclet': title = t('let.title'); break;
    case 'lcinv': title = t('inv.title'); break;
    case 'lcode': title = t('code.title'); break;
  }
  const lead = back
    ? `<button class="backb" data-act="back" data-arg="${back}">${ic('back')}${t('back')}</button><span class="who"></span>`
    : `<span class="logo">LD</span><div class="who"><b>${FOREMAN}</b><span>${t('app.role')}</span></div>`;
  const tail = m.screen==='close' ? `<button class="ham" data-act="back" data-arg="shift" aria-label="×">${ic('x')}</button>`
    : back ? '' : `<button class="ham" data-act="menu" aria-label="menu">${ic('menu')}</button>`;
  return `<div class="appbar"><div class="row">${lead}${tail}</div><h2 class="${cls}">${title}</h2></div>`;
}
function sheetHtml(m){
  if (m.sheet==='confirm'){
    return `<div class="dim" data-act="cancel"></div><div class="msheet"><b class="st">${t('cf.t')}</b>
      <p>${t('cf.s',{obj:'<b>'+esc(objName(m.chosen))+'</b>',time:hhmm(m.clock)})}</p>
      ${m.net===false ? `<div class="banner warn">${ic('wifioff')}<div>${t('cf.offline')}</div></div>` : ''}
      <button class="btn" data-act="open" ${m.net===false?'disabled':''}>${t('cf.ok')}</button>
      <button class="ghost" data-act="cancel">${t('cancel')}</button></div>`;
  }
  if (m.sheet==='menu'){
    return `<div class="dim" data-act="cancel"></div><div class="msheet"><b class="st">${t('mn.t')}</b>
      <button class="mi" data-act="lcpick">${ic('qr')}<span>${t('mn.code')}<small>${t('mn.code.s')}</small></span></button>
      <button class="mi" data-act="tab" data-arg="past">${ic('list')}<span>${t('mn.past')}</span></button>
      <div class="langs">${['hu','ru','en'].map(l=>`<button data-act="lang" data-arg="${l}" aria-pressed="${l===S.lang}">${l==='hu'?'Magyar':l==='ru'?'Русский':'English'}</button>`).join('')}</div>
      <button class="mi" data-act="logout">${ic('logout')}<span>${t('mn.out')}</span></button>
      <button class="ghost" data-act="cancel">${t('mn.close')}</button></div>`;
  }
  return '';
}

const SCROLL = ['pick','shift','close','past','pastday','lcpick'];
function phone(m, size, native){
  const d = DEV[size], ins = !!m.install, login = m.screen==='login';
  const vars = native ? `--qr:${d.qr}px;--qrc:${d.qrc}px`
    : `--ph-w:${d.w}px;--ph-h:${d.h}px;--safe-top:${d.top}px;--safe-bottom:${d.bottom}px;--qr:${d.qr}px;--qrc:${d.qrc}px`;
  const tabOn = ['past','pastday'].includes(m.screen) ? 'past' : 'shift';
  // Рисованная панель Safari — только в макете-доске: на настоящем телефоне Safari свой
  const bottom = ins && !native
    ? `<div class="safari"><span>‹</span><span>›</span><span class="hl">${ic('share')}</span><span>${ic('book')}</span><span>${ic('tabs')}</span></div>`
    : (login || m.screen==='scan') ? '<div class="tabs"></div>'
    : `<nav class="tabs"><span class="${tabOn==='shift'?'on':''}" data-act="tab" data-arg="home">${ic('users')}${t('tab.shift')}</span><span class="${tabOn==='past'?'on':''}" data-act="tab" data-arg="past">${ic('list')}${t('tab.past')}</span></nav>`;

<h2>Как экран переходит из состояния в состояние</h2>
<p>После входа — «Смена не открыта» (1): сканер закрыт, главная кнопка — «Начать смену на объекте». Выбор объекта (2) → подтверждение (3) → смена открыта (4). «Сканировать пропуск» открывает камеру (6); каждый скан даёт плашку итога внизу камеры, камера продолжает работать — можно сканировать очередь подряд. «Готово» — назад к смене (5). «Закрыть смену» (14): отчёт обязателен; если у кого-то нет ухода — список и кнопка «Закрыть без их ухода» (15). После закрытия (16) — можно открыть новую смену. Прошлые смены (17, 18) — вкладка снизу или пункт меню, только чтение.</p>
<p>Связь у бригадира пропала — открыть смену, отметить и закрыть смену нельзя: всё это проверяет сервер. Экран говорит об этом прямо, отчёт не теряется.</p>

`;

/* ══ ЖИВОЙ ПРОТОТИП ══
   Телефон бригадира ведёт себя как настоящий экран, а пульт играет «остальной мир»: рабочих с их кодами, сеть, сервер.
   Время — часы сервера. */
const P = {};
function resetProto(){
  TEAM.splice(0, TEAM.length, ...JSON.parse(TEAM0));
  Object.assign(P, {screen:'login', sheet:null, install:false, net:true, clock:7*3600+43*60+30, shift:null, res:null, resTimer:0,
    report:'', photos:0, chosen:null, closedInfo:null, lastClosed:null, past:PAST0.map(d=>({...d})), pastIdx:0,
    lc:null, failNext:false, worker:0, log:[], drawer:P.drawer||false});
  logEv('Бригадир открыл приложение — экран входа.');
}
function logEv(text){ P.log.unshift({at:hhmm(P.clock)+':'+String(P.clock%60).padStart(2,'0'), text}); if (P.log.length>40) P.log.pop(); renderPult(); }
const needHint = () => !INSTALLED && S.size!=='s';
const home = () => P.shift ? 'shift' : 'noshift';
function go(screen){ P.screen = screen; P.sheet = null; if (screen!=='scan') P.res = null; }
function scanRes(kind, name){
  P.res = {kind, name, time:hhmm(P.clock)};
  clearTimeout(P.resTimer);
  if (kind==='in' || kind==='out') P.resTimer = setTimeout(()=>{ P.res = null; if (S.view==='proto') renderScreens(); }, 4000);
}
const ACT = {
  login(){ go(home()); P.install = needHint(); logEv((P.shift ? 'Вход выполнен. Открытая смена на месте — движок её помнит.' : 'Вход выполнен. Смены нет — сканер закрыт, пока бригадир не отметится на объекте.')+(P.install?' Открыто в Safari на iPhone — шторка «как установить».':'')); },
  later(){ P.install=false; logEv('Бригадир нажал «Позже» — шторка спрятана.'); },
  pick(){ go('pick'); logEv('Выбор объекта из справочника системы.'); },
  choose(id){ P.chosen = id; P.sheet = 'confirm'; },
  cancel(){ P.sheet = null; },
  open(){
    if (!P.net){ logEv('Нет связи — смена не открыта.'); return; }
    if (P.failNext){ P.failNext=false; P.sheet=null; logEv('Движок ответил 503 на открытие смены — бригадир повторит.'); return; }
    P.shift = {obj:P.chosen, opened:hhmm(P.clock), marks:[]}; P.report=''; P.photos=0; go('shift');
    logEv(`Смена открыта: ${objName(P.chosen)}, ${P.shift.opened} по часам сервера (создан документ смены, переход «открыть»). Теперь можно сканировать.`);
  },
  scan(){ go('scan'); logEv('Бригадир открыл камеру в приложении. Теперь на пульте: «рабочий показывает код».'); },
  scandone(){ go('shift'); },
  toclose(){ go('close'); logEv('Экран закрытия смены: без отчёта кнопка не работает.'); },
  photo(){ P.photos = Math.min(4, P.photos+1); logEv('Бригадир добавил фото к отчёту (по желанию).'); },
  close(){
    if (!(P.report||'').trim()){ logEv('Отчёт пустой — смену не закрыть.'); return; }
    if (!P.net){ logEv('Нет связи — смена не закрыта, отчёт остаётся в телефоне.'); return; }
    const open = P.shift.marks.filter(x=>!x.out && !x.miss);
    open.forEach(x=>{ x.miss = true; });
    const info = {today:true, date:'21.11', obj:objName(P.shift.obj), from:P.shift.opened, to:hhmm(P.clock), report:P.report, photos:P.photos, marks:P.shift.marks, miss:open.length};
    P.past.unshift(info); P.closedInfo = info; P.lastClosed = P.shift.obj; P.shift = null; go('closed');
    logEv(`Смена закрыта${open.length?` без ухода у ${open.length} чел. (${open.map(x=>x.n).join(', ')}) — у них «уход не отмечен»`:''}. Отчёт ушёл руководителю.`);
  },
  tab(arg){ go(arg==='past' ? 'past' : home()); },
  back(arg){ go(arg==='home' ? home() : arg); },
  pastday(i){ P.pastIdx = +i; go('pastday'); },
  menu(){ P.sheet = 'menu'; },
  lang(l){ S.lang = l; P.sheet = null; syncUrl(); render(); },
  lcpick(){ go('lcpick'); },
  /* как toLet в login-qr.html (TG-443): «Впустить в приложение» спрашивает, есть ли значок; заблокированного не впустить */
  lclet(id){
    const p = TEAM.find(x=>x.id===+id);
    if (p.blocked){ logEv(`${full(p)} заблокирован — впустить его нельзя (движок откажет). Разблокировать может владелец.`); return; }
    P.lcFor = p.id; go('lclet');
    logEv(`«Впустить в приложение» для ${full(p)}: экран спрашивает, есть ли уже значок LD Vill на его телефоне.`);
  },
  lcinv(id){ P.lcFor = +id; P.lcInv = tok(10); go('lcinv'); logEv(`Значка нет — шаг 1: QR, который ставит приложение, для ${full(TEAM.find(x=>x.id===+id))}.`); },
  /* как showCode в login-qr.html (TG-443): шаг 2; заблокированному код не выпускается; «Новый код» гасит прежний */
  lcode(id){
    const p = TEAM.find(x=>x.id===+id);
    if (p.blocked){ logEv(`${full(p)} заблокирован — впустить его нельзя (движок откажет). Разблокировать может владелец.`); return; }
    P.lcFor = p.id; P.lc = {forId:p.id, digits:six(), tok:tok(16), left:CODE_TTL, used:false}; go('lcode');
    logEv(`Бригадир показал код для входа для ${full(p)}: ${P.lc.digits}, живёт ${CODE_TTL/60} мин, срабатывает один раз (движок: выдать код входа — новая точка, TG-443).`);
  },
  logout(){ go('login'); logEv('Бригадир вышел. Открытая смена остаётся открытой на сервере.'); },

  /* остальной мир */
  show(kind){
    const name = WORKERS[P.worker];
    if (P.screen!=='scan'){ logEv(`${name} показывает код, но у бригадира не открыт сканер${P.shift?'':' — и смены нет: без чекина на объекте сканировать нельзя'}.`); return; }
    if (!P.net){ scanRes('offline', name); logEv('Камера прочитала код, но у бригадира нет сети — гасит сервер, отметки нет.'); return; }
    if (P.failNext){ P.failNext=false; scanRes('error', name); logEv('Движок ответил 503 на гашение кода.'); return; }
    if (kind==='expired'){ scanRes('expired', name); logEv(`${name}: просроченный код — 409 pass_expired.`); return; }
    if (kind==='used'){ scanRes('used', name); logEv(`${name}: уже погашенный код — 409 pass_already_used.`); return; }
    if (kind==='unknown'){ scanRes('unknown', ''); logEv('Камера прочитала чужой QR — 409 pass_unknown.'); return; }
    const open = P.shift.marks.find(x=>x.n===name && !x.out && !x.miss);
    if (open && P.clock - open.inSec < PENDING_SEC){ scanRes('pending', name); logEv(`${name}: приход только что отмечен, отметка ещё в очереди движка — 409 PASS_ARRIVAL_PENDING, код не потрачен.`); return; }
    const time = hhmm(P.clock);
    if (open){ open.out = time; scanRes('out', name); logEv(`Скан ${name} (POST …/documents/{смена}/pass/redeem): движок выбрал УХОД — открытая отметка есть. ${time}.`); }
    else { P.shift.marks.push({n:name, in:time, inSec:P.clock}); scanRes('in', name); logEv(`Скан ${name} (POST …/documents/{смена}/pass/redeem): движок выбрал ПРИХОД — открытой отметки нет. ${time}.`); }
  },
  signedin(){
    if (P.screen!=='lcode' || !P.lc || P.lc.used || P.lc.left<=0){ logEv('Живого кода для входа на экране бригадира нет — входить нечем.'); return; }
    P.lc.used = true; const p = TEAM.find(x=>x.id===P.lc.forId); p.phone = 'on'; p.last = {d:0, t:hhmm(P.clock)};
    logEv(`${full(p)} вошёл по коду в своём значке — телефон привязан, этим кодом больше не войти.`);
  },
  net(){ P.net = !P.net; logEv(P.net ? 'Связь у бригадира вернулась.' : 'Связь у бригадира пропала.'); },
  hour(){ P.clock += 3600; logEv('Прошёл час.'); },
  fail(){ P.failNext = true; logEv('Сервер сломался: следующий запрос получит 503.'); },
  reset(){ resetProto(); },
  drawer(){ P.drawer = !P.drawer; renderPult(); },
  worker(i){ P.worker = +i; renderPult(); },
};
function protoModel(){ return {...P, id:P.screen}; }

  const states = STATES.map(s=>`<figure class="cell" id="cell-${s.id}">${phone(s, S.size)}
      <figcaption><b>${t('c.'+s.id)}</b>${t('c.'+s.id+'.d')}${['pick','confirm','close0','close','shift','closed'].includes(s.id)?`<br><span class="dec">${t('dec')}</span>`:''}<br><code>foreman · ${s.id} · ${DEV[S.size].w}×${DEV[S.size].h}</code></figcaption></figure>`).join('');
  return `<h3 class="sec">${t('sec.sizes')}</h3><div class="sizes">${sizes}</div>
    <h3 class="sec">${t('sec.states',{size:DEV[S.size].w+'×'+DEV[S.size].h})}</h3><div class="board">${states}</div>`;
}
function renderScreens(){
  document.getElementById('screens').innerHTML = screenHtml();
  // В режиме приложения шапка и меню прибиты к краям экрана (position:fixed), контенту нужны отступы на высоту шапки
  document.querySelectorAll('body.standalone .phone').forEach(ph => ph.style.setProperty('--top-h', ph.querySelector('.top').offsetHeight + 'px'));
  if (DEBUG) document.querySelectorAll('.phone .body:not(.scroll)').forEach(b=>{ if (b.scrollHeight > b.clientHeight + 1) b.closest('.phone').classList.add('overflow'); });
  if (DEBUG) measure();
}
/* ?debug — замер окна поверх экрана, как в my-code.html. */
function measure(){
  let box = document.getElementById('measure');
  if (!box){ box = document.createElement('pre'); box.id = 'measure';
    box.style.cssText = 'position:fixed;z-index:30;left:8px;top:45%;margin:0;padding:6px 8px;font:11px/1.35 monospace;background:rgba(255,255,255,.92);color:#000;border:1px solid red;pointer-events:none';
    document.body.appendChild(box); }
  const probe = document.createElement('div');
  probe.style.cssText = 'position:fixed;padding-bottom:env(safe-area-inset-bottom, 0px);padding-top:env(safe-area-inset-top, 0px)';
  document.body.appendChild(probe);
  const cs = getComputedStyle(probe), rect = sel => { const el = document.querySelector(sel); return el ? Math.round(el.getBoundingClientRect().bottom) : '—'; };
  box.textContent = [
    `screen ${screen.width}×${screen.height}`, `inner ${innerWidth}×${innerHeight}`,
    `visual ${Math.round(visualViewport?.height ?? 0)}`, `html ${document.documentElement.clientHeight}`,
    `safe top ${cs.paddingTop} bottom ${cs.paddingBottom}`,
    `phone.bottom ${rect('.phone')}  tabs.bottom ${rect('.tabs')}`,
    `standalone ${matchMedia('(display-mode: standalone)').matches} nav ${navigator.standalone}`,
  ].join('\n');
  probe.remove();
}
if (DEBUG){ addEventListener('resize', measure); setTimeout(measure, 1000); }
function render(){
  document.documentElement.lang = S.lang;
  document.querySelectorAll('[data-t]').forEach(el=>el.innerHTML=t(el.dataset.t));
  document.querySelectorAll('#seg-lang button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.v===S.lang));
  document.querySelectorAll('#seg-view button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.v===S.view));
  document.querySelectorAll('#seg-size button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.v===S.size));
  document.body.dataset.view = S.view;
  renderScreens();
  renderPult();
  document.getElementById('notes').innerHTML = NOTES;
}

/* Часы сервера идут; экран отчёта не перерисовывается (там идёт набор текста) — меняется только время в строке состояния. */
setInterval(()=>{
  if (S.view!=='proto') return;
  P.clock++;
  // как в login-qr.html: истёкший код сам не меняется — «Код истёк» и кнопка «Новый код»
  if (P.lc && !P.lc.used && P.lc.left>0){ P.lc.left--; if (P.lc.left===0) logEv('Срок кода для входа вышел. Бригадир может нажать «Новый код».'); }
  if (P.screen==='close'){ const sb=document.querySelector('.proto .sb span'); if (sb) sb.textContent=hhmm(P.clock); return; }
  renderScreens();
}, 1000);

const BTN = [
  ['show',    '📱 Рабочий показывает живой код', 'live'],
  ['show',    '⌛ Просроченный код', 'expired'],
  ['show',    '♻ Уже использованный код', 'used'],
  ['show',    '❓ Чужой QR (не пропуск)', 'unknown'],
  ['signedin','🔑 Человек вошёл по коду для входа'],
  ['net',     null],
  ['hour',    '⏩ Время дня +1 час'],
  ['fail',    '💥 Ошибка сервера'],
  ['reset',   '↺ Начать сначала'],
];
function renderPult(){
  const el = document.getElementById('pult'); if (!el) return;
  if (S.view!=='proto'){ el.hidden = true; return; }
  el.hidden = false;
  el.className = 'pult' + (P.drawer ? ' open' : '');
  el.innerHTML = `<button class="handle" data-act="drawer">Пульт — остальной мир ${P.drawer?'▼':'▲'}</button>
    <div class="pin">
      <b class="ptitle">Пульт — остальной мир</b>
      <p class="how">Войдите, начните смену на объекте и откройте сканер. Кнопки ниже — то, что делают другие: рабочие со своими кодами, сеть, сервер. Первый скан рабочего — приход, второй — уход; скан того же рабочего сразу после прихода — «приход ещё в пути».</p>
      <p class="who-l">Кто показывает код:</p>
      <span class="seg workers">${WORKERS.map((w,i)=>`<button data-act="worker" data-arg="${i}" aria-pressed="${i===P.worker}">${esc(w)}</button>`).join('')}</span>
      <div class="acts">${BTN.map(([a,l,arg],i)=>`<button data-act="${a}" ${arg?`data-arg="${arg}"`:''} class="${i===0?'main':''}">${a==='net' ? (P.net?'📵 Связь пропала':'📶 Связь вернулась') : l}</button>`).join('')}</div>
      <div class="pctl">${ctlHtml()}</div>
      <div class="log"><b>Что произошло</b>${P.log.map(e=>`<div><time>${e.at}</time>${e.text}</div>`).join('')}</div>
    </div>`;
}
function ctlHtml(){
  const seg = (id, items, cur) => `<span class="seg" data-seg="${id}">${items.map(([v,l])=>`<button data-v="${v}" aria-pressed="${v===cur}">${l}</button>`).join('')}</span>`;
  if (STANDALONE) return seg('lang', [['hu','hu'],['ru','ru'],['en','en']], S.lang);
  return seg('lang', [['hu','hu'],['ru','ru'],['en','en']], S.lang) + seg('size', [['s','360'],['m','390'],['l','430']], S.size)
    + seg('view', [['proto',t('ctl.one')],['all',t('ctl.all')]], S.view);
}

function syncUrl(){ history.replaceState(null,'','?'+new URLSearchParams({lang:S.lang, view:S.view, size:S.size})); }
function setOpt(kind, v){ S[kind]=v; syncUrl(); render(); }
document.addEventListener('click', e=>{
  const a = e.target.closest('[data-act]');
  if (a && !a.disabled && ACT[a.dataset.act]){
    // доска состояний — только для обзора: нажатия внутри неё не двигают прототип
    if (a.closest('.board, .sizes')) return;
    const pultAct = !!a.closest('.pult');
    if (pultAct && !['drawer','worker'].includes(a.dataset.act) && (STANDALONE || matchMedia('(max-width:460px)').matches)) P.drawer = false;
    ACT[a.dataset.act](a.dataset.arg); renderScreens(); renderPult(); return;
  }
  const b = e.target.closest('[data-seg] button, #seg-lang button, #seg-view button, #seg-size button');
  if (b){ const kind = b.parentElement.dataset.seg || b.parentElement.id.replace('seg-',''); setOpt(kind, b.dataset.v); }
});
/* Текст отчёта — без перерисовки экрана (иначе пропадёт курсор): включаем кнопку закрытия на месте. */
document.addEventListener('input', e=>{
  if (e.target.dataset.in!=='report' || e.target.closest('.board, .sizes')) return;
  P.report = e.target.value;
  const filled = P.report.trim().length > 0;
  e.target.classList.toggle('need', !filled);
  const need = document.getElementById('rep-need'); if (need) need.hidden = filled;
  const btn = document.getElementById('close-btn'); if (btn) btn.disabled = !filled || !P.net;
});
resetProto();
render();
/* Как у «Мой код»: оболочка в кэше, открывается и без сети (sw.js рядом). */
if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
